<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">ODD · Dos rutas, una misma exigencia</title><desc id="d">Dos rutas tras clasificar una petición: trabajo comprendido y sustancial.</desc><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" stroke="#018786" stroke-opacity=".14" fill="none"/></pattern><linearGradient id="halo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#018786" stop-opacity=".27"/><stop offset="1" stop-color="#FF9800" stop-opacity=".06"/></linearGradient></defs><rect width="1200" height="520" fill="#0F172A"/><rect width="1200" height="520" fill="url(#grid)"/><style>.large{font:700 78px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:-2px;fill:#F8FAFC}.mid{font:600 29px system-ui,-apple-system,Segoe UI,sans-serif;fill:#F8FAFC}.small{font:500 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#CBD5E1}.eyebrow{font:700 18px system-ui,sans-serif;letter-spacing:4px;fill:#FF9800}</style><text x="58" y="61" class="mid">ODD · Dos rutas, una misma exigencia</text><rect x="62" y="95" width="1076" height="72" rx="20" fill="#153B3D" stroke="#018786" stroke-width="2"/><text x="600" y="141" text-anchor="middle" class="mid">Explorar / clasificar</text><path d="M600 167V208 M330 208H870 M330 208V234 M870 208V234" stroke="#CBD5E1" stroke-width="4" fill="none"/><rect x="83" y="235" width="494" height="57" rx="16" fill="#018786"/><rect x="623" y="235" width="494" height="57" rx="16" fill="#FF9800"/><text x="330" y="272" text-anchor="middle" class="mid">Cambio comprendido</text><text x="870" y="272" text-anchor="middle" style="font:600 28px system-ui;fill:#0F172A">Cambio sustancial</text><rect x="83" y="315" width="494" height="65" rx="16" fill="#1B2937" stroke="#018786"/><text x="330" y="356" text-anchor="middle" class="small">Código + tests</text><rect x="623" y="307" width="494" height="46" rx="14" fill="#1B2937" s