<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid-boeck-es" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid-boeck-es)"/>

  <text x="600" y="50" text-anchor="middle" fill="#FF9800" font-size="22" font-weight="700" letter-spacing="2">LOS TRES NIVELES DE MADUREZ</text>
  <text x="600" y="78" text-anchor="middle" fill="#FFFFFF" font-size="14" opacity="0.7">Birgitta Böckeler · Thoughtworks — adaptado</text>

  <!-- Columna 1: Spec-first -->
  <rect x="80" y="120" width="320" height="440" fill="none" stroke="#018786" stroke-width="2" rx="6"/>
  <rect x="80" y="120" width="320" height="50" fill="#018786" rx="6"/>
  <text x="240" y="152" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="2">SPEC-FIRST</text>

  <text x="100" y="195" fill="#FF9800" font-size="12" font-weight="700">HUMANO EDITA</text>
  <text x="100" y="215" fill="#FFFFFF" font-size="14">Spec + Código</text>
  <text x="100" y="255" fill="#FF9800" font-size="12" font-weight="700">IA EDITA</text>
  <text x="100" y="275" fill="#FFFFFF" font-size="14">Solo el código generado</text>

  <text x="100" y="325" fill="#FFFFFF" font-size="13" opacity="0.6">— — — — — — — — — — — — —</text>
  <text x="100" y="355" fill="#FFFFFF" font-size="13" font-weight="700">Cuándo usarlo</text>
  <text x="100" y="378" fill="#FFFFFF" font-size="13" opacity="0.85">Prototipos greenfield</text>
  <text x="100" y="398" fill="#FFFFFF" font-size="13" opacity="0.85">Scripts puntuales</text>
  <text x="100" y="418" fill="#FFFFFF" font-size="13" opacity="0.85">Spikes de investigación</text>

  <text x="100" y="465" fill="#FF9800" font-size="12" font-weight="700">Riesgo</text>
  <text x="100" y="488" fill="#FFFFFF" font-size="12" opacity="0.8">La spec se pudre</text>
  <text x="100" y="506" fill="#FFFFFF" font-size="12" opacity="0.8">en cuanto shipas.</text>
  <text x="100" y="528" fill="#FFFFFF" font-size="11" opacity="0.5">El código es la fuente real.</text>

  <!-- Columna 2: Spec-anchored -->
  <rect x="440" y="120" width="320" height="440" fill="none" stroke="#018786" stroke-width="2" rx="6"/>
  <rect x="440" y="120" width="320" height="50" fill="#018786" rx="6"/>
  <text x="600" y="152" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="700" letter-spacing="2">SPEC-ANCHORED</text>

  <text x="460" y="195" fill="#FF9800" font-size="12" font-weight="700">HUMANO EDITA</text>
  <text x="460" y="215" fill="#FFFFFF" font-size="14">Spec + Código (ambos)</text>
  <text x="460" y="255" fill="#FF9800" font-size="12" font-weight="700">IA EDITA</text>
  <text x="460" y="275" fill="#FFFFFF" font-size="14">Guiada por deltas de la spec</text>

  <text x="460" y="325" fill="#FFFFFF" font-size="13" opacity="0.6">— — — — — — — — — — — — —</text>
  <text x="460" y="355" fill="#FFFFFF" font-size="13" font-weight="700">Cuándo usarlo</text>
  <text x="460" y="378" fill="#FFFFFF" font-size="13" opacity="0.85">Releases de mantenimiento</text>
  <text x="460" y="398" fill="#FFFFFF" font-size="13" opacity="0.85">Evolución de contratos API</text>
  <text x="460" y="418" fill="#FFFFFF" font-size="13" opacity="0.85">Brownfield en producción</text>

  <text x="460" y="465" fill="#FF9800" font-size="12" font-weight="700">Riesgo</text>
  <text x="460" y="488" fill="#FFFFFF" font-size="12" opacity="0.8">Doble mantenimiento:</text>
  <text x="460" y="506" fill="#FFFFFF" font-size="12" opacity="0.8">spec y código divergen.</text>
  <text x="460" y="528" fill="#FFFFFF" font-size="11" opacity="0.5">Aquí gana brownfield.</text>

  <!-- Columna 3: Spec-as-Source -->
  <rect x="800" y="120" width="320" height="440" fill="none" stroke="#FF9800" stroke-width="3" rx="6"/>
  <rect x="800" y="120" width="320" height="50" fill="#FF9800" rx="6"/>
  <text x="960" y="152" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="700" letter-spacing="2">SPEC-AS-SOURCE</text>

  <text x="820" y="195" fill="#FF9800" font-size="12" font-weight="700">HUMANO EDITA</text>
  <text x="820" y="215" fill="#FFFFFF" font-size="14">Solo la spec</text>
  <text x="820" y="255" fill="#FF9800" font-size="12" font-weight="700">IA EDITA</text>
  <text x="820" y="275" fill="#FFFFFF" font-size="14">Regenera todo el código</text>

  <text x="820" y="325" fill="#FFFFFF" font-size="13" opacity="0.6">— — — — — — — — — — — — —</text>
  <text x="820" y="355" fill="#FFFFFF" font-size="13" font-weight="700">Cuándo usarlo</text>
  <text x="820" y="378" fill="#FFFFFF" font-size="13" opacity="0.85">APIs greenfield</text>
  <text x="820" y="398" fill="#FFFFFF" font-size="13" opacity="0.85">Sistemas schema-first</text>
  <text x="820" y="418" fill="#FFFFFF" font-size="13" opacity="0.85">CRUD de alto churn</text>

  <text x="820" y="465" fill="#FF9800" font-size="12" font-weight="700">Riesgo</text>
  <text x="820" y="488" fill="#FFFFFF" font-size="12" opacity="0.8">La spec debe ser 100%</text>
  <text x="820" y="506" fill="#FFFFFF" font-size="12" opacity="0.8">ejecutable. Sin escapes.</text>
  <text x="820" y="528" fill="#FFFFFF" font-size="11" opacity="0.5">El modelo de rol cambia. →</text>

  <text x="240" y="595" text-anchor="middle" fill="#FFFFFF" font-size="12" opacity="0.6">↑ Compromiso formal bajo</text>
  <text x="600" y="595" text-anchor="middle" fill="#FFFFFF" font-size="12" opacity="0.6">↑ Documento vivo</text>
  <text x="960" y="595" text-anchor="middle" fill="#FF9800" font-size="12" font-weight="700">↑ Redefinición total del rol</text>

  <text x="1140" y="612" text-anchor="end" fill="#018786" font-size="11" font-weight="700" letter-spacing="2">ARCEAPPS · 2026</text>
</svg>
