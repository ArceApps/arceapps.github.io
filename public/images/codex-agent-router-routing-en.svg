<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Agent Router decision matrix</title>
<desc id="desc">Diagram showing when to delegate to Codex and when to route to each external agent.</desc>
<rect width="1200" height="760" fill="#F8FAFC"/>
<text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#0F172A">DELEGATE OR ROUTE?</text>
<rect x="450" y="100" width="300" height="80" rx="20" fill="#0F172A"/>
<text x="600" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#F8FAFC">What do you want to achieve?</text>
<path d="M600 180 V230 M600 230 H300 V285 M600 230 H900 V285" stroke="#018786" stroke-width="7" fill="none"/>
<rect x="115" y="285" width="370" height="110" rx="22" fill="#018786"/>
<text x="300" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">DELEGATE</text>
<text x="300" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#F8FAFC">Parallelism / Codex context</text>
<rect x="715" y="285" width="370" height="110" rx="22" fill="#FF9800"/>
<text x="900" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#0F172A">ROUTE</text>
<text x="900" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#0F172A">Offload work to another system</text>
<g font-family="system-ui,sans-serif">
  <rect x="90" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="210" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">OpenCode</text>
  <text x="210" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Default external</text>
  <text x="210" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">bugs · features · tests</text>
  <rect x="350" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="470" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">MiniMax</text>
  <text x="470" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Long-running work</text>
  <text x="470" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">migrations · refactors</text>
  <rect x="610" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="730" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">Free</text>
  <text x="730" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Simple / low-cost</text>
  <text x="730" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">docs · mechanical changes</text>
  <rect x="870" y="470" width="240" height="130" rx="18" fill="#FF9800"/>
  <text x="990" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">AGY</text>
  <text x="990" y="544" text-anchor="middle" font-size="15" fill="#0F172A">High autonomy</text>
  <text x="990" y="571" text-anchor="middle" font-size="15" fill="#0F172A">build · debug · fix loops</text>
</g>
<text x="600" y="680" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0F172A">Explicit user choice &gt; router heuristic</text>
</svg>