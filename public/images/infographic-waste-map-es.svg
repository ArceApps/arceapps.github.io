<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid-waste-es" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid-waste-es)"/>

  <text x="600" y="50" text-anchor="middle" fill="#FF9800" font-size="22" font-weight="700" letter-spacing="2">¿A DÓNDE SE VA EL 40-60% DE DESPERDICIO?</text>
  <text x="600" y="78" text-anchor="middle" fill="#FFFFFF" font-size="14" opacity="0.7">Re-derivación · deriva · retrabajo · impuesto de revisión</text>

  <circle cx="600" cy="335" r="65" fill="#018786"/>
  <text x="600" y="328" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="2">SDD</text>
  <text x="600" y="350" text-anchor="middle" fill="#FFFFFF" font-size="11" opacity="0.85">la spec es</text>
  <text x="600" y="365" text-anchor="middle" fill="#FFFFFF" font-size="11" opacity="0.85">la fuente de verdad</text>

  <!-- 1. RE-DERIVACIÓN -->
  <rect x="80" y="135" width="280" height="120" fill="none" stroke="#FF9800" stroke-width="2" rx="6"/>
  <text x="220" y="165" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="700">1 · RE-DERIVACIÓN</text>
  <text x="100" y="195" fill="#FFFFFF" font-size="12" opacity="0.85">Re-explicar la intención</text>
  <text x="100" y="213" fill="#FFFFFF" font-size="12" opacity="0.85">a cada sesión nueva del</text>
  <text x="100" y="231" fill="#FFFFFF" font-size="12" opacity="0.85">agente. Contexto implícito</text>
  <text x="100" y="249" fill="#FFFFFF" font-size="12" opacity="0.85">que la IA olvidó de noche.</text>

  <!-- 2. DERIVA -->
  <rect x="840" y="135" width="280" height="120" fill="none" stroke="#FF9800" stroke-width="2" rx="6"/>
  <text x="980" y="165" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="700">2 · DERIVA</text>
  <text x="860" y="195" fill="#FFFFFF" font-size="12" opacity="0.85">El código diverge de la spec</text>
  <text x="860" y="213" fill="#FFFFFF" font-size="12" opacity="0.85">tras 3-5 iteraciones.</text>
  <text x="860" y="231" fill="#FFFFFF" font-size="12" opacity="0.85">Spec pudriéndose. Nadie</text>
  <text x="860" y="249" fill="#FFFFFF" font-size="12" opacity="0.85">actualiza un doc que nadie lee.</text>

  <!-- 3. RETRABAJO -->
  <rect x="80" y="415" width="280" height="120" fill="none" stroke="#FF9800" stroke-width="2" rx="6"/>
  <text x="220" y="445" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="700">3 · RETRABAJO</text>
  <text x="100" y="475" fill="#FFFFFF" font-size="12" opacity="0.85">El código generado rompe</text>
  <text x="100" y="493" fill="#FFFFFF" font-size="12" opacity="0.85">la función de al lado.</text>
  <text x="100" y="511" fill="#FFFFFF" font-size="12" opacity="0.85">El fix mete 2 bugs nuevos.</text>
  <text x="100" y="529" fill="#FFFFFF" font-size="12" opacity="0.85">La cascada se acumula.</text>

  <!-- 4. IMPUESTO DE REVISIÓN -->
  <rect x="840" y="415" width="280" height="120" fill="none" stroke="#FF9800" stroke-width="2" rx="6"/>
  <text x="980" y="445" text-anchor="middle" fill="#FF9800" font-size="16" font-weight="700">4 · IMPUESTO REVISIÓN</text>
  <text x="860" y="475" fill="#FFFFFF" font-size="12" opacity="0.85">Leer 3.000 líneas de</text>
  <text x="860" y="493" fill="#FFFFFF" font-size="12" opacity="0.85">código IA que no escribiste.</text>
  <text x="860" y="511" fill="#FFFFFF" font-size="12" opacity="0.85">La carga cognitiva sustituye</text>
  <text x="860" y="529" fill="#FFFFFF" font-size="12" opacity="0.85">a escribir a máquina.</text>

  <line x1="540" y1="305" x2="360" y2="230" stroke="#018786" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="660" y1="305" x2="840" y2="230" stroke="#018786" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="540" y1="365" x2="360" y2="440" stroke="#018786" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="660" y1="365" x2="840" y2="440" stroke="#018786" stroke-width="1.5" stroke-dasharray="4,4"/>

  <text x="450" y="285" text-anchor="middle" fill="#018786" font-size="11" font-weight="700">−40 a −60%</text>
  <text x="750" y="285" text-anchor="middle" fill="#018786" font-size="11" font-weight="700">−40 a −60%</text>
  <text x="450" y="395" text-anchor="middle" fill="#018786" font-size="11" font-weight="700">−40 a −60%</text>
  <text x="750" y="395" text-anchor="middle" fill="#018786" font-size="11" font-weight="700">−40 a −60%</text>

  <text x="600" y="595" text-anchor="middle" fill="#FFFFFF" font-size="11" opacity="0.5">Fuentes: Veracode 2025 · METR Jul 2025 · GitClear · Thoughtworks Radar · wcollins.io</text>
  <text x="1140" y="612" text-anchor="end" fill="#018786" font-size="11" font-weight="700" letter-spacing="2">ARCEAPPS · 2026</text>
  <text x="60" y="612" text-anchor="start" fill="#FFFFFF" font-size="11" opacity="0.5" letter-spacing="2">WASTE MAP · ROL-SHIFT</text>
</svg>
