<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Matriz de decisión de Agent Router</title>
<desc id="desc">Diagrama que muestra cuándo delegar a Codex y cuándo enrutar a cada agente externo.</desc>
<rect width="1200" height="760" fill="#F8FAFC"/>
<text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="34" font-weight="800" fill="#0F172A">¿DELEGA O ENRUTA?</text>
<rect x="450" y="100" width="300" height="80" rx="20" fill="#0F172A"/>
<text x="600" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" font-weight="700" fill="#F8FAFC">¿Qué quieres conseguir?</text>
<path d="M600 180 V230 M600 230 H300 V285 M600 230 H900 V285" stroke="#018786" stroke-width="7" fill="none"/>
<rect x="115" y="285" width="370" height="110" rx="22" fill="#018786"/>
<text x="300" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">DELEGA</text>
<text x="300" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#F8FAFC">Paralelismo / contexto Codex</text>
<rect x="715" y="285" width="370" height="110" rx="22" fill="#FF9800"/>
<text x="900" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" font-weight="800" fill="#0F172A">ENRUTA</text>
<text x="900" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#0F172A">Descargar trabajo a otro sistema</text>
<g font-family="system-ui,sans-serif">
  <rect x="90" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="210" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">OpenCode</text>
  <text x="210" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Default externo</text>
  <text x="210" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">bugs · features · tests</text>
  <rect x="350" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="470" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">MiniMax</text>
  <text x="470" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Trabajo largo</text>
  <text x="470" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">migraciones · refactors</text>
  <rect x="610" y="470" width="240" height="130" rx="18" fill="#0F172A"/>
  <text x="730" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC">Free</text>
  <text x="730" y="544" text-anchor="middle" font-size="15" fill="#F8FAFC">Simple / bajo coste</text>
  <text x="730" y="571" text-anchor="middle" font-size="15" fill="#F8FAFC">docs · cambios mecánicos</text>
  <rect x="870" y="470" width="240" height="130" rx="18" fill="#FF9800"/>
  <text x="990" y="510" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">AGY</text>
  <text x="990" y="544" text-anchor="middle" font-size="15" fill="#0F172A">Alta autonomía</text>
  <text x="990" y="571" text-anchor="middle" font-size="15" fill="#0F172A">build · debug · fix loops</text>
</g>
<text x="600" y="680" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0F172A">Elección explícita del usuario &gt; heurística del router</text>
</svg>