<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Jev System One Models</title>
  <desc id="desc">Geometric diagram showing unstructured state entering Jev and typed Choice, Score and Noul decisions flowing into code.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#018786"/>
      <stop offset="1" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <text x="72" y="92" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="800">JEV</text>
  <text x="72" y="132" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="22">SYSTEM ONE MODELS · TYPED DECISIONS FOR SOFTWARE</text>

  <g transform="translate(72 220)">
    <rect width="220" height="174" rx="24" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <text x="28" y="45" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="15">UNSTRUCTURED</text>
    <text x="28" y="75" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">STATE</text>
    <path d="M30 112 H190" stroke="#334155" stroke-width="2"/>
    <path d="M30 132 H160" stroke="#334155" stroke-width="2"/>
    <path d="M30 152 H182" stroke="#334155" stroke-width="2"/>
  </g>

  <path d="M310 307 H420" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M405 291 L430 307 L405 323" fill="none" stroke="#FF9800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(440 185)" filter="url(#glow)">
    <rect width="320" height="244" rx="34" fill="#0B2F33" stroke="#018786" stroke-width="3"/>
    <circle cx="160" cy="88" r="56" fill="none" stroke="#018786" stroke-width="10"/>
    <path d="M129 90 L151 112 L197 65" fill="none" stroke="#FF9800" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="178" text-anchor="middle" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800">JEV</text>
    <text x="160" y="207" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="14">FAST · CALIBRATED · TYPED</text>
  </g>

  <path d="M780 307 H865" stroke="url(#flow)" stroke-width="8" stroke-linecap="round"/>
  <path d="M850 291 L875 307 L850 323" fill="none" stroke="#FF9800" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(890 190)">
    <rect width="238" height="58" rx="16" fill="#111C2E" stroke="#018786" stroke-width="2"/>
    <text x="24" y="36" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="18" font-weight="700">CHOICE</text>
    <text x="210" y="36" text-anchor="end" fill="#018786" font-family="ui-monospace, monospace" font-size="14">0.94</text>

    <rect y="78" width="238" height="58" rx="16" fill="#111C2E" stroke="#FF9800" stroke-width="2"/>
    <text x="24" y="114" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="18" font-weight="700">SCORE</text>
    <text x="210" y="114" text-anchor="end" fill="#FF9800" font-family="ui-monospace, monospace" font-size="14">2 / 3</text>

    <rect y="156" width="238" height="58" rx="16" fill="#111C2E" stroke="#018786" stroke-width="2"/>
    <text x="24" y="192" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="18" font-weight="700">NOUL</text>
    <text x="210" y="192" text-anchor="end" fill="#018786" font-family="ui-monospace, monospace" font-size="14">0.17</text>
  </g>

  <g transform="translate(72 500)">
    <rect width="1056" height="72" rx="20" fill="#111C2E" stroke="#334155" stroke-width="2"/>
    <text x="32" y="44" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="17">STATE + BOUNDED QUESTIONS</text>
    <path d="M350 36 H705" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="1024" y="44" text-anchor="end" fill="#F8FAFC" font-family="ui-monospace, monospace" font-size="17">TYPED PROBABILITIES → CODE</text>
  </g>
</svg>