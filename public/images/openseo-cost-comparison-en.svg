<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="cost-bg-en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#141E33" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="580" rx="16" fill="url(#cost-bg-en)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#018786" fill-opacity="0.2" stroke="#018786" stroke-width="1" />
    <text x="85" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">INDIE ECONOMICS</text>
    <text x="0" y="62" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">
      Real Cost Breakdown: SaaS Subscriptions vs OpenSEO
    </text>
    <text x="0" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Simulated expenses for an independent developer managing 1 to 3 live production web applications
    </text>
  </g>

  <!-- 4 Cost Columns -->
  
  <!-- Col 1: Semrush Pro -->
  <g transform="translate(60, 160)">
    <rect width="225" height="340" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#EF4444" stroke-width="1.5" />
    <text x="112" y="35" fill="#F87171" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Semrush Pro</text>
    <text x="112" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800" text-anchor="middle">$139.95</text>
    <text x="112" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">per month (fixed billing)</text>

    <line x1="20" y1="110" x2="205" y2="110" stroke="#334155" />

    <g transform="translate(15, 130)">
      <text x="0" y="20" fill="#CBD5E1" font-family="sans-serif" font-size="12">· Annual cost: $1,679.40</text>
      <text x="0" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">· Idle ~95% of the time</text>
      <text x="0" y="76" fill="#94A3B8" font-family="sans-serif" font-size="11">· 5 projects limit</text>
      <text x="0" y="104" fill="#94A3B8" font-family="sans-serif" font-size="11">· Zero MCP/agent support</text>
      <text x="0" y="145" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="700">✕ High SaaS overhead</text>
    </g>
  </g>

  <!-- Col 2: Ahrefs Lite -->
  <g transform="translate(310, 160)">
    <rect width="225" height="340" rx="10" fill="#1E293B" fill-opacity="0.7" stroke="#EF4444" stroke-width="1.5" />
    <text x="112" y="35" fill="#F87171" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Ahrefs Lite</text>
    <text x="112" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800" text-anchor="middle">$129.00</text>
    <text x="112" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">per month (fixed billing)</text>

    <line x1="20" y1="110" x2="205" y2="110" stroke="#334155" />

    <g transform="translate(15, 130)">
      <text x="0" y="20" fill="#CBD5E1" font-family="sans-serif" font-size="12">· Annual cost: $1,548.00</text>
      <text x="0" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11">· Strict credit system</text>
      <text x="0" y="76" fill="#94A3B8" font-family="sans-serif" font-size="11">· 500 monthly credit cap</text>
      <text x="0" y="104" fill="#94A3B8" font-family="sans-serif" font-size="11">· No terminal integration</text>
      <text x="0" y="145" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="700">✕ Rigid for indie devs</text>
    </g>
  </g>

  <!-- Col 3: OpenSEO Hosted -->
  <g transform="translate(560, 160)">
    <rect width="225" height="340" rx="10" fill="#1E293B" stroke="#018786" stroke-width="1.5" />
    <text x="112" y="35" fill="#00B4B2" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">OpenSEO Cloud</text>
    <text x="112" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800" text-anchor="middle">$10.00</text>
    <text x="112" y="90" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">per month (hosted / openseo.so)</text>

    <line x1="20" y1="110" x2="205" y2="110" stroke="#018786" />

    <g transform="translate(15, 130)">
      <text x="0" y="20" fill="#CBD5E1" font-family="sans-serif" font-size="12">· Annual cost: $120.00</text>
      <text x="0" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="11">· Zero DevOps setup</text>
      <text x="0" y="76" fill="#CBD5E1" font-family="sans-serif" font-size="11">· MCP server included</text>
      <text x="0" y="104" fill="#CBD5E1" font-family="sans-serif" font-size="11">· Unlimited projects</text>
      <text x="0" y="145" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="700">✓ 92% Annual Savings</text>
    </g>
  </g>

  <!-- Col 4: OpenSEO Self-Hosted (Winner) -->
  <g transform="translate(810, 160)">
    <rect width="230" height="340" rx="10" fill="#0F172A" stroke="#4ADE80" stroke-width="2.5" />
    <rect x="20" y="-12" width="190" height="24" rx="12" fill="#4ADE80" />
    <text x="115" y="4" fill="#090D16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">MAXIMUM EFFICIENCY</text>

    <text x="115" y="35" fill="#4ADE80" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Self-Hosted (BYOK)</text>
    <text x="115" y="70" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800" text-anchor="middle">~$0.25</text>
    <text x="115" y="90" fill="#4ADE80" font-family="sans-serif" font-size="12" text-anchor="middle">per month (on actual usage)</text>

    <line x1="20" y1="110" x2="210" y2="110" stroke="#4ADE80" />

    <g transform="translate(15, 130)">
      <text x="0" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">· Annual cost: ~$3.00</text>
      <text x="0" y="48" fill="#CBD5E1" font-family="sans-serif" font-size="11">· Free Docker / Cloudflare</text>
      <text x="0" y="76" fill="#CBD5E1" font-family="sans-serif" font-size="11">· DataForSEO (~$0.02/crawl)</text>
      <text x="0" y="104" fill="#CBD5E1" font-family="sans-serif" font-size="11">· 100% data sovereignty</text>
      <text x="0" y="145" fill="#4ADE80" font-family="sans-serif" font-size="12" font-weight="800">★ 99.8% Savings</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 520)">
    <text x="0" y="0" fill="#64748B" font-family="sans-serif" font-size="13">
      Note: OpenSEO Self-Hosted estimates assume 10 full site audits and 20 keyword queries per month via DataForSEO API.
    </text>
  </g>
</svg>
