<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">HybridAgents: from internal state to action</title><desc id="desc">Conceptual research model, not a deployed production system</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="66" fill="white" font-weight="700" font-size="29" text-anchor="middle">HybridAgents: from internal state to action</text><path d="M100 95h1000" stroke="#018786" stroke-width="2"/><rect x="32" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="155" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Latent state</text><text x="155" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">internal</text><text x="155" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">representation</text><rect x="332" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="455" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Selection</text><text x="455" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">choose tool</text><text x="455" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">and arguments</text><rect x="632" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="755" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Execution</text><text x="755" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">external</text><text x="755" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">tool call</text><rect x="932" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="1055" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Observation</text><text x="1055" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">receive result</text><text x="1055" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">update state</text><path d="M282 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M582 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M882 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="393" fill="#cee3e8" text-anchor="middle" font-size="18">Conceptual research model, not a deployed production system</text></g></svg>