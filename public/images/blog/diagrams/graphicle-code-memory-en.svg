<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Graphicle: repository, graph, memory and agent</title><desc id="desc">Graph and memory complement the code as a source of truth</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="66" fill="white" font-weight="700" font-size="29" text-anchor="middle">Graphicle: repository, graph, memory and agent</text><path d="M100 95h1000" stroke="#018786" stroke-width="2"/><rect x="32" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="155" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Repository</text><text x="155" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">files and symbols</text><text x="155" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">source of truth</text><rect x="332" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="455" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Code index</text><text x="455" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">relationships</text><text x="455" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">between entities</text><rect x="632" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="755" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Memory</text><text x="755" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">persistent context</text><text x="755" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">with provenance</text><rect x="932" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="1055" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">MCP query</text><text x="1055