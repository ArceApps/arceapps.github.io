<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">SlopCodeBench: two evaluation gates</title><desc id="desc">Basic functionality does not establish a regression-free change</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="66" fill="white" font-weight="700" font-size="29" text-anchor="middle">SlopCodeBench: two evaluation gates</text><path d="M100 95h1000" stroke="#018786" stroke-width="2"/><rect x="32" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="155" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Task</text><text x="155" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">real repository</text><text x="155" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">requested change</text><rect x="332" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="455" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Agent</text><text x="455" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">modifies code</text><text x="455" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">proposes fix</text><rect x="632" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="755" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Core pass</text><text x="755" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">central tests</text><text x="755" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">functionality</text><rect x="932" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="1055" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Strict pass</text><text x="1055" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">more constraints</text><text x="1055" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">quality and regressions</text><path d="M282 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M582 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M882 238h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="393" fill="#cee3e8" text-anchor="middle" font-size="18">Basic functionality does not establish a regression-free change</text></g></svg>