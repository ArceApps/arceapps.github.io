<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Graphicle: repositorio, grafo, memoria y agente</title><desc id="desc">El grafo y la memoria no reemplazan la lectura de la fuente</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="66" fill="white" font-weight="700" font-size="29" text-anchor="middle">Graphicle: repositorio, grafo, memoria y agente</text><path d="M100 95h1000" stroke="#018786" stroke-width="2"/><rect x="32" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="155" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Repositorio</text><text x="155" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">archivos y símbolos</text><text x="155" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">fuente de verdad</text><rect x="332" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="455" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Índice de código</text><text x="455" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">relaciones entre</text><text x="455" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">entidades</text><rect x="632" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#018786" stroke-width="3"/><text x="755" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Memoria</text><text x="755" y="262" fill="#cee8eb" text-anchor="middle" font-size="17">contexto persistente</text><text x="755" y="292" fill="#a4c5cc" text-anchor="middle" font-size="17">con procedencia</text><rect x="932" y="137" width="246" height="204" rx="18" fill="#132f3c" stroke="#ff9800" stroke-width="3"/><text x="1055" y="207" fill="white" text-anchor="middle" font-weight="700" font-size="22">Consulta MCP</te