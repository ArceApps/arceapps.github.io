<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="64" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="28" font-weight="bold">El ciclo FORGE: 5 fases validadas</text>
  <text x="600" y="94" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="15">No puedes saltarte una fase: cada compuerta debe validarse antes de avanzar</text>

  <!-- central hub -->
  <circle cx="600" cy="330" r="72" fill="#018786" opacity="0.12"/>
  <circle cx="600" cy="330" r="72" fill="none" stroke="#018786" stroke-width="3"/>
  <text x="600" y="322" text-anchor="middle" fill="#018786" font-family="monospace" font-size="22" font-weight="bold">IDD</text>
  <text x="600" y="350" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="14">intención</text>

  <!-- phase boxes around the hub: top, right, bottom-right, bottom-left, left -->
  <!-- FOCUS (top) -->
  <rect x="505" y="120" width="190" height="92" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="20" font-weight="bold">1 · FOCUS</text>
  <text x="600" y="178" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="13">definir qué y por qué</text>
  <text x="600" y="198" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">problema + éxito</text>

  <!-- ORCHESTRATE (right) -->
  <rect x="858" y="255" width="190" height="92" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="953" y="290" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="20" font-weight="bold">2 · ORCHESTRATE</text>
  <text x="953" y="313" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="13">planificar arquitectura</text>
  <text x="953" y="333" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">diagramas + tareas</text>

  <!-- REFINE (bottom right) -->
  <rect x="858" y="440" width="190" height="92" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="953" y="475" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="20" font-weight="bold">3 · REFINE</text>
  <text x="953" y="498" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="13">definir «hecho»</text>
  <text x="953" y="518" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">criterios + interfaces</text>

  <!-- GENERATE (bottom left) -->
  <rect x="152" y="440" width="190" height="92" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="247" y="475" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="20" font-weight="bold">4 · GENERATE</text>
  <text x="247" y="498" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="13">IA escribe vía TDD</text>
  <text x="247" y="518" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">rojo · verde · refactor</text>

  <!-- EVALUATE (left) -->
  <rect x="152" y="255" width="190" height="92" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="247" y="290" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="20" font-weight="bold">5 · EVALUATE</text>
  <text x="247" y="313" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="13">verificar intención</text>
  <text x="247" y="333" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12">aceptar o iterar</text>

  <!-- connectors (arrows between boxes through the hub) -->
  <g stroke="#018786" stroke-width="3" fill="none">
    <path d="M 600 212 L 600 258" marker-end=""/>
    <path d="M 695 300 L 858 300"/>
    <path d="M 953 347 L 953 440"/>
    <path d="M 858 486 L 342 486"/>
    <path d="M 247 347 L 247 255"/>
    <path d="M 342 300 L 152 300"/>
  </g>

  <!-- arrowheads -->
  <g fill="#018786">
    <polygon points="590,258 610,258 600,278"/>
    <polygon points="848,290 868,300 848,310"/>
    <polygon points="943,430 963,440 943,450"/>
    <polygon points="352,476 342,496 332,476"/>
    <polygon points="237,355 257,345 237,335"/>
    <polygon points="162,290 142,300 162,310"/>
  </g>

  <!-- validation gate labels -->
  <text x="600" y="238" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="12">✓ compuerta</text>
  <text x="800" y="288" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="12">✓</text>
  <text x="905" y="416" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="12">✓</text>
  <text x="420" y="500" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="12">✓</text>
  <text x="195" y="380" text-anchor="middle" fill="#7DD3C8" font-family="monospace" font-size="12">✓</text>

  <!-- footer -->
  <rect x="0" y="565" width="1200" height="65" fill="#0B1120"/>
  <text x="60" y="602" fill="#018786" font-family="monospace" font-size="15">Cada fase termina con una validación explícita — el código es el último artefacto, no el primero · ARCEAPPS</text>
</svg>
