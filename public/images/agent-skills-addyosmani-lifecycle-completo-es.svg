<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-es" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg-es" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr-es" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-es)"/>
  <rect width="1200" height="630" fill="url(#grid-es)" opacity="0.4"/>

  <!-- Top brand -->
  <text x="60" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" letter-spacing="2">ARCEAPPS · BLOG</text>
  <text x="1140" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8" text-anchor="end">2026 · SDD</text>

  <!-- Lifecycle rings: 6 phases -->
  <g transform="translate(600,310)">
    <!-- outer ring -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="#018786" stroke-width="2" stroke-dasharray="2,4" opacity="0.6"/>
    <!-- inner core -->
    <circle cx="0" cy="0" r="55" fill="#018786" opacity="0.15" stroke="#018786" stroke-width="2"/>
    <text x="0" y="-5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="700">META</text>
    <text x="0" y="14" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">router</text>

    <!-- 6 phase nodes around the circle -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="600">
      <!-- DEFINE (top) -->
      <circle cx="0" cy="-200" r="38" fill="#018786"/>
      <text x="0" y="-196" fill="#0F172A" text-anchor="middle">DEFINE</text>
      <!-- PLAN (top-right) -->
      <circle cx="173" cy="-100" r="38" fill="#FF9800"/>
      <text x="173" y="-96" fill="#0F172A" text-anchor="middle">PLAN</text>
      <!-- BUILD (bottom-right) -->
      <circle cx="173" cy="100" r="38" fill="#018786"/>
      <text x="173" y="104" fill="#0F172A" text-anchor="middle">BUILD</text>
      <!-- VERIFY (bottom) -->
      <circle cx="0" cy="200" r="38" fill="#FF9800"/>
      <text x="0" y="204" fill="#0F172A" text-anchor="middle">VERIFY</text>
      <!-- REVIEW (bottom-left) -->
      <circle cx="-173" cy="100" r="38" fill="#018786"/>
      <text x="-173" y="104" fill="#0F172A" text-anchor="middle">REVIEW</text>
      <!-- SHIP (top-left) -->
      <circle cx="-173" cy="-100" r="38" fill="#FF9800"/>
      <text x="-173" y="-96" fill="#0F172A" text-anchor="middle">SHIP</text>
    </g>

    <!-- arrows between nodes -->
    <g stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arr-es)">
      <path d="M 36,-198 A 200,200 0 0 1 170,-108"/>
      <path d="M 175,-65 A 200,200 0 0 1 175,65"/>
      <path d="M 170,108 A 200,200 0 0 1 36,198"/>
      <path d="M -36,198 A 200,200 0 0 1 -170,108"/>
      <path d="M -175,65 A 200,200 0 0 1 -175,-65"/>
      <path d="M -170,-108 A 200,200 0 0 1 -36,-198"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(60,470)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="32" fill="#e2e8f0" font-weight="700">Agent Skills de Addy Osmani</text>
    <text y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#FF9800">24 skills para el ciclo completo</text>
    <text y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8">Define → Plan → Build → Verify → Review → Ship</text>
  </g>

  <!-- Right accent: stats -->
  <g transform="translate(1140,470)" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">
    <text font-size="42" fill="#018786" font-weight="700">24</text>
    <text y="22" font-size="12" fill="#94a3b8">SKILLS</text>
    <text y="56" font-size="42" fill="#FF9800" font-weight="700">3-TIER</text>
    <text y="78" font-size="12" fill="#94a3b8">EVAL FRAMEWORK</text>
    <text y="112" font-size="42" fill="#018786" font-weight="700">11</text>
    <text y="134" font-size="12" fill="#94a3b8">AGENTS</text>
  </g>
</svg>
