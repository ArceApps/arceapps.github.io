<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Jerarquía virtual de MemGPT y Letta: contexto principal y memoria externa con function calls">
  <defs>
    <linearGradient id="bgLight2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018786"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bgLight2)"/>

  <g font-family="ui-sans-serif,Inter,system-ui">
    <text x="600" y="56" text-anchor="middle" fill="#0F172A" font-size="28" font-weight="800">Jerarquía virtual de MemGPT / Letta</text>
    <text x="600" y="86" text-anchor="middle" fill="#475569" font-size="14">El LLM pagina entre contexto principal y memoria externa con function calls</text>
  </g>

  <g transform="translate(80,130)">
    <rect width="1040" height="180" rx="14" fill="#FFFFFF" stroke="#018786" stroke-width="2"/>
    <rect width="1040" height="32" rx="14" fill="#018786"/>
    <rect y="18" width="1040" height="14" fill="#018786"/>
    <text x="20" y="22" fill="#FFFFFF" font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="700" letter-spacing="2">MAIN CONTEXT · CONTEXTO PRINCIPAL</text>
    <text x="1020" y="22" text-anchor="end" fill="#FFFFFF" font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="500" opacity="0.85">tokens del LLM</text>

    <g font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="600">
      <g transform="translate(20,52)">
        <rect width="320" height="108" rx="8" fill="#0F172A"/>
        <text x="20" y="34" fill="#F1F5F9" font-weight="700">System instructions</text>
        <text x="20" y="58" fill="#94A3B8" font-weight="400" font-size="12">identidad y reglas globales</text>
        <text x="20" y="78" fill="#FF9800" font-weight="500" font-size="11" letter-spacing="1">READ-ONLY</text>
      </g>
      <g transform="translate(360,52)">
        <rect width="320" height="108" rx="8" fill="#014845"/>
        <text x="20" y="34" fill="#F1F5F9" font-weight="700">Working context</text>
        <text x="20" y="58" fill="#A7E5DF" font-weight="400" font-size="12">hechos clave de la sesión</text>
        <text x="20" y="78" fill="#FFB74D" font-weight="500" font-size="11" letter-spacing="1">READ · WRITE</text>
      </g>
      <g transform="translate(700,52)">
        <rect width="320" height="108" rx="8" fill="#115E59"/>
        <text x="20" y="34" fill="#F1F5F9" font-weight="700">FIFO queue</text>
        <text x="20" y="58" fill="#A7E5DF" font-weight="400" font-size="12">mensajes + function calls</text>
        <text x="20" y="78" fill="#FFB74D" font-weight="500" font-size="11" letter-spacing="1">APPEND-ONLY</text>
      </g>
    </g>
  </g>

  <g stroke="#018786" stroke-width="2" fill="none" marker-end="url(#arrowT)">
    <path d="M 600 332 L 600 360 L 320 360 L 320 388"/>
    <path d="M 600 332 L 600 360 L 880 360 L 880 388"/>
  </g>

  <g transform="translate(80,400)">
    <rect width="1040" height="160" rx="14" fill="#FFFFFF" stroke="#FF9800" stroke-width="2"/>
    <rect width="1040" height="32" rx="14" fill="#FF9800"/>
    <rect y="18" width="1040" height="14" fill="#FF9800"/>
    <text x="20" y="22" fill="#0F172A" font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="800" letter-spacing="2">EXTERNAL CONTEXT · MEMORIA EXTERNA</text>
    <text x="1020" y="22" text-anchor="end" fill="#0F172A" font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="600" opacity="0.8">no visible sin función</text>

    <g font-family="ui-sans-serif,Inter,system-ui" font-size="13" font-weight="600">
      <g transform="translate(80,52)">
        <rect width="380" height="92" rx="8" fill="#0F172A"/>
        <text x="20" y="32" fill="#F1F5F9" font-weight="700">Recall storage</text>
        <text x="20" y="56" fill="#94A3B8" font-weight="400" font-size="12">mensajes completos · búsqueda por keyword</text>
        <text x="20" y="76" fill="#FF9800" font-weight="500" font-size="11" letter-spacing="1">APPEND-ONLY</text>
      </g>
      <g transform="translate(580,52)">
        <rect width="380" height="92" rx="8" fill="#1E293B"/>
        <text x="20" y="32" fill="#F1F5F9" font-weight="700">Archival storage</text>
        <text x="20" y="56" fill="#94A3B8" font-weight="400" font-size="12">objetos de texto · búsqueda vectorial</text>
        <text x="20" y="76" fill="#FFB74D" font-weight="500" font-size="11" letter-spacing="1">VECTOR SEARCH</text>
      </g>
    </g>
  </g>

  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#018786" font-weight="600">
    <text x="220" y="350">archival_memory_search(query, page)</text>
    <text x="780" y="350" fill="#FF9800">recall_storage_search(query, page)</text>
  </g>

  <g transform="translate(600,595)" font-family="ui-sans-serif,Inter,system-ui" text-anchor="middle">
    <rect x="-220" y="-22" width="440" height="36" rx="18" fill="#0F172A"/>
    <text y="2" fill="#F1F5F9" font-size="13" font-weight="600">Las funciones son page-faults del LLM</text>
  </g>
</svg>
