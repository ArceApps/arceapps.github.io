  <text x="60" y="55" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#018786" letter-spacing="2">FIGURE 3 · TYPES OF AGENTIC LOOPS</text>
  <text x="60" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="25" fill="#e2e8f0" font-weight="700">Who triggers? Who stops? Who verifies?</text>
  <rect x="60" y="130" width="1110" height="46" fill="#1e293b" rx="8"/>
  <text x="76" y="159" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700" letter-spacing="1">TYPE</text>
  <text x="336" y="159" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700" letter-spacing="1">YOU HAND OVER</text>
  <text x="606" y="159" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700" letter-spacing="1">STOPS WHEN...</text>
  <text x="866" y="159" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700" letter-spacing="1">RISK</text>
  <rect x="60" y="182" width="1110" height="62" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
  <text x="78" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">Turn-based</text>
  <text x="338" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">control</text>
  <text x="608" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">you decide</text>
  <text x="868" y="219" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">none serious</text>
  <rect x="60" y="254" width="1110" height="62" fill="#1e293b" stroke="#FF9800" stroke-width="2" rx="8"/>
  <rect x="60" y="254" width="8" height="62" fill="#FF9800"/>
  <text x="78" y="291" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#FF9800" font-weight="700">/goal</text>
  <text x="338" y="291" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#FF9800">stop condition</text>
  <text x="608" y="291" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#FF9800">evaluator confirms</text>
  <text x="868" y="291" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#FF9800">badly written goal</text>
  <rect x="60" y="326" width="1110" height="62" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
  <text x="78" y="363" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">/loop /schedule</text>
  <text x="338" y="363" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">time cadence</text>
  <text x="608" y="363" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">you cancel it</text>
  <text x="868" y="363" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">idle token burn</text>
  <rect x="60" y="398" width="1110" height="62" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
  <text x="78" y="435" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">Routines</text>
  <text x="338" y="435" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">todo el workflow</text>
  <text x="608" y="435" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">event or schedule</text>
  <text x="868" y="435" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">supervision debt</text>
  <rect x="60" y="470" width="1110" height="62" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/>
  <text x="78" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0" font-weight="700">Ralph loop</text>
  <text x="338" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">a while loop and faith</text>
  <text x="608" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">never (while :)</text>
  <text x="868" y="507" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e2e8f0">the final 10%</text>
  <text x="60" y="545" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#018786" font-weight="700">Does your task have a finish line? → /goal. Is it eternal? → cadence.</text>
  <text x="1140" y="600" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569" text-anchor="end">ARCEAPPS · 2026</text>
