<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-if2-es" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-if2-es)" opacity="0.3"/>

  <text x="60" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" letter-spacing="2">FIGURA 2 · EVAL FRAMEWORK DE TRES NIVELES</text>
  <text x="60" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#e2e8f0" font-weight="700">Cómo sabe el repo que sus skills funcionan</text>

  <!-- 3 stacked tiers, narrowing like a funnel -->
  <g transform="translate(150,150)">
    <!-- Tier 1 (widest) -->
    <rect x="0" y="0" width="900" height="120" fill="#1e293b" stroke="#018786" stroke-width="2" rx="8"/>
    <rect x="0" y="0" width="8" height="120" fill="#018786"/>
    <text x="30" y="35" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">TIER 1 · STRUCTURAL</text>
    <text x="30" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Auditoría estática de los SKILL.md. Comprueba frontmatter, secciones obligatorias</text>
    <text x="30" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">(Overview, When to Use, Process, Rationalizations, Red Flags, Verification), que las</text>
    <text x="30" y="96" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Rationalizations tengan substance y que las descripciones sean concretas.</text>
    <text x="860" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">✓ en CI</text>
    <text x="860" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">determinista</text>

    <!-- Tier 2 -->
    <rect x="60" y="160" width="780" height="120" fill="#1e293b" stroke="#018786" stroke-width="2" rx="8"/>
    <rect x="60" y="160" width="8" height="120" fill="#018786"/>
    <text x="90" y="195" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">TIER 2 · ROUTING</text>
    <text x="90" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Las descripciones llevan el vocabulario que los usuarios realmente usan, y no hay</text>
    <text x="90" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">dos skills que se pisen el routing. Si las descripciones se solapan, el router falla.</text>
    <text x="90" y="256" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Evita el bug clásico de "le pedí X y cargó Y".</text>
    <text x="820" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">✓ en CI</text>
    <text x="820" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">determinista</text>

    <!-- Tier 3 (narrowest) -->
    <rect x="120" y="320" width="660" height="120" fill="#1e293b" stroke="#FF9800" stroke-width="2" rx="8"/>
    <rect x="120" y="320" width="8" height="120" fill="#FF9800"/>
    <text x="150" y="355" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#FF9800" font-weight="700">TIER 3 · BEHAVIORAL</text>
    <text x="150" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Ejecuta un agente real contra escenarios por skill. Compara el output contra</text>
    <text x="150" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">expectativas específicas. Falla cuando un modelo actualizado "racionaliza"</text>
    <text x="150" y="416" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">saltarse un paso. Pressure-testing automatizado y reproducible.</text>
    <text x="760" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">caro</text>
    <text x="760" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">trace real</text>
  </g>

  <!-- bottom arrow + outcome -->
  <g transform="translate(150,490)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">RESULTADO</text>
    <text x="0" y="22" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">Si cualquiera de los 3 tiers falla, CI rompe. Los fallos de eval son bugs</text>
    <text x="0" y="42" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">que se arreglan antes de mergear el PR. Disciplina medible, no declarada.</text>
  </g>

  <text x="1140" y="585" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569" text-anchor="end">ARCEAPPS · 2026</text>
</svg>
