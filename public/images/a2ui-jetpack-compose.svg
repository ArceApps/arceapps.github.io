<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A2UI 1.0 Native Agent UI on Android with Jetpack Compose">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#018786"/>
      <stop offset="100%" stop-color="#0FB5B4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#334155" opacity="0.5">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/>
  </g>

  <!-- left: agent payload block -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="360" height="330" rx="16" fill="#1E293B" stroke="#018786" stroke-width="2"/>
    <text x="24" y="42" font-family="monospace" font-size="18" fill="#94A3B8">A2UI JSON</text>
    <text x="24" y="80" font-family="monospace" font-size="15" fill="#0FB5B4">{ "createSurface": {</text>
    <text x="40" y="108" font-family="monospace" font-size="15" fill="#CBD5E1">"surfaceId": "booking",</text>
    <text x="40" y="136" font-family="monospace" font-size="15" fill="#CBD5E1">"catalogId": "...",</text>
    <text x="40" y="164" font-family="monospace" font-size="15" fill="#CBD5E1">"components": [</text>
    <text x="56" y="192" font-family="monospace" font-size="15" fill="#FFB74D">{ "type": "Button" }</text>
    <text x="40" y="220" font-family="monospace" font-size="15" fill="#CBD5E1">],</text>
    <text x="40" y="248" font-family="monospace" font-size="15" fill="#CBD5E1">"dataModel": { ... }</text>
    <text x="24" y="276" font-family="monospace" font-size="15" fill="#0FB5B4">} }</text>
    <text x="24" y="312" font-family="sans-serif" font-size="14" fill="#64748B">agent describes intent</text>
  </g>

  <!-- arrow -->
  <g stroke="url(#teal)" stroke-width="4" fill="none">
    <line x1="470" y1="315" x2="560" y2="315"/>
    <polygon points="560,305 580,315 560,325" fill="#018786"/>
  </g>
  <text x="490" y="295" font-family="sans-serif" font-size="13" fill="#94A3B8">A2UI</text>

  <!-- right: native UI cards -->
  <g transform="translate(600,150)">
    <rect x="0" y="0" width="510" height="330" rx="16" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
    <text x="24" y="42" font-family="sans-serif" font-size="18" fill="#94A3B8">Jetpack Compose renderer</text>

    <!-- button -->
    <rect x="24" y="70" width="220" height="56" rx="28" fill="url(#orange)"/>
    <text x="134" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0F172A" text-anchor="middle">Confirm booking</text>

    <!-- text field -->
    <rect x="24" y="145" width="462" height="52" rx="8" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="36" y="177" font-family="sans-serif" font-size="16" fill="#94A3B8">Passenger name</text>

    <!-- card -->
    <rect x="24" y="215" width="462" height="90" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2"/>
    <text x="40" y="248" font-family="sans-serif" font-size="16" fill="#0FB5B4">Flight BCN-2026-11-21</text>
    <text x="40" y="278" font-family="sans-serif" font-size="14" fill="#94A3B8">09:30 · Gate B12</text>

    <text x="24" y="320" font-family="sans-serif" font-size="14" fill="#64748B">native Compose composables</text>
  </g>

  <!-- title -->
  <text x="600" y="95" font-family="sans-serif" font-size="46" font-weight="bold" fill="#F8FAFC" text-anchor="middle">A2UI 1.0</text>
  <text x="600" y="135" font-family="sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Native Agent UI on Android with Jetpack Compose</text>

  <!-- bottom accent bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#teal)"/>
</svg>
