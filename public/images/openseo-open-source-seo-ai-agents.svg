<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad-en" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#131E36" />
    </linearGradient>
    <linearGradient id="primary-grad-en" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#018786" />
      <stop offset="100%" stop-color="#00B4B2" />
    </linearGradient>
    <linearGradient id="accent-grad-en" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
    <filter id="glow-en" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad-en)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350 M 0 420 L 1200 420 M 0 490 L 1200 490 M 0 560 L 1200 560" />
    <path d="M 100 0 L 100 630 M 200 0 L 200 630 M 300 0 L 300 630 M 400 0 L 400 630 M 500 0 L 500 630 M 600 0 L 600 630 M 700 0 L 700 630 M 800 0 L 800 630 M 900 0 L 900 630 M 1000 0 L 1000 630 M 1100 0 L 1100 630" />
  </g>

  <!-- Glow Shapes -->
  <circle cx="200" cy="180" r="140" fill="#018786" opacity="0.15" filter="url(#glow-en)" />
  <circle cx="1020" cy="450" r="160" fill="#FF9800" opacity="0.12" filter="url(#glow-en)" />

  <!-- Badge / Topic -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#1E293B" stroke="#018786" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#00B4B2" />
    <text x="34" y="22" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">OPEN SOURCE SEO · AGENTIC STACK</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="170" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    OpenSEO: Open Source Alternative
  </text>
  <text x="80" y="225" fill="url(#primary-grad-en)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    to Semrush for AI Agents
  </text>
  
  <text x="80" y="275" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    MCP Protocol · Autonomous Skills · DataForSEO Pay-As-You-Go · Zero Subscriptions
  </text>

  <!-- Visual Cards Grid (3 Columns) -->
  
  <!-- Card 1: SaaS Toll -->
  <g transform="translate(80, 325)">
    <rect width="320" height="225" rx="12" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#EF4444" fill-opacity="0.15" />
    <text x="40" y="46" fill="#EF4444" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">✕</text>
    <text x="75" y="45" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">The SaaS Toll</text>
    
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Semrush / Ahrefs: $130+/mo</text>
    <text x="20" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Enterprise agency bloatware</text>
    <text x="20" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Zero native agent integration</text>
    <text x="20" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Fixed bills regardless of usage</text>

    <rect x="20" y="195" width="280" height="2" fill="#334155" />
  </g>

  <!-- Card 2: OpenSEO Core -->
  <g transform="translate(440, 325)">
    <rect width="320" height="225" rx="12" fill="#1E293B" fill-opacity="0.9" stroke="#018786" stroke-width="2" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#018786" fill-opacity="0.2" />
    <text x="40" y="46" fill="#00B4B2" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚙</text>
    <text x="75" y="45" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">OpenSEO Core</text>
    
    <text x="20" y="90" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Open source &amp; Self-hosted</text>
    <text x="20" y="118" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· DataForSEO (~$0.02 per audit)</text>
    <text x="20" y="146" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Docker / Cloudflare deploy</text>
    <text x="20" y="174" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Clean UI without corporate noise</text>

    <rect x="20" y="195" width="280" height="2" fill="#018786" />
  </g>

  <!-- Card 3: MCP & Agent Skills -->
  <g transform="translate(800, 325)">
    <rect width="320" height="225" rx="12" fill="#1E293B" fill-opacity="0.8" stroke="#FF9800" stroke-width="1.5" />
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#FF9800" fill-opacity="0.2" />
    <text x="40" y="46" fill="#FFB74D" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="75" y="45" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">MCP &amp; Agent Skills</text>
    
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Claude Code / OpenClaw / Hermes</text>
    <text x="20" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· `seo-audit` skill with single action</text>
    <text x="20" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Diagnose + fix in the same loop</text>
    <text x="20" y="174" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">· Google Search Console integration</text>

    <rect x="20" y="195" width="280" height="2" fill="#FF9800" />
  </g>

  <!-- Footer Brand -->
  <g transform="translate(80, 585)">
    <text x="0" y="0" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">ArceApps · Indie Software &amp; Agent Engineering</text>
  </g>
</svg>
