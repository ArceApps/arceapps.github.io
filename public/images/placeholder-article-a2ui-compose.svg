<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f1f5f9" />

  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#smallGrid)" />

  <!-- Phone frame -->
  <rect x="260" y="80" width="280" height="440" rx="30" fill="#1e272c" stroke="#37474F" stroke-width="4" />
  <rect x="275" y="110" width="250" height="380" rx="8" fill="#ffffff" />

  <!-- Agent UI surface: title -->
  <rect x="290" y="130" width="220" height="28" rx="4" fill="#6750A4" />
  <text x="400" y="150" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">Confirm your booking</text>

  <!-- Flight info -->
  <rect x="290" y="170" width="220" height="20" rx="4" fill="#EADDFF" />
  <text x="400" y="185" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#21005D">Flight BCN-2026-11-21 · 09:30</text>

  <!-- Text field placeholder -->
  <rect x="290" y="200" width="220" height="40" rx="8" fill="#F3EDF7" stroke="#79747E" stroke-width="1" />
  <text x="300" y="225" font-family="sans-serif" font-size="11" fill="#49454F">Passenger name</text>

  <!-- Button -->
  <rect x="290" y="255" width="220" height="36" rx="18" fill="#6750A4" />
  <text x="400" y="278" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">Confirm booking</text>

  <!-- JSON payload arrow from left (agent) -->
  <circle cx="120" cy="300" r="45" fill="#FF9800" stroke="#ffffff" stroke-width="3" />
  <text x="120" y="295" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="bold">Agent</text>
  <text x="120" y="312" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">JSON</text>

  <line x1="165" y1="300" x2="255" y2="300" stroke="#FF9800" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="255,295 265,300 255,305" fill="#FF9800" />

  <!-- Compose renderer label on right -->
  <circle cx="680" cy="300" r="45" fill="#03DAC6" stroke="#ffffff" stroke-width="3" />
  <text x="680" y="295" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#1e272c" font-weight="bold">Compose</text>
  <text x="680" y="312" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#1e272c">Renderer</text>

  <line x1="540" y1="300" x2="630" y2="300" stroke="#03DAC6" stroke-width="3" stroke-dasharray="6,4" />
  <polygon points="630,295 640,300 630,305" fill="#03DAC6" />

  <!-- Title -->
  <text x="400" y="560" font-family="sans-serif" font-size="32" text-anchor="middle" fill="#37474F" font-weight="bold">A2UI 1.0</text>
  <text x="400" y="585" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#79747E">Agent-to-UI · Jetpack Compose</text>
</svg>