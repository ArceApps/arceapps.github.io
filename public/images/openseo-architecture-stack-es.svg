<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680">
  <defs>
    <linearGradient id="stack-bg-es" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#141E33" />
    </linearGradient>
    <linearGradient id="teal-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#018786" />
      <stop offset="100%" stop-color="#00B4B2" />
    </linearGradient>
    <linearGradient id="orange-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" rx="16" fill="url(#stack-bg-es)" stroke="#334155" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#018786" fill-opacity="0.2" stroke="#018786" stroke-width="1" />
    <text x="90" y="19" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ARQUITECTURA TÉCNICA</text>
    <text x="0" y="62" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">
      Anatomía de OpenSEO: Stack Abierto vs Monolito SaaS
    </text>
    <text x="0" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Cómo se desacoplan la interfaz, el protocolo de agentes MCP y el motor de datos bajo demanda
    </text>
  </g>

  <!-- Left: OpenSEO Stack (Layered Box) -->
  <g transform="translate(60, 165)">
    <rect width="600" height="465" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2" />
    
    <!-- Title -->
    <rect x="20" y="18" width="560" height="34" rx="6" fill="#1E293B" />
    <text x="35" y="41" fill="#00B4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">STACK MODULAR OPENSEO (OPEN SOURCE &amp; AGENTIC)</text>

    <!-- Layer 1: Interfaces & Agents -->
    <g transform="translate(20, 65)">
      <rect width="560" height="80" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="18" y="26" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CAPA 1 · CLIENTES &amp; AGENTES DE IA</text>
      
      <!-- Sub-boxes -->
      <rect x="18" y="36" width="120" height="32" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
      <text x="78" y="57" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Claude Code</text>

      <rect x="150" y="36" width="120" height="32" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
      <text x="210" y="57" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenClaw / Hermes</text>

      <rect x="282" y="36" width="120" height="32" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
      <text x="342" y="57" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Antigravity / IDE</text>

      <rect x="414" y="36" width="128" height="32" rx="6" fill="#018786" fill-opacity="0.25" stroke="#018786" stroke-width="1" />
      <text x="478" y="57" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Web Dashboard UI</text>
    </g>

    <!-- Connection Arrow 1 -->
    <text x="300" y="162" fill="#00B4B2" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">↓ Protocolo MCP (Stdio / SSE) + REST API ↓</text>

    <!-- Layer 2: MCP Server & Skills -->
    <g transform="translate(20, 175)">
      <rect width="560" height="110" rx="8" fill="#1E293B" stroke="#018786" stroke-width="1.5" />
      <text x="18" y="26" fill="#00B4B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CAPA 2 · SERVIDOR MCP, SKILLS &amp; CONTEXTO DURADERO</text>
      
      <rect x="18" y="36" width="168" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="28" y="56" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Herramientas MCP</text>
      <text x="28" y="74" fill="#94A3B8" font-family="sans-serif" font-size="10">run_site_audit · backlinks</text>
      <text x="28" y="87" fill="#94A3B8" font-family="sans-serif" font-size="10">research_keywords</text>

      <rect x="196" y="36" width="168" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="206" y="56" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Agent Skills</text>
      <text x="206" y="74" fill="#94A3B8" font-family="sans-serif" font-size="10">seo-audit · seo-coach</text>
      <text x="206" y="87" fill="#94A3B8" font-family="sans-serif" font-size="10">keyword-clustering</text>

      <rect x="374" y="36" width="168" height="60" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="384" y="56" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Project Context</text>
      <text x="384" y="74" fill="#94A3B8" font-family="sans-serif" font-size="10">Memoria compartida</text>
      <text x="384" y="87" fill="#94A3B8" font-family="sans-serif" font-size="10">Objetivos &amp; Log histórico</text>
    </g>

    <!-- Connection Arrow 2 -->
    <text x="300" y="303" fill="#FF9800" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">↓ Invocación Bajo Demanda (Pay-As-You-Go) ↓</text>

    <!-- Layer 3: Data Engines & Hosting -->
    <g transform="translate(20, 315)">
      <rect width="560" height="130" rx="8" fill="#1E293B" stroke="#FF9800" stroke-width="1.5" />
      <text x="18" y="26" fill="#FFB74D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CAPA 3 · MOTOR DE DATOS &amp; INFRAESTRUCTURA</text>

      <rect x="18" y="36" width="255" height="78" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="28" y="56" fill="#4ADE80" font-family="sans-serif" font-size="13" font-weight="700">DataForSEO API (BYOK)</text>
      <text x="28" y="76" fill="#94A3B8" font-family="sans-serif" font-size="11">· Crawls en vivo (~0.01$ - 0.03$)</text>
      <text x="28" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">· Backlinks &amp; Keyword SERP API</text>

      <rect x="287" y="36" width="255" height="78" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="297" y="56" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700">Google Search Console + Self-Host</text>
      <text x="297" y="76" fill="#94A3B8" font-family="sans-serif" font-size="11">· Datos 1st party reales (Gratis)</text>
      <text x="297" y="94" fill="#94A3B8" font-family="sans-serif" font-size="11">· Docker Local / Cloudflare Workers</text>
    </g>
  </g>

  <!-- Right: Legacy SaaS Monolith (Comparison Box) -->
  <g transform="translate(690, 165)">
    <rect width="350" height="465" rx="12" fill="#18131E" stroke="#EF4444" stroke-width="1.5" />
    
    <!-- Title -->
    <rect x="20" y="18" width="310" height="34" rx="6" fill="#2A1B28" />
    <text x="35" y="41" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">MONOLITO SAAS TRADICIONAL</text>

    <g transform="translate(20, 65)">
      <!-- Price Tag -->
      <rect width="310" height="70" rx="8" fill="#2A1B28" stroke="#7F1D1D" stroke-width="1" />
      <text x="20" y="30" fill="#EF4444" font-family="sans-serif" font-size="18" font-weight="800">130$ – 250$ / mes</text>
      <text x="20" y="52" fill="#94A3B8" font-family="sans-serif" font-size="12">Factura fija sin importar si lo abres o no</text>

      <!-- Bullets -->
      <g transform="translate(0, 85)">
        <text x="10" y="25" fill="#EF4444" font-family="sans-serif" font-size="14" font-weight="bold">✕</text>
        <text x="30" y="24" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Caja Negra Propietaria</text>
        <text x="30" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11">Métricas infladas sin acceso al raw data</text>

        <text x="10" y="75" fill="#EF4444" font-family="sans-serif" font-size="14" font-weight="bold">✕</text>
        <text x="30" y="74" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Cero Integración con Agentes</text>
        <text x="30" y="92" fill="#94A3B8" font-family="sans-serif" font-size="11">Tienes que copiar y pegar a mano en tu IDE</text>

        <text x="10" y="125" fill="#EF4444" font-family="sans-serif" font-size="14" font-weight="bold">✕</text>
        <text x="30" y="124" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">UI Sobrecargada (Bloatware)</text>
        <text x="30" y="142" fill="#94A3B8" font-family="sans-serif" font-size="11">Diseñado para grandes agencias de marketing</text>

        <text x="10" y="175" fill="#EF4444" font-family="sans-serif" font-size="14" font-weight="bold">✕</text>
        <text x="30" y="174" fill="#E2E8F0" font-family="sans-serif" font-size="13" font-weight="600">Límites Artificiales de Créditos</text>
        <text x="30" y="192" fill="#94A3B8" font-family="sans-serif" font-size="11">Upgrades forzosos al superar proyectos</text>
      </g>
    </g>

    <rect x="20" y="415" width="310" height="34" rx="6" fill="#EF4444" fill-opacity="0.1" />
    <text x="175" y="437" fill="#FCA5A5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Coste anual: ~1.600$ USD</text>
  </g>
</svg>
