<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#018786" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Central dark factory motif: concentric rings + factory silhouette -->
  <g transform="translate(600, 265)">
    <!-- Outer ring (governance) -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FF9800" stroke-width="2.5" opacity="0.9"/>
    <!-- Inner ring (runtime) -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#018786" stroke-width="2" opacity="0.85"/>
    <!-- Core: gear/code symbol -->
    <circle cx="0" cy="0" r="52" fill="#018786" opacity="0.25"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#018786" stroke-width="2.5"/>
    <!-- Factory chimneys (dark factory iconography) -->
    <rect x="-46" y="-42" width="14" height="34" rx="2" fill="#FF9800"/>
    <rect x="-18" y="-52" width="14" height="44" rx="2" fill="#FF9800" opacity="0.85"/>
    <rect x="10" y="-38" width="14" height="30" rx="2" fill="#FF9800" opacity="0.7"/>
    <rect x="32" y="-46" width="14" height="38" rx="2" fill="#FF9800" opacity="0.9"/>
    <!-- Base line -->
    <rect x="-52" y="-8" width="104" height="6" rx="3" fill="#94A3B8"/>
    <!-- Code brackets in core -->
    <text x="0" y="14" text-anchor="middle" font-family="monospace" font-size="30" fill="#F8FAFC">&lt;/&gt;</text>

    <!-- Orbit nodes (agents) -->
    <circle cx="150" cy="0" r="10" fill="#FF9800"/>
    <text x="150" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#0F172A" font-weight="bold">A1</text>
    <circle cx="-150" cy="0" r="10" fill="#FF9800"/>
    <text x="-150" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#0F172A" font-weight="bold">A2</text>
    <circle cx="0" cy="150" r="10" fill="#FF9800"/>
    <text x="0" y="154" text-anchor="middle" font-family="monospace" font-size="9" fill="#0F172A" font-weight="bold">A3</text>
    <circle cx="0" cy="-150" r="10" fill="#FF9800"/>
    <text x="0" y="-146" text-anchor="middle" font-family="monospace" font-size="9" fill="#0F172A" font-weight="bold">A4</text>
    <circle cx="106" cy="106" r="10" fill="#018786"/>
    <circle cx="-106" cy="106" r="10" fill="#018786"/>
    <circle cx="106" cy="-106" r="10" fill="#018786"/>
    <circle cx="-106" cy="-106" r="10" fill="#018786"/>
  </g>

  <!-- Title -->
  <text x="600" y="480" text-anchor="middle" font-family="monospace" font-size="44" font-weight="bold" fill="#F8FAFC">DARK FACTORY</text>
  <!-- Tagline -->
  <text x="600" y="525" text-anchor="middle" font-family="monospace" font-size="21" fill="#94A3B8">The Self-Evolving Software Factory</text>
  <!-- Sub-line -->
  <text x="600" y="558" text-anchor="middle" font-family="monospace" font-size="15" fill="#018786">FSPEC &middot; AGENT OS &middot; PROGRESSIVE AUTONOMY</text>

  <!-- Brand mark -->
  <rect x="528" y="588" width="144" height="26" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="606" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748B">ARCEAPPS &middot; 2026</text>
</svg>
