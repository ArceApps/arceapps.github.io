<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid2)" opacity="0.5"/>

  <text x="60" y="62" font-family="monospace" font-size="30" font-weight="bold" fill="#F8FAFC">ANATOMÍA DE UNA DARK FACTORY</text>
  <text x="60" y="92" font-family="monospace" font-size="16" fill="#94A3B8">Cinco componentes coordinados bajo un anillo de gobernanza</text>

  <!-- Governance ring (outer) -->
  <rect x="40" y="120" width="1120" height="420" rx="16" fill="none" stroke="#FF9800" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="148" text-anchor="middle" font-family="monospace" font-size="14" fill="#FF9800">G O B E R N A N Z A &nbsp;·&nbsp; L Í M I T E S &nbsp;·&nbsp; H A R N E S S</text>

  <!-- Planner -->
  <rect x="80" y="200" width="180" height="130" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="170" y="240" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">PLANNER</text>
  <text x="170" y="268" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">Descompone el objetivo</text>
  <text x="170" y="288" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">en subtareas concretas</text>
  <text x="170" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#018786">razonamiento de alto nivel</text>

  <!-- Generator -->
  <rect x="310" y="200" width="180" height="130" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="400" y="240" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">GENERATOR</text>
  <text x="400" y="268" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">Escribe el código</text>
  <text x="400" y="288" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">de cada subtarea</text>
  <text x="400" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#018786">mayor carga de inferencia</text>

  <!-- Validator -->
  <rect x="540" y="200" width="180" height="130" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="630" y="240" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">VALIDATOR</text>
  <text x="630" y="268" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">Tests + tipos + análisis</text>
  <text x="630" y="288" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">revisor interno</text>
  <text x="630" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#018786">patrón GAN: uno construye, otro critica</text>

  <!-- Orchestrator -->
  <rect x="770" y="200" width="180" height="130" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="860" y="240" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">ORCHESTRATOR</text>
  <text x="860" y="268" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">Coordina, gestiona estado,</text>
  <text x="860" y="288" text-anchor="middle" font-family="monospace" font-size="12" fill="#94A3B8">reintenta o escala</text>
  <text x="860" y="315" text-anchor="middle" font-family="monospace" font-size="11" fill="#018786">el problema más difícil</text>

  <!-- Deployment -->
  <rect x="1000" y="200" width="140" height="130" rx="10" fill="#018786" stroke="#FF9800" stroke-width="2"/>
  <text x="1070" y="240" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#0F172A">DEPLOY</text>
  <text x="1070" y="268" text-anchor="middle" font-family="monospace" font-size="11" fill="#0F172A">commit + push</text>
  <text x="1070" y="288" text-anchor="middle" font-family="monospace" font-size="11" fill="#0F172A">+ deploy</text>
  <text x="1070" y="315" text-anchor="middle" font-family="monospace" font-size="10" fill="#0F172A">tras validación</text>

  <!-- Flow arrows -->
  <line x1="260" y1="265" x2="305" y2="265" stroke="#FF9800" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="490" y1="265" x2="535" y2="265" stroke="#FF9800" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="720" y1="265" x2="765" y2="265" stroke="#FF9800" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="950" y1="265" x2="995" y2="265" stroke="#FF9800" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Parallelism note -->
  <rect x="80" y="380" width="1060" height="55" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="405" font-family="monospace" font-size="14" font-weight="bold" fill="#018786">PARALELISMO · SPLIT-AND-MERGE</text>
  <text x="100" y="425" font-family="monospace" font-size="12" fill="#94A3B8">El planner divide el trabajo en ramas paralelas (git worktrees) y un paso de merge reconcilia las salidas.</text>

  <!-- Feedback loop -->
  <text x="600" y="475" text-anchor="middle" font-family="monospace" font-size="13" fill="#FF9800">⟲ bucle de retroalimentación: fallo → diagnóstico → reintento → escalado humano si sale de límites</text>

  <text x="600" y="585" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748B">ARCEAPPS · DARK FACTORY · 2026</text>
</svg>
