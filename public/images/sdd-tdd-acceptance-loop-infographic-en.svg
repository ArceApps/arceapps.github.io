<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SDD and TDD from specification to verified delivery"><rect width="1200" height="630" fill="#eff7f3"/><text x="40" y="72" fill="#123c44" font-size="42" font-family="Arial,sans-serif">SDD + TDD: a feature from start to finish</text><text x="42" y="125" fill="#018786" font-size="22" font-family="Arial,sans-serif">Intent → test → implementation → evidence</text><path d="M40 163H1155" stroke="#FF9800" stroke-width="5"/><rect x="35" y="202" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="71" cy="238" r="25" fill="#d7f5e8"/><text x="57" y="247" fill="#018786" font-size="23" font-family="Arial,sans-serif">01</text><text x="49" y="291" fill="#183d40" font-size="18" font-family="Arial,sans-serif">SPECIFY</text><text x="51" y="346" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Intent and scope</text><text x="51" y="400" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Limits and risks</text><text x="51" y="454" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Testable outcomes</text><rect x="268" y="202" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="304" cy="238" r="25" fill="#fee2e2"/><text x="290" y="247" fill="#c2413b" font-size="23" font-family="Arial,sans-serif">02</text><text x="282" y="291" fill="#183d40" font-size="18" font-family="Arial,sans-serif">RED TEST</text><text x="284" y="346" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Reproducible failure</text><text x="284" y="400" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Edge case first</text><text x="284" y="454" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• No implementation yet</text><rect x="501" y="202" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="537" cy="238" r="25" fill="#d7f5e8"/><text x="523" y="247" fill="#018786" font-size="23" font-family="Arial,sans-serif">03</text><text x="515" y="291" fill="#183d40" font-size="18" font-family="Arial,sans-serif">IMPLEMENT</text><text x="517" y="346" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Minimum change</text><text x="517" y="400" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Avoid scope creep</text><text x="517" y="454" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Review diff</text><rect x="734" y="202" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="770" cy="238" r="25" fill="#d7f5e8"/><text x="756" y="247" fill="#018786" font-size="23" font-family="Arial,sans-serif">04</text><text x="748" y="291" fill="#183d40" font-size="18" font-family="Arial,sans-serif">REFACTOR</text><text x="750" y="346" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Keep tests green</text><text x="750" y="400" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Remove duplication</text><text x="750" y="454" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Preserve contract</text><rect x="967" y="202" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="1003" cy="238" r="25" fill="#d7f5e8"/><text x="989" y="247" fill="#018786" font-size="23" font-family="Arial,sans-serif">05</text><text x="981" y="291" fill="#183d40" font-size="18" font-family="Arial,sans-serif">VERIFY</text><text x="983" y="346" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Automated CI</text><text x="983" y="400" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• UX and security</text><text x="983" y="454" fill="#43625f" font-size="16" font-family="Arial,sans-serif">• Definition of Done</text><text x="45" y="551" fill="#365d58" font-size="20" font-family="Arial,sans-serif">Scale the process to the risk: small features do not need ten documents.</text><path d="M40 579H1156" stroke="#018786" stroke-width="2"/><text x="43" y="608" fill="#47665d" font-size="16" font-family="Arial,sans-serif">ARCEAPPS · PRACTICAL GUIDE · OCTOBER 2026</text></svg>