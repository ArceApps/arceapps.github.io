<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Cookie consent: default denied before gtag.js loads</title>
<desc id="desc">A consent flow diagram: a main-thread default of denied, a bilingual banner, and only analytics_storage moving to granted, while advertising signals stay denied.</desc>
<rect width="1200" height="630" rx="36" fill="#0B1220"/>
<circle cx="140" cy="110" r="86" fill="#2563EB" opacity=".18"/>
<circle cx="1070" cy="540" r="110" fill="#10B981" opacity=".14"/>
<text x="80" y="96" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#F8FAFC">Consent Mode v2: el default llega primero</text>
<text x="80" y="132" font-family="Arial,sans-serif" font-size="20" fill="#93C5FD">main-thread · antes de gtag.js · sin cookies antes de decidir</text>

<g transform="translate(80 190)">
  <rect width="320" height="150" rx="20" fill="#111C2E" stroke="#2563EB" stroke-width="3"/>
  <text x="24" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">1 · default</text>
  <text x="24" y="80" font-family="Arial,sans-serif" font-size="18" fill="#CBD5E1">analytics_storage: denied</text>
  <text x="24" y="108" font-family="Arial,sans-serif" font-size="18" fill="#CBD5E1">ad_storage: denied</text>
  <text x="24" y="136" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">functionality: granted</text>
</g>

<g transform="translate(440 190)">
  <rect width="320" height="150" rx="20" fill="#111C2E" stroke="#93C5FD" stroke-width="3"/>
  <text x="24" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">2 · banner</text>
  <text x="24" y="80" font-family="Arial,sans-serif" font-size="18" fill="#CBD5E1">Aceptar / Rechazar</text>
  <text x="24" y="108" font-family="Arial,sans-serif" font-size="18" fill="#CBD5E1">mismo peso visual</text>
  <text x="24" y="136" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">sin oscuros patrones</text>
</g>

<g transform="translate(800 190)">
  <rect width="320" height="150" rx="20" fill="#111C2E" stroke="#10B981" stroke-width="3"/>
  <text x="24" y="44" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">3 · update</text>
  <text x="24" y="80" font-family="Arial,sans-serif" font-size="18" fill="#6EE7B7">analytics_storage: granted</text>
  <text x="24" y="108" font-family="Arial,sans-serif" font-size="18" fill="#CBD5E1">solo si acepta</text>
  <text x="24" y="136" font-family="Arial,sans-serif" font-size="18" fill="#94A3B8">ad_* siempre denied</text>
</g>

<g transform="translate(80 400)">
  <rect width="1040" height="150" rx="20" fill="#0F172A" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="30" y="52" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">Verificación real, no de intuición</text>
  <text x="30" y="90" font-family="Arial,sans-serif" font-size="19" fill="#CBD5E1">E2E por cookies y red · contract test del orden del default · cero cookies antes de decidir</text>
  <text x="30" y="122" font-family="Arial,sans-serif" font-size="19" fill="#94A3B8">Partytown fuera del camino de la analítica: el orden no estaba garantizado en el worker</text>
</g>
</svg>
