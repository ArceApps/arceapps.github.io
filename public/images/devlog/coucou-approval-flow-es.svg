<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Coucou: una aprobación debe ser exacta</title><desc id="desc">Enlace local Android (iPhone funciona mediante CloudKit)</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="67" font-size="31" font-weight="700" fill="white" text-anchor="middle">Coucou: una aprobación debe ser exacta</text><path d="M110 100H1090" stroke="#018786" stroke-width="2"/><g><rect x="32" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#018786" stroke-width="3"/><text x="155" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Agente</text><text x="155" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">hook de evento</text><text x="155" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">sesión concreta</text></g><g><rect x="332" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#ff9800" stroke-width="3"/><text x="455" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Relay</text><text x="455" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">transporta estado</text><text x="455" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">al escritorio</text></g><g><rect x="632" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#018786" stroke-width="3"/><text x="755" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Android</text><text x="755" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">muestra petición</text><text x="755" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">autoriza o deniega</text></g><g><rect x="932" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#ff9800" stroke-width="3"/><text x="1055" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Escritorio</text><text