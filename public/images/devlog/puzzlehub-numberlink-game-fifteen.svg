<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Numberlink joins the PuzzleHub catalog as game 15</title>
  <desc id="d">A 6x6 Numberlink board where three numbered pairs are joined by orthogonal paths that partition all 36 cells without crossing, next to a grid of fifteen catalog tiles with the fifteenth one highlighted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#1e2c47" stroke-width="1" opacity="0.45">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M200 0v630M400 0v630M600 0v630M800 0v630M1000 0v630"/>
  </g>

  <!-- Left: 6x6 board, strict variant. Three paths partition all 36 cells. -->
  <text x="64" y="72" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="24" font-weight="600" fill="#8fa3c2">strict variant &#183; 6&#215;6 &#183; every cell covered</text>
  <g transform="translate(64,96)">
    <rect x="-8" y="-8" width="392" height="392" rx="14" fill="#5eead4" opacity="0.07"/>
    <rect width="376" height="376" rx="10" fill="#0e1728" stroke="#134e4a" stroke-width="2"/>
    <g stroke="#24344f" stroke-width="1.4">
      <path d="M62.67 0v376M125.33 0v376M188 0v376M250.67 0v376M313.33 0v376"/>
      <path d="M0 62.67h376M0 125.33h376M0 188h376M0 250.67h376M0 313.33h376"/>
    </g>

    <!-- Pair 1 (teal): row 0 across, then down the right edge -->
    <path d="M31.33 31.33 H344.67 V156.67" fill="none" stroke="#5eead4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pair 2 (orange): row 1 back to the left, then down and along row 3 -->
    <path d="M282 94 H31.33 V219.33 H219.33" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pair 3 (violet): row 2, then the right column down, then rows 5 and 4 -->
    <path d="M94 156.67 H282 V219.33 H344.67 V344.67 H31.33 V282 H282" fill="none" stroke="#a78bfa" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- endpoints -->
    <g>
      <circle cx="31.33" cy="31.33" r="17" fill="#0e1728" stroke="#5eead4" stroke-width="4"/>
      <circle cx="344.67" cy="156.67" r="17" fill="#0e1728" stroke="#5eead4" stroke-width="4"/>
      <circle cx="282" cy="94" r="17" fill="#0e1728" stroke="#fb923c" stroke-width="4"/>
      <circle cx="219.33" cy="219.33" r="17" fill="#0e1728" stroke="#fb923c" stroke-width="4"/>
      <circle cx="94" cy="156.67" r="17" fill="#0e1728" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="282" cy="282" r="17" fill="#0e1728" stroke="#a78bfa" stroke-width="4"/>
    </g>
    <g font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#e6edf7">
      <text x="31.33" y="38">1</text>
      <text x="344.67" y="163">1</text>
      <text x="282" y="101">2</text>
      <text x="219.33" y="226">2</text>
      <text x="94" y="163">3</text>
      <text x="282" y="289">3</text>
    </g>
  </g>
  <text x="64" y="528" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="16" fill="#8fa3c2">paths never cross, never share a cell</text>
  <text x="64" y="554" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="16" fill="#8fa3c2">one solution, verified by the solver</text>

  <!-- Arrow -->
  <g transform="translate(486,296)">
    <text x="18" y="-22" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2" text-anchor="middle">registers in</text>
    <path d="M0 0h34" stroke="#5b7191" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 -9l14 9-14 9z" fill="#5b7191"/>
    <text x="18" y="30" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2" text-anchor="middle">14 points</text>
  </g>

  <!-- Right: the catalog, 15 tiles, the last one highlighted -->
  <text x="580" y="72" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="24" font-weight="600" fill="#8fa3c2">the catalog &#183; 14 tiles and one new</text>
  <g transform="translate(580,96)">
    <g fill="#141f36" stroke="#22314c" stroke-width="2">
      <rect x="0" y="0" width="76" height="76" rx="14"/>
      <rect x="86" y="0" width="76" height="76" rx="14"/>
      <rect x="172" y="0" width="76" height="76" rx="14"/>
      <rect x="258" y="0" width="76" height="76" rx="14"/>
      <rect x="344" y="0" width="76" height="76" rx="14"/>
      <rect x="0" y="86" width="76" height="76" rx="14"/>
      <rect x="86" y="86" width="76" height="76" rx="14"/>
      <rect x="172" y="86" width="76" height="76" rx="14"/>
      <rect x="258" y="86" width="76" height="76" rx="14"/>
      <rect x="344" y="86" width="76" height="76" rx="14"/>
      <rect x="0" y="172" width="76" height="76" rx="14"/>
      <rect x="86" y="172" width="76" height="76" rx="14"/>
      <rect x="172" y="172" width="76" height="76" rx="14"/>
      <rect x="258" y="172" width="76" height="76" rx="14"/>
      <rect x="344" y="172" width="76" height="76" rx="14"/>
      <rect x="0" y="258" width="76" height="76" rx="14"/>
    </g>
    <!-- the fifteenth tile: Numberlink -->
    <g>
      <rect x="86" y="258" width="76" height="76" rx="14" fill="#0e2a2a" stroke="#5eead4" stroke-width="3" filter="url(#glow)"/>
      <path d="M99 273 H137 V293" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M148 273 V312" fill="none" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>
      <g fill="#e6edf7">
        <circle cx="99" cy="273" r="5"/>
        <circle cx="137" cy="293" r="5"/>
        <circle cx="148" cy="273" r="5"/>
        <circle cx="148" cy="312" r="5"/>
      </g>
      <text x="124" y="327" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#5eead4" text-anchor="middle">15</text>
    </g>
  </g>
  <text x="580" y="490" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="16" fill="#8fa3c2">GameType 14 &#8594; 15 &#183; 6 routes &#183; 94 files</text>
  <text x="580" y="516" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="16" fill="#8fa3c2">menu, stats, achievements, history, info</text>

  <rect x="64" y="586" width="1072" height="4" rx="2" fill="url(#accent)" opacity="0.85"/>
</svg>
