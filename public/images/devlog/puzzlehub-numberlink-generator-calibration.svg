<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Numberlink generator calibration</title>
  <desc id="d">Two 8x8 Numberlink boards comparing a miscalibrated generator that fills the board with numbered endpoints against a calibrated one where six long paths partition every cell exactly once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#1e2c47" stroke-width="1" opacity="0.5">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>

  <text x="64" y="70" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="33" font-weight="700" fill="#e6edf7">Numberlink: 28 pairs or 6?</text>
  <text x="64" y="102" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="18" fill="#8fa3c2">The crash was not a broken algorithm. It was a bad number.</text>
  <rect x="64" y="120" width="168" height="4" rx="2" fill="url(#good)"/>

  <!-- LEFT: v1 miscalibrated -->
  <text x="64" y="180" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#fdba74">v1 &#183; 8&#215;8 EASY &#183; 28&#8211;31 pairs</text>
  <g transform="translate(64,198)">
    <rect x="-6" y="-6" width="322" height="322" rx="14" fill="#f97316" opacity="0.10"/>
    <rect width="310" height="310" rx="10" fill="#0e1728" stroke="#7c2d12" stroke-width="2"/>
    <g stroke="#24344f" stroke-width="1.5">
      <path d="M38.75 0v310M77.5 0v310M116.25 0v310M155 0v310M193.75 0v310M232.5 0v310M271.25 0v310"/>
      <path d="M0 38.75h310M0 77.5h310M0 116.25h310M0 155h310M0 193.75h310M0 232.5h310M0 271.25h310"/>
    </g>
    <g font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="url(#bad)">
      <text x="19.4" y="24">1</text><text x="58.1" y="24">2</text><text x="96.9" y="24">3</text><text x="135.6" y="24">4</text><text x="174.4" y="24"></text><text x="213.1" y="24">6</text><text x="251.9" y="24">7</text><text x="290.6" y="24">8</text>
      <text x="19.4" y="63">8</text><text x="58.1" y="63">7</text><text x="96.9" y="63">6</text><text x="135.6" y="63">5</text><text x="174.4" y="63">4</text><text x="213.1" y="63">3</text><text x="251.9" y="63">2</text><text x="290.6" y="63">1</text>
      <text x="19.4" y="101">2</text><text x="58.1" y="101">3</text><text x="96.9" y="101">4</text><text x="135.6" y="101">5</text><text x="174.4" y="101">6</text><text x="213.1" y="101">7</text><text x="251.9" y="101">8</text><text x="290.6" y="101">9</text>
      <text x="19.4" y="140">9</text><text x="58.1" y="140">8</text><text x="96.9" y="140">7</text><text x="135.6" y="140">6</text><text x="174.4" y="140">5</text><text x="213.1" y="140">4</text><text x="251.9" y="140"></text><text x="290.6" y="140">2</text>
      <text x="19.4" y="179">3</text><text x="58.1" y="179">4</text><text x="96.9" y="179">5</text><text x="135.6" y="179">6</text><text x="174.4" y="179">7</text><text x="213.1" y="179">8</text><text x="251.9" y="179">9</text><text x="290.6" y="179">1</text>
      <text x="19.4" y="217">1</text><text x="58.1" y="217">2</text><text x="96.9" y="217">3</text><text x="135.6" y="217">4</text><text x="174.4" y="217">5</text><text x="213.1" y="217">6</text><text x="251.9" y="217">7</text><text x="290.6" y="217">8</text>
      <text x="19.4" y="256">8</text><text x="58.1" y="256">7</text><text x="96.9" y="256"></text><text x="135.6" y="256">5</text><text x="174.4" y="256">4</text><text x="213.1" y="256">3</text><text x="251.9" y="256">2</text><text x="290.6" y="256">1</text>
      <text x="19.4" y="295">4</text><text x="58.1" y="295">5</text><text x="96.9" y="295">6</text><text x="135.6" y="295"></text><text x="174.4" y="295">8</text><text x="213.1" y="295">9</text><text x="251.9" y="295">1</text><text x="290.6" y="295">2</text>
    </g>
  </g>
  <text x="64" y="552" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="15" fill="#e0a882">56&#8211;62 of 64 cells are numbered endpoints</text>
  <text x="64" y="576" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="15" fill="#e0a882">paths of length 1&#8211;2 &#183; nothing left to deduce</text>
  <rect x="64" y="590" width="310" height="4" rx="2" fill="url(#bad)" opacity="0.7"/>

  <!-- ARROW -->
  <g transform="translate(412,352)">
    <text x="24" y="-20" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2" text-anchor="middle">recalibrate</text>
    <path d="M0 0h40" stroke="#5b7191" stroke-width="3" stroke-linecap="round"/>
    <path d="M36 -9l14 9-14 9z" fill="#5b7191"/>
    <text x="24" y="32" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2" text-anchor="middle">k &#8776; &#8730;(W&#183;H)</text>
  </g>

  <!-- RIGHT: v2 calibrated, strict full coverage -->
  <text x="500" y="180" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="600" fill="#5eead4">v2 &#183; 8&#215;8 EASY &#183; 6&#8211;7 pairs</text>
  <g transform="translate(500,198)">
    <rect x="-6" y="-6" width="322" height="322" rx="14" fill="#5eead4" opacity="0.08"/>
    <rect width="310" height="310" rx="10" fill="#0e1728" stroke="#134e4a" stroke-width="2"/>
    <g stroke="#24344f" stroke-width="1.5">
      <path d="M38.75 0v310M77.5 0v310M116.25 0v310M155 0v310M193.75 0v310M232.5 0v310M271.25 0v310"/>
      <path d="M0 38.75h310M0 77.5h310M0 116.25h310M0 155h310M0 193.75h310M0 232.5h310M0 271.25h310"/>
    </g>

    <!-- six disjoint orthogonal paths covering all 64 cells exactly once -->
    <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.42">
      <path d="M19.4 19.4H290.6V58.1" stroke="#5eead4"/>
      <path d="M251.9 58.1H19.4V96.9H135.6" stroke="#34d399"/>
      <path d="M174.4 96.9H290.6V135.6H58.1" stroke="#38bdf8"/>
      <path d="M19.4 135.6V174.4H290.6V213.1" stroke="#5eead4"/>
      <path d="M251.9 213.1H19.4V251.9H174.4" stroke="#34d399"/>
      <path d="M213.1 251.9H290.6V290.6H19.4" stroke="#38bdf8"/>
    </g>
    <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.4 19.4H290.6V58.1" stroke="#7ff0e2"/>
      <path d="M251.9 58.1H19.4V96.9H135.6" stroke="#5ee7b6"/>
      <path d="M174.4 96.9H290.6V135.6H58.1" stroke="#7dd3fc"/>
      <path d="M19.4 135.6V174.4H290.6V213.1" stroke="#7ff0e2"/>
      <path d="M251.9 213.1H19.4V251.9H174.4" stroke="#5ee7b6"/>
      <path d="M213.1 251.9H290.6V290.6H19.4" stroke="#7dd3fc"/>
    </g>

    <!-- twelve endpoints -->
    <g stroke="#062a28" stroke-width="2.5">
      <circle cx="19.4" cy="19.4" r="13" fill="url(#good)"/>
      <circle cx="290.6" cy="58.1" r="13" fill="url(#good)"/>
      <circle cx="251.9" cy="58.1" r="13" fill="#34d399"/>
      <circle cx="135.6" cy="96.9" r="13" fill="#34d399"/>
      <circle cx="174.4" cy="96.9" r="13" fill="#38bdf8"/>
      <circle cx="58.1" cy="135.6" r="13" fill="#38bdf8"/>
      <circle cx="19.4" cy="135.6" r="13" fill="url(#good)"/>
      <circle cx="290.6" cy="213.1" r="13" fill="url(#good)"/>
      <circle cx="251.9" cy="213.1" r="13" fill="#34d399"/>
      <circle cx="174.4" cy="251.9" r="13" fill="#34d399"/>
      <circle cx="213.1" cy="251.9" r="13" fill="#38bdf8"/>
      <circle cx="19.4" cy="290.6" r="13" fill="#38bdf8"/>
    </g>
    <g font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#052e2b">
      <text x="19.4" y="24.4">1</text><text x="290.6" y="63.1">1</text>
      <text x="251.9" y="63.1">2</text><text x="135.6" y="101.9">2</text>
      <text x="174.4" y="101.9">3</text><text x="58.1" y="140.6">3</text>
      <text x="19.4" y="140.6">4</text><text x="290.6" y="218.1">4</text>
      <text x="251.9" y="218.1">5</text><text x="174.4" y="256.9">5</text>
      <text x="213.1" y="256.9">6</text><text x="19.4" y="295.6">6</text>
    </g>
  </g>
  <text x="500" y="552" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="15" fill="#7fd6cd">6 pairs &#183; 12 endpoints &#183; every cell covered</text>
  <text x="500" y="576" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="15" fill="#7fd6cd">min path length &#8805; 3 &#183; Manhattan &#8805; 2</text>
  <rect x="500" y="590" width="310" height="4" rx="2" fill="url(#good)" opacity="0.8"/>

  <!-- RIGHT COLUMN -->
  <g transform="translate(858,166)">
    <rect width="286" height="430" rx="14" fill="#0d1526" stroke="#22344f" stroke-width="1.5"/>
    <text x="24" y="38" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="16" font-weight="700" fill="#e6edf7">Three decisions</text>
    <line x1="24" y1="54" x2="262" y2="54" stroke="#22344f" stroke-width="1.5"/>

    <circle cx="38" cy="88" r="13" fill="#1e3a5f"/>
    <text x="38" y="93" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle">1</text>
    <text x="62" y="84" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#dbe6f5">Calibration</text>
    <text x="62" y="104" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">k = round(&#945; &#183; &#8730;(W&#183;H) &#183; &#946;)</text>
    <text x="62" y="122" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">&#945;: 0.50 easy &#8594; 1.00 expert</text>

    <circle cx="38" cy="174" r="13" fill="#1e3a5f"/>
    <text x="38" y="179" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle">2</text>
    <text x="62" y="170" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#dbe6f5">Pruning</text>
    <text x="62" y="190" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">2&#215;2 ambiguity, dead-ends,</text>
    <text x="62" y="208" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">stranded colors</text>

    <circle cx="38" cy="260" r="13" fill="#1e3a5f"/>
    <text x="38" y="265" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#93c5fd" text-anchor="middle">3</text>
    <text x="62" y="256" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#dbe6f5">Budget</text>
    <text x="62" y="276" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">500 000 &#8594; 50 000 nodes</text>
    <text x="62" y="294" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" fill="#8fa3c2">probe 15k &#183; confirm 60k</text>

    <line x1="24" y1="320" x2="262" y2="320" stroke="#22344f" stroke-width="1.5"/>
    <text x="24" y="346" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700" fill="#5eead4">UNKNOWN &#8800; NOT UNIQUE</text>
    <text x="24" y="368" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="12.5" fill="#8fa3c2">budget exhausted is an</text>
    <text x="24" y="386" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="12.5" fill="#8fa3c2">inconclusive state,</text>
    <text x="24" y="404" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="12.5" fill="#8fa3c2">never a crash</text>
  </g>
</svg>