<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Vitest guard walking src/content for secrets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.18" fill="#94a3b8">
    <g id="dots">
      <circle cx="60" cy="60" r="1.6"/><circle cx="120" cy="60" r="1.6"/><circle cx="180" cy="60" r="1.6"/>
    </g>
    <use href="#dots" x="60" y="60"/>
    <use href="#dots" x="120" y="120"/>
    <use href="#dots" x="180" y="180"/>
    <use href="#dots" x="240" y="240"/>
    <use href="#dots" x="300" y="300"/>
    <use href="#dots" x="360" y="360"/>
    <use href="#dots" x="420" y="420"/>
    <use href="#dots" x="480" y="480"/>
    <use href="#dots" x="540" y="540"/>
    <use href="#dots" x="600" y="540"/>
    <use href="#dots" x="660" y="540"/>
    <use href="#dots" x="720" y="540"/>
  </g>

  <!-- Stack of editorial pages (documents) on the left -->
  <g transform="translate(140 130)">
    <!-- Document 3 (back) -->
    <g transform="translate(60 30) rotate(-6)">
      <rect width="380" height="430" rx="14" fill="url(#doc)" opacity="0.55"/>
    </g>
    <!-- Document 2 (middle) -->
    <g transform="translate(30 12) rotate(-2)">
      <rect width="380" height="430" rx="14" fill="url(#doc)" opacity="0.78"/>
      <!-- prose lines -->
      <g fill="#cbd5e1">
        <rect x="28" y="36" width="220" height="10" rx="4"/>
        <rect x="28" y="60" width="280" height="8" rx="3"/>
        <rect x="28" y="80" width="240" height="8" rx="3"/>
        <rect x="28" y="100" width="260" height="8" rx="3"/>
        <rect x="28" y="130" width="180" height="8" rx="3"/>
        <rect x="28" y="150" width="220" height="8" rx="3"/>
        <rect x="28" y="170" width="200" height="8" rx="3"/>
      </g>
    </g>
    <!-- Document 1 (front) -->
    <g>
      <rect width="380" height="430" rx="14" fill="url(#doc)"/>
      <rect x="0" y="0" width="380" height="46" rx="14" fill="#0f172a"/>
      <rect x="0" y="34" width="380" height="12" fill="#0f172a"/>
      <!-- title bar inside page header -->
      <rect x="22" y="14" width="120" height="18" rx="3" fill="#22d3ee" opacity="0.85"/>
      <!-- prose lines -->
      <g fill="#475569">
        <rect x="28" y="74" width="280" height="10" rx="3"/>
        <rect x="28" y="100" width="320" height="8" rx="3"/>
        <rect x="28" y="120" width="240" height="8" rx="3"/>
        <rect x="28" y="140" width="300" height="8" rx="3"/>
        <rect x="28" y="172" width="180" height="10" rx="3"/>
        <rect x="28" y="198" width="280" height="8" rx="3"/>
        <rect x="28" y="218" width="220" height="8" rx="3"/>
        <rect x="28" y="238" width="260" height="8" rx="3"/>
        <rect x="28" y="270" width="160" height="10" rx="3"/>
        <rect x="28" y="296" width="240" height="8" rx="3"/>
        <rect x="28" y="316" width="200" height="8" rx="3"/>
      </g>
      <!-- one highlighted "secret" line that the guard caught -->
      <rect x="22" y="346" width="336" height="22" rx="4" fill="#fee2e2"/>
      <rect x="32" y="354" width="200" height="6" rx="3" fill="#dc2626" opacity="0.85"/>
    </g>
  </g>

  <!-- Shield / guard on the right -->
  <g transform="translate(800 110)">
    <!-- glow halo -->
    <circle cx="180" cy="200" r="190" fill="url(#shield)" opacity="0.18" filter="url(#soft)"/>
    <!-- shield outline -->
    <path d="M180 30 L320 80 L320 220 Q320 320 180 380 Q40 320 40 220 L40 80 Z"
          fill="url(#shield)" stroke="#67e8f9" stroke-width="2"/>
    <!-- shield inner -->
    <path d="M180 60 L290 100 L290 220 Q290 300 180 350 Q70 300 70 220 L70 100 Z"
          fill="#0f172a" opacity="0.18"/>
    <!-- checkmark inside shield -->
    <path d="M120 200 L165 245 L245 160" fill="none" stroke="#ecfeff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- code brackets on top of shield (vitest feel) -->
    <g fill="#a5f3fc" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="22" font-weight="600">
      <text x="100" y="-8" opacity="0.85">pnpm test</text>
    </g>
  </g>

  <!-- Scanning beam from shield over the page -->
  <g opacity="0.55">
    <path d="M820 220 Q620 240 480 360" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="480" cy="360" r="6" fill="#34d399"/>
    <circle cx="820" cy="220" r="6" fill="#34d399"/>
  </g>

  <!-- Footer accent strip -->
  <rect x="0" y="606" width="1200" height="24" fill="url(#accent)" opacity="0.85"/>
</svg>
