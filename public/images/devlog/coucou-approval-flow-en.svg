<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Coucou: every approval must match</title><desc id="desc">Local Android path (iPhone instead uses CloudKit)</desc><rect width="1200" height="430" rx="22" fill="#0f172a"/><g font-family="system-ui,sans-serif"><text x="600" y="67" font-size="31" font-weight="700" fill="white" text-anchor="middle">Coucou: every approval must match</text><path d="M110 100H1090" stroke="#018786" stroke-width="2"/><g><rect x="32" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#018786" stroke-width="3"/><text x="155" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Agent</text><text x="155" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">event hook</text><text x="155" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">specific session</text></g><g><rect x="332" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#ff9800" stroke-width="3"/><text x="455" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Relay</text><text x="455" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">reports events</text><text x="455" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">to desktop</text></g><g><rect x="632" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#018786" stroke-width="3"/><text x="755" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Android</text><text x="755" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">shows a request</text><text x="755" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">allow or deny</text></g><g><rect x="932" y="140" rx="18" width="247" height="205" fill="#153442" stroke="#ff9800" stroke-width="3"/><text x="1055" y="205" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">Desktop</text><text x="1055" y="259" fill="#d0f0f0" font-size="17" text-anchor="middle">checks fingerprint</text><text x="1055" y="287" fill="#c0d4d9" font-size="16" text-anchor="middle">and expiry</text></g><path d="M282 235h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M582 235h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M882 235h26m-9-11 11 11-11 11" stroke="#ff9800" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="395" font-size="18" fill="#d0e4ea" text-anchor="middle">Local Android path (iPhone instead uses CloudKit)</text></g></svg>