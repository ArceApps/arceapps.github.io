<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">RadioHub persistent favorite reorder</title>
<desc id="desc">A hand drags a favorite row into a new position; the new order flows into Room and persists across app sessions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1d28"/><stop offset="1" stop-color="#16384a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#23c7b9"/><stop offset="1" stop-color="#ff9800"/></linearGradient>
  <linearGradient id="row" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#15303c"/><stop offset="1" stop-color="#0f2632"/></linearGradient>
  <linearGradient id="rowActive" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f4357"/><stop offset="1" stop-color="#16384a"/></linearGradient>
  <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
    <feOffset dx="0" dy="8" result="off"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1600" height="900" rx="48" fill="url(#bg)"/>
<g opacity=".12" stroke="#8bb8c4" stroke-width="2"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g>
<text x="800" y="120" text-anchor="middle" fill="#f2fbfc" font-family="system-ui,sans-serif" font-size="52" font-weight="700">Favorites · persistent reorder</text>
<text x="800" y="170" text-anchor="middle" fill="#9fc4cc" font-family="system-ui,sans-serif" font-size="28">Room v5 → v6 · hysteresis · TalkBack</text>
<g transform="translate(420 230)">
  <rect width="760" height="560" rx="36" fill="#0a1a23" stroke="#1f4357" stroke-width="3"/>
  <rect x="36" y="36" width="688" height="60" rx="14" fill="#152838"/>
  <circle cx="74" cy="66" r="14" fill="#23c7b9"/>
  <text x="106" y="74" fill="#e9f7f8" font-family="system-ui,sans-serif" font-size="26" font-weight="600">Mis favoritas</text>
  <rect x="36" y="124" width="688" height="76" rx="18" fill="url(#row)" stroke="#1f4357" stroke-width="2"/>
  <circle cx="74" cy="162" r="14" fill="#ff9800"/>
  <rect x="102" y="146" width="360" height="14" rx="7" fill="#cfdfe5"/>
  <rect x="102" y="170" width="220" height="10" rx="5" fill="#7d9ba5"/>
  <g fill="#8bb8c4">
   <rect x="624" y="146" width="6" height="40" rx="3"/>
   <rect x="640" y="146" width="6" height="40" rx="3"/>
   <rect x="656" y="146" width="6" height="40" rx="3"/>
   <rect x="672" y="146" width="6" height="40" rx="3"/>
   <rect x="688" y="146" width="6" height="40" rx="3"/>
  </g>
  <rect x="36" y="216" width="688" height="76" rx="18" fill="url(#rowActive)" stroke="#23c7b9" stroke-width="3" filter="url(#lift)" transform="translate(0 -32)"/>
  <circle cx="74" cy="254" r="14" fill="#23c7b9"/>
  <rect x="102" y="238" width="420" height="14" rx="7" fill="#f2fbfc"/>
  <rect x="102" y="262" width="260" height="10" rx="5" fill="#9fc4cc"/>
  <g fill="#23c7b9">
   <rect x="624" y="238" width="6" height="40" rx="3"/>
   <rect x="640" y="238" width="6" height="40" rx="3"/>
   <rect x="656" y="238" width="6" height="40" rx="3"/>
   <rect x="672" y="238" width="6" height="40" rx="3"/>
   <rect x="688" y="238" width="6" height="40" rx="3"/>
  </g>
  <rect x="36" y="308" width="688" height="76" rx="18" fill="url(#row)" stroke="#1f4357" stroke-width="2"/>
  <circle cx="74" cy="346" r="14" fill="#ff9800"/>
  <rect x="102" y="330" width="320" height="14" rx="7" fill="#cfdfe5"/>
  <rect x="102" y="354" width="200" height="10" rx="5" fill="#7d9ba5"/>
  <g fill="#8bb8c4">
   <rect x="624" y="330" width="6" height="40" rx="3"/>
   <rect x="640" y="330" width="6" height="40" rx="3"/>
   <rect x="656" y="330" width="6" height="40" rx="3"/>
   <rect x="672" y="330" width="6" height="40" rx="3"/>
   <rect x="688" y="330" width="6" height="40" rx="3"/>
  </g>
  <rect x="36" y="400" width="688" height="76" rx="18" fill="url(#row)" stroke="#1f4357" stroke-width="2"/>
  <circle cx="74" cy="438" r="14" fill="#ff9800"/>
  <rect x="102" y="422" width="300" height="14" rx="7" fill="#cfdfe5"/>
  <rect x="102" y="446" width="180" height="10" rx="5" fill="#7d9ba5"/>
  <g fill="#8bb8c4">
   <rect x="624" y="422" width="6" height="40" rx="3"/>
   <rect x="640" y="422" width="6" height="40" rx="3"/>
   <rect x="656" y="422" width="6" height="40" rx="3"/>
   <rect x="672" y="422" width="6" height="40" rx="3"/>
   <rect x="688" y="422" width="6" height="40" rx="3"/>
  </g>
</g>
<g transform="translate(1240 250)" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
 <path d="M0 0 C -50 60, -50 140, 0 200"/>
 <path d="M-30 170 L 0 200 L 30 170"/>
</g>
<g transform="translate(1300 410)">
 <ellipse cx="60" cy="60" rx="100" ry="60" fill="#0e2431" stroke="#23c7b9" stroke-width="4"/>
 <ellipse cx="60" cy="60" rx="62" ry="36" fill="#16384a" stroke="#23c7b9" stroke-width="2"/>
 <text x="60" y="56" text-anchor="middle" fill="#f2fbfc" font-family="system-ui,sans-serif" font-size="20" font-weight="700">Room</text>
 <text x="60" y="80" text-anchor="middle" fill="#9fc4cc" font-family="system-ui,sans-serif" font-size="14">favoriteOrder</text>
</g>
<g fill="none" stroke="#ff9800" stroke-width="10" stroke-linecap="round" opacity=".9">
 <path d="M900 740 C 1050 740, 1100 700, 1180 700"/>
</g>
<g fill="none" stroke="#ff9800" stroke-width="6" stroke-linecap="round" opacity=".9">
 <path d="M1162 690 L 1180 700 L 1162 712"/>
</g>
<g transform="translate(1180 740)">
 <rect width="240" height="80" rx="20" fill="#0e2431" stroke="#ff9800" stroke-width="3"/>
 <text x="120" y="38" text-anchor="middle" fill="#f2fbfc" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Persistido</text>
 <text x="120" y="62" text-anchor="middle" fill="#9fc4cc" font-family="system-ui,sans-serif" font-size="14">across sessions</text>
</g>
<text x="800" y="830" text-anchor="middle" fill="#b9d7dd" font-family="system-ui,sans-serif" font-size="26">Reorder, persist, stay accessible</text>
</svg>