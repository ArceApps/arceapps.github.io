<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-if1-es" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-if1-es)" opacity="0.3"/>

  <!-- Title -->
  <text x="60" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" letter-spacing="2">FIGURA 1 · ANATOMÍA DE UNA SKILL</text>
  <text x="60" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#e2e8f0" font-weight="700">SKILL.md: 6 secciones, una forma consistente</text>

  <!-- 6 stacked cards representing each section -->
  <g transform="translate(60,150)">
    <!-- card 1: Overview -->
    <g transform="translate(0,0)">
      <rect width="540" height="60" fill="#1e293b" stroke="#018786" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#018786"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#018786" font-weight="700">OVERVIEW</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Qué hace y por qué existe</text>
    </g>
    <!-- card 2: When to Use -->
    <g transform="translate(0,75)">
      <rect width="540" height="60" fill="#1e293b" stroke="#018786" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#018786"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#018786" font-weight="700">WHEN TO USE</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Cuándo aplica · Cuándo NO aplica</text>
    </g>
    <!-- card 3: Process -->
    <g transform="translate(0,150)">
      <rect width="540" height="60" fill="#1e293b" stroke="#FF9800" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#FF9800"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#FF9800" font-weight="700">PROCESS</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Workflow paso a paso, con pseudo-código</text>
    </g>
    <!-- card 4: Rationalizations -->
    <g transform="translate(0,225)">
      <rect width="540" height="60" fill="#1e293b" stroke="#FF9800" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#FF9800"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#FF9800" font-weight="700">COMMON RATIONALIZATIONS</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Tabla: excusa → réplica (anti-skip)</text>
    </g>
    <!-- card 5: Red Flags -->
    <g transform="translate(0,300)">
      <rect width="540" height="60" fill="#1e293b" stroke="#FF9800" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#FF9800"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#FF9800" font-weight="700">RED FLAGS</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Señales de stop durante la acción</text>
    </g>
    <!-- card 6: Verification -->
    <g transform="translate(0,375)">
      <rect width="540" height="60" fill="#1e293b" stroke="#018786" stroke-width="1.5" rx="6"/>
      <rect x="0" y="0" width="6" height="60" fill="#018786"/>
      <text x="22" y="25" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#018786" font-weight="700">VERIFICATION</text>
      <text x="22" y="46" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#cbd5e1">Evidencia para considerar la skill completa</text>
    </g>
  </g>

  <!-- Right column: example rationalization table -->
  <g transform="translate(660,150)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#94a3b8" font-weight="700">EJEMPLO · TDD</text>
    <text y="22" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">Tabla de racionalizaciones reales del repo</text>

    <g transform="translate(0,40)">
      <!-- header -->
      <rect width="480" height="30" fill="#1e293b" stroke="#FF9800" stroke-width="1"/>
      <text x="14" y="20" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#FF9800" font-weight="700">RATIONALIZATION</text>
      <text x="250" y="20" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#FF9800" font-weight="700">REALITY</text>

      <!-- row 1 -->
      <rect y="30" width="480" height="60" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
      <text x="14" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">"El cambio es</text>
      <text x="14" y="64" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">trivial, no necesita</text>
      <text x="14" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">test"</text>
      <text x="250" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">Los bugs más caros</text>
      <text x="250" y="64" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">de mi carrera han</text>
      <text x="250" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">venido de cambios</text>
      <text x="250" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">"triviales"</text>

      <!-- row 2 -->
      <rect y="100" width="480" height="60" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
      <text x="14" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">"Ya lo testearé</text>
      <text x="14" y="134" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">a mano"</text>
      <text x="250" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">El test manual</text>
      <text x="250" y="134" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">desaparece en el</text>
      <text x="250" y="148" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">siguiente cambio.</text>
      <text x="250" y="162" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">Si no está en el</text>
      <text x="250" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">repo, no existe</text>

      <!-- row 3 -->
      <rect y="170" width="480" height="60" fill="#0F172A" stroke="#334155" stroke-width="0.5"/>
      <text x="14" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">"Es un refactor,</text>
      <text x="14" y="204" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">no cambia</text>
      <text x="14" y="218" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">comportamiento"</text>
      <text x="250" y="190" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">Precisamente por</text>
      <text x="250" y="204" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">eso el test es MÁS</text>
      <text x="250" y="218" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">importante: la red</text>
      <text x="250" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e2e8f0">de seguridad</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="60" y="585" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#94a3b8">Cada una de las 24 skills sigue esta misma plantilla. Por eso un eval framework puede auditar las 24 con reglas consistentes.</text>
  <text x="1140" y="585" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569" text-anchor="end">ARCEAPPS · 2026</text>
</svg>
