<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid1)" opacity="0.5"/>

  <text x="60" y="62" font-family="monospace" font-size="30" font-weight="bold" fill="#F8FAFC">THE 5 LEVELS OF AUTONOMY</text>
  <text x="60" y="92" font-family="monospace" font-size="16" fill="#94A3B8">From copilot assistance... to the full dark factory</text>

  <!-- Level 1 -->
  <rect x="60" y="140" width="200" height="70" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="76" y="168" font-family="monospace" font-size="15" font-weight="bold" fill="#FF9800">LEVEL 1</text>
  <text x="76" y="190" font-family="monospace" font-size="17" fill="#F8FAFC">AI-Assisted</text>
  <text x="76" y="210" font-family="monospace" font-size="12" fill="#94A3B8">Human reviews every line</text>

  <!-- Level 2 -->
  <rect x="280" y="140" width="200" height="70" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="296" y="168" font-family="monospace" font-size="15" font-weight="bold" fill="#FF9800">LEVEL 2</text>
  <text x="296" y="190" font-family="monospace" font-size="17" fill="#F8FAFC">AI-Generated + Review</text>
  <text x="296" y="210" font-family="monospace" font-size="12" fill="#94A3B8">Human reviews every PR</text>

  <!-- Level 3 -->
  <rect x="500" y="140" width="200" height="70" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="516" y="168" font-family="monospace" font-size="15" font-weight="bold" fill="#FF9800">LEVEL 3</text>
  <text x="516" y="190" font-family="monospace" font-size="17" fill="#F8FAFC">Automated Review Gates</text>
  <text x="516" y="210" font-family="monospace" font-size="12" fill="#94A3B8">Tests, linters, security</text>

  <!-- Level 4 -->
  <rect x="720" y="140" width="200" height="70" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="736" y="168" font-family="monospace" font-size="15" font-weight="bold" fill="#FF9800">LEVEL 4</text>
  <text x="736" y="190" font-family="monospace" font-size="17" fill="#F8FAFC">Mostly Autonomous</text>
  <text x="736" y="210" font-family="monospace" font-size="12" fill="#94A3B8">Escalates to human at limits</text>

  <!-- Level 5 -->
  <rect x="940" y="140" width="200" height="70" rx="8" fill="#018786" stroke="#FF9800" stroke-width="2.5"/>
  <text x="956" y="168" font-family="monospace" font-size="15" font-weight="bold" fill="#FF9800">LEVEL 5</text>
  <text x="956" y="190" font-family="monospace" font-size="17" fill="#F8FAFC">FULL DARK FACTORY</text>
  <text x="956" y="210" font-family="monospace" font-size="12" fill="#0F172A">Nobody reviews changes</text>

  <!-- Staircase arrows -->
  <polyline points="260,175 280,175 280,155 500,155" fill="none" stroke="#018786" stroke-width="2"/>
  <polyline points="480,175 500,175 500,155 720,155" fill="none" stroke="#018786" stroke-width="2"/>
  <polyline points="700,175 720,175 720,155 940,155" fill="none" stroke="#018786" stroke-width="2"/>
  <text x="600" y="130" text-anchor="middle" font-family="monospace" font-size="14" fill="#018786">▲ more autonomy → less human review</text>

  <!-- Governance strip -->
  <rect x="60" y="260" width="1080" height="130" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="295" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">PROGRESSIVE AUTONOMY</text>
  <text x="80" y="322" font-family="monospace" font-size="14" fill="#94A3B8">Start with narrow, low-risk permissions...</text>
  <text x="80" y="346" font-family="monospace" font-size="14" fill="#94A3B8">...expand only after the system proves it handles that scope.</text>
  <text x="80" y="375" font-family="monospace" font-size="14" fill="#018786">Production write permissions are the LAST level, not the first.</text>

  <!-- Risk note -->
  <rect x="60" y="410" width="1080" height="90" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="1.5"/>
  <text x="80" y="445" font-family="monospace" font-size="16" font-weight="bold" fill="#FF9800">⚠ LEVEL 5: POSSIBLE TODAY ONLY IN SCOPED SPACES</text>
  <text x="80" y="472" font-family="monospace" font-size="13" fill="#94A3B8">Genuinely risky for user data, production infrastructure or novel business logic.</text>

  <text x="600" y="585" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748B">ARCEAPPS · DARK FACTORY · 2026</text>
</svg>
