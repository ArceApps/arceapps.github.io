<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid3)" opacity="0.5"/>

  <text x="60" y="62" font-family="monospace" font-size="30" font-weight="bold" fill="#F8FAFC">ACDD CYCLE · 5 ENFORCED PHASES</text>
  <text x="60" y="92" font-family="monospace" font-size="16" fill="#94A3B8">Acceptance criteria FIRST → tests SECOND → code LAST</text>

  <!-- Phase 1: Discovery -->
  <rect x="60" y="140" width="196" height="150" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <circle cx="96" cy="176" r="14" fill="#018786"/>
  <text x="96" y="181" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">1</text>
  <text x="120" y="182" font-family="monospace" font-size="15" font-weight="bold" fill="#F8FAFC">Discovery</text>
  <text x="80" y="208" font-family="monospace" font-size="12" fill="#94A3B8">Example Mapping:</text>
  <text x="80" y="226" font-family="monospace" font-size="11" fill="#94A3B8">rules · examples · questions</text>
  <text x="80" y="244" font-family="monospace" font-size="11" fill="#94A3B8">· assumptions</text>
  <text x="80" y="272" font-family="monospace" font-size="11" fill="#FF9800">exit: questions answered</text>

  <!-- Phase 2: Specification -->
  <rect x="286" y="140" width="196" height="150" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <circle cx="322" cy="176" r="14" fill="#018786"/>
  <text x="322" y="181" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">2</text>
  <text x="346" y="182" font-family="monospace" font-size="15" font-weight="bold" fill="#F8FAFC">Specification</text>
  <text x="306" y="208" font-family="monospace" font-size="12" fill="#94A3B8">Gherkin Given/When/Then</text>
  <text x="306" y="226" font-family="monospace" font-size="11" fill="#94A3B8">user story + scenarios</text>
  <text x="306" y="244" font-family="monospace" font-size="11" fill="#94A3B8">+ tags + validated syntax</text>
  <text x="306" y="272" font-family="monospace" font-size="11" fill="#FF9800">exit: valid scenarios</text>

  <!-- Phase 3: Testing TDD Red -->
  <rect x="512" y="140" width="196" height="150" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <circle cx="548" cy="176" r="14" fill="#018786"/>
  <text x="548" y="181" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">3</text>
  <text x="572" y="182" font-family="monospace" font-size="15" font-weight="bold" fill="#F8FAFC">Testing · RED</text>
  <text x="532" y="208" font-family="monospace" font-size="12" fill="#94A3B8">tests that FAIL</text>
  <text x="532" y="226" font-family="monospace" font-size="11" fill="#94A3B8">prove they work</text>
  <text x="532" y="244" font-family="monospace" font-size="11" fill="#94A3B8">coverage linked to scenarios</text>
  <text x="532" y="272" font-family="monospace" font-size="11" fill="#FF9800">exit: red confirmed</text>

  <!-- Phase 4: Implementation TDD Green -->
  <rect x="738" y="140" width="196" height="150" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <circle cx="774" cy="176" r="14" fill="#018786"/>
  <text x="774" y="181" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">4</text>
  <text x="798" y="182" font-family="monospace" font-size="15" font-weight="bold" fill="#F8FAFC">Implement · GREEN</text>
  <text x="758" y="208" font-family="monospace" font-size="12" fill="#94A3B8">minimum code to</text>
  <text x="758" y="226" font-family="monospace" font-size="11" fill="#94A3B8">pass the tests</text>
  <text x="758" y="244" font-family="monospace" font-size="11" fill="#94A3B8">refactor while green</text>
  <text x="758" y="272" font-family="monospace" font-size="11" fill="#FF9800">exit: tests green</text>

  <!-- Phase 5: Validation -->
  <rect x="964" y="140" width="176" height="150" rx="10" fill="#018786" stroke="#FF9800" stroke-width="2.5"/>
  <circle cx="1000" cy="176" r="14" fill="#FF9800"/>
  <text x="1000" y="181" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#0F172A">5</text>
  <text x="1024" y="182" font-family="monospace" font-size="14" font-weight="bold" fill="#0F172A">Validation</text>
  <text x="984" y="208" font-family="monospace" font-size="11" fill="#0F172A">FULL suite</text>
  <text x="984" y="226" font-family="monospace" font-size="11" fill="#0F172A">not just new tests</text>
  <text x="984" y="244" font-family="monospace" font-size="11" fill="#0F172A">Gherkin + coverage + gates</text>
  <text x="984" y="272" font-family="monospace" font-size="11" fill="#0F172A">→ DONE</text>

  <!-- Arrows -->
  <line x1="256" y1="215" x2="281" y2="215" stroke="#FF9800" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="482" y1="215" x2="507" y2="215" stroke="#FF9800" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="708" y1="215" x2="733" y2="215" stroke="#FF9800" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="934" y1="215" x2="959" y2="215" stroke="#FF9800" stroke-width="3" marker-end="url(#a3)"/>

  <!-- Enforcement strip -->
  <rect x="60" y="330" width="1080" height="150" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="365" font-family="monospace" font-size="17" font-weight="bold" fill="#FF9800">MECHANICAL ENFORCEMENT (fspec)</text>
  <text x="80" y="395" font-family="monospace" font-size="13" fill="#94A3B8">✗ Blocked transitions — you can't skip phases</text>
  <text x="80" y="420" font-family="monospace" font-size="13" fill="#94A3B8">✗ Temporal ordering — file timestamps vs. state entry (anti-theater)</text>
  <text x="80" y="445" font-family="monospace" font-size="13" fill="#94A3B8">✗ Prefill detection — placeholders in Gherkin</text>
  <text x="80" y="470" font-family="monospace" font-size="13" fill="#94A3B8">✓ Auto checkpoints — rollback before every transition</text>

  <text x="600" y="585" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748B">ARCEAPPS · DARK FACTORY · 2026</text>
</svg>
