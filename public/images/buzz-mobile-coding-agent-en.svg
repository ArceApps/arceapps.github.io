<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-en" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="tealGrad-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#018786"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orangeGrad-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-en" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowOrange-en" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowTeal-en" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018786"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-en)" opacity="0.55"/>

  <!-- Top brand -->
  <text x="60" y="58" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="3">ARCEAPPS · BLOG · ENGINEERING</text>
  <text x="1140" y="58" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="2">2026 · #mobile-agentic</text>
  <line x1="60" y1="76" x2="1140" y2="76" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT COLUMN: before -->
  <rect x="60" y="120" width="500" height="370" rx="16" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="120" width="500" height="50" rx="16" fill="#1e293b"/>
  <rect x="60" y="150" width="500" height="20" fill="#1e293b"/>
  <text x="84" y="153" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#94a3b8">BEFORE · solo agents in harness tabs</text>

  <!-- Human box -->
  <rect x="100" y="200" width="120" height="70" rx="10" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="160" cy="232" r="14" fill="#94a3b8"/>
  <path d="M 138 268 Q 160 246 182 268" fill="#94a3b8"/>
  <text x="160" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">human</text>

  <!-- Slack box -->
  <rect x="260" y="200" width="120" height="70" rx="10" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#cbd5e1">Slack</text>
  <text x="320" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">paste context</text>

  <!-- Agent box -->
  <rect x="420" y="200" width="120" height="70" rx="10" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
  <circle cx="480" cy="232" r="14" fill="#64748b"/>
  <text x="480" y="284" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#cbd5e1">agent</text>

  <line x1="220" y1="235" x2="260" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-en)"/>
  <line x1="380" y1="235" x2="420" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-en)"/>
  <line x1="420" y1="270" x2="380" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-en)"/>
  <line x1="260" y1="270" x2="220" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-en)"/>

  <!-- problem bullets -->
  <text x="100" y="320" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ copy / paste as middleware</text>
  <text x="100" y="345" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ bot borrows your credentials</text>
  <text x="100" y="370" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ no audit, no portable identity</text>
  <text x="100" y="395" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ context dies between handoffs</text>
  <text x="100" y="420" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ mobile clients are remote control</text>

  <text x="84" y="475" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">individuals got faster · teams got slower</text>

  <!-- VS divider -->
  <text x="600" y="310" font-family="ui-monospace, monospace" font-size="48" font-weight="900" fill="#FF9800" text-anchor="middle" filter="url(#glow-en)">vs</text>

  <!-- RIGHT COLUMN: buzz -->
  <rect x="640" y="120" width="500" height="370" rx="16" fill="#0b1220" stroke="#018786" stroke-width="2"/>
  <rect x="640" y="120" width="500" height="50" rx="16" fill="#018786"/>
  <rect x="640" y="150" width="500" height="20" fill="#018786"/>
  <text x="664" y="153" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#0F172A">BUZZ · humans + agents, same room</text>

  <!-- Central relay -->
  <circle cx="890" cy="265" r="62" fill="#0F172A" stroke="#018786" stroke-width="3"/>
  <text x="890" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#018786">NOSTR</text>
  <text x="890" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#34d399">RELAY</text>
  <text x="890" y="298" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">signed events</text>

  <!-- Human node (left) -->
  <circle cx="710" cy="220" r="22" fill="#34d399"/>
  <text x="710" y="226" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">👤</text>
  <text x="710" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">human (mobile)</text>

  <!-- Agent 1 (top) -->
  <circle cx="820" cy="180" r="22" fill="#FF9800"/>
  <text x="820" y="186" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="820" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">goose</text>

  <!-- Agent 2 (right) -->
  <circle cx="990" cy="200" r="22" fill="#FF9800"/>
  <text x="990" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="990" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">codex</text>

  <!-- Agent 3 (bottom) -->
  <circle cx="1000" cy="320" r="22" fill="#FF9800"/>
  <text x="1000" y="326" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="1000" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">claude code</text>

  <!-- Agent 4 (bottom-left) -->
  <circle cx="780" cy="350" r="22" fill="#FF9800"/>
  <text x="780" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="780" y="388" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">mobile review</text>

  <!-- Connecting lines -->
  <line x1="730" y1="222" x2="828" y2="265" stroke="#018786" stroke-width="2" marker-end="url(#arrowTeal-en)"/>
  <line x1="838" y1="190" x2="858" y2="220" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-en)"/>
  <line x1="975" y1="215" x2="922" y2="248" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-en)"/>
  <line x1="985" y1="310" x2="935" y2="305" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-en)"/>
  <line x1="800" y1="345" x2="850" y2="305" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-en)"/>

  <!-- win bullets -->
  <text x="664" y="420" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ shared cryptographic identity</text>
  <text x="664" y="445" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ mobile = full peer, not remote ctrl</text>
  <text x="664" y="470" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ one audit log: chat, code, CI, merge</text>

  <!-- Bottom hero text -->
  <text x="60" y="548" font-family="ui-monospace, monospace" font-size="38" font-weight="900" fill="#f8fafc" filter="url(#glow-en)">Buzz · Mobile Coding Agent</text>
  <text x="60" y="586" font-family="ui-monospace, monospace" font-size="18" fill="#cbd5e1">Block's Nostr-backed workspace where humans, agents, repos and decisions share one signed room.</text>
  <text x="60" y="610" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">buzz.xyz · github.com/block/buzz · engineering.block.xyz/blog/buzz · Apache 2.0</text>

  <!-- Bee mark -->
  <text x="1140" y="606" font-family="ui-monospace, monospace" font-size="32" text-anchor="end">🐝</text>
</svg>
