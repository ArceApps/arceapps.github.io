<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-if2-en" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-if2-en)" opacity="0.3"/>

  <text x="60" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" letter-spacing="2">FIGURE 2 · THREE-TIER EVAL FRAMEWORK</text>
  <text x="60" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#e2e8f0" font-weight="700">How the repo proves its skills actually work</text>

  <g transform="translate(150,150)">
    <rect x="0" y="0" width="900" height="120" fill="#1e293b" stroke="#018786" stroke-width="2" rx="8"/>
    <rect x="0" y="0" width="8" height="120" fill="#018786"/>
    <text x="30" y="35" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">TIER 1 · STRUCTURAL</text>
    <text x="30" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Static audit of every SKILL.md. Checks frontmatter, mandatory sections</text>
    <text x="30" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">(Overview, When to Use, Process, Rationalizations, Red Flags, Verification), that</text>
    <text x="30" y="96" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Rationalizations have substance, and descriptions are concrete.</text>
    <text x="860" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">✓ in CI</text>
    <text x="860" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">deterministic</text>

    <rect x="60" y="160" width="780" height="120" fill="#1e293b" stroke="#018786" stroke-width="2" rx="8"/>
    <rect x="60" y="160" width="8" height="120" fill="#018786"/>
    <text x="90" y="195" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">TIER 2 · ROUTING</text>
    <text x="90" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Skill descriptions carry the vocabulary users actually use, and no two skills</text>
    <text x="90" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">collide on routing. If descriptions overlap, the router fails — avoids the classic</text>
    <text x="90" y="256" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">"I asked for X and got Y" bug.</text>
    <text x="820" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">✓ in CI</text>
    <text x="820" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">deterministic</text>

    <rect x="120" y="320" width="660" height="120" fill="#1e293b" stroke="#FF9800" stroke-width="2" rx="8"/>
    <rect x="120" y="320" width="8" height="120" fill="#FF9800"/>
    <text x="150" y="355" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#FF9800" font-weight="700">TIER 3 · BEHAVIORAL</text>
    <text x="150" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">Runs a real agent against per-skill scenarios. Compares the output against</text>
    <text x="150" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">per-skill expectations. Fails when an updated model "rationalizes" skipping a</text>
    <text x="150" y="416" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#cbd5e1">step. Automated, reproducible pressure-testing.</text>
    <text x="760" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">expensive</text>
    <text x="760" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="end">real trace</text>
  </g>

  <g transform="translate(150,490)">
    <text font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">OUTCOME</text>
    <text x="0" y="22" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">If any of the 3 tiers fails, CI breaks. Eval failures are bugs to be fixed before</text>
    <text x="0" y="42" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#018786" font-weight="700">merging the PR. Measurable discipline, not declared discipline.</text>
  </g>

  <text x="1140" y="585" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#475569" text-anchor="end">ARCEAPPS · 2026</text>
</svg>
