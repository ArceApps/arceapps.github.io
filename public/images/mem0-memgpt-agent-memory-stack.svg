    <text x="24" y="62" fill="#E2E8F0" font-family="ui-sans-serif,Inter,system-ui" font-size="13" opacity="0.85">Extractor y deduplicación</text>
    <text x="24" y="62" fill="#E2E8F0" font-family="ui-sans-serif,Inter,system-ui" font-size="13" opacity="0">Extractor</text>
  </g>

  <g transform="translate(460,90)">
