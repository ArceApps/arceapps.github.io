    <text x="24" y="38" fill="#1E293B" font-family="ui-sans-serif,Inter,system-ui" font-size="16" font-weight="700" letter-spacing="3">CHROMA · LanceDB</text>
    <text x="24" y="62" fill="#0F172A" font-family="ui-sans-serif,Inter,system-ui" font-size="13" opacity="0.85">Vector store</text>
    <text x="24" y="62" fill="#0F172A" font-family="ui-sans-serif,Inter,system-ui" font-size="13" opacity="0">Vector store</text>
  </g>

  <g stroke="#018786" stroke-width="2" fill="none">
