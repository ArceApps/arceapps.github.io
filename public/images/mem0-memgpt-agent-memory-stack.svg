    <text x="0" y="44" fill="#F1F5F9" font-family="ui-sans-serif,Inter,system-ui" font-size="34" font-weight="800">en cuatro pilares.</text>
    <text x="0" y="80" fill="#94A3B8" font-family="ui-sans-serif,Inter,system-ui" font-size="16">ArceApps · Stack accionable, código verificado, sin vendor lock-in.</text>
