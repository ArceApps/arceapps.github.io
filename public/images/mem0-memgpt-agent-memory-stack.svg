    <text x="24" y="62" fill="#94A3B8" font-family="ui-sans-serif,Inter,system-ui" font-size="13">Jerarquía virtual</text>
  </g>

  <g transform="translate(460,250)">
    <rect x="0" y="0" width="280" height="80" rx="12" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
    <text x="24" y="38" fill="#F1F5F9" font-family="ui-sans-serif,Inter,system-ui" font-size="16" font-weight="700" letter-spacing="3">PARA</text>
    <text x="24" y="62" fill="#94A3B8" font-family="ui-sans-serif,Inter,system-ui" font-size="13">Ontología legible</text>
