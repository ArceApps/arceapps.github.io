<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Memory consolidation pipeline: write chunk embed store retrieve update consolidate">
  <defs>
    <linearGradient id="bgLight3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bgLight3)"/>

  <g font-family="ui-sans-serif,Inter,system-ui">
    <text x="600" y="56" text-anchor="middle" fill="#0F172A" font-size="28" font-weight="800">Memory Consolidation Pipeline</text>
    <text x="600" y="86" text-anchor="middle" fill="#475569" font-size="14">Seven numbered steps with feedback into the agent</text>
  </g>

  <g transform="translate(60,180)" font-family="ui-sans-serif,Inter,system-ui">
    <g transform="translate(0,0)">
      <circle cx="60" cy="60" r="36" fill="#018786"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">1</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">write</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">capture</text>
    </g>
    <g transform="translate(170,0)">
      <circle cx="60" cy="60" r="36" fill="#018786"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">2</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">chunk</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">fragment</text>
    </g>
    <g transform="translate(340,0)">
      <circle cx="60" cy="60" r="36" fill="#014845"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">3</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">embed</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">vectors</text>
    </g>
    <g transform="translate(510,0)">
      <circle cx="60" cy="60" r="36" fill="#014845"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">4</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">store</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">persist</text>
    </g>
    <g transform="translate(680,0)">
      <circle cx="60" cy="60" r="36" fill="#FF9800"/>
      <text x="60" y="68" text-anchor="middle" fill="#0F172A" font-size="20" font-weight="800">5</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">retrieve</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">query</text>
    </g>
    <g transform="translate(850,0)">
      <circle cx="60" cy="60" r="36" fill="#F57C00"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">6</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">update</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">correct</text>
    </g>
    <g transform="translate(1020,0)">
      <circle cx="60" cy="60" r="36" fill="#B86A00"/>
      <text x="60" y="68" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">7</text>
      <text x="60" y="120" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="700">consolidate</text>
      <text x="60" y="138" text-anchor="middle" fill="#475569" font-size="11">summarize</text>
    </g>

    <g stroke="#0F172A" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)" opacity="0.5">
      <line x1="100" y1="60" x2="160" y2="60"/>
      <line x1="270" y1="60" x2="330" y2="60"/>
      <line x1="440" y1="60" x2="500" y2="60"/>
      <line x1="610" y1="60" x2="670" y2="60"/>
      <line x1="780" y1="60" x2="840" y2="60"/>
      <line x1="950" y1="60" x2="1010" y2="60"/>
    </g>
  </g>

  <g transform="translate(60,380)">
    <rect width="1080" height="120" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" opacity="0.95"/>
    <text x="32" y="44" fill="#0F172A" font-family="ui-sans-serif,Inter,system-ui" font-size="16" font-weight="700">Real-time agent</text>
    <text x="32" y="74" fill="#475569" font-family="ui-sans-serif,Inter,system-ui" font-size="13">Inject relevant memories before the prompt · add new facts after the response</text>
    <text x="32" y="100" fill="#018786" font-family="ui-monospace,Menlo,monospace" font-size="12">mem0.search(query, user_id)  →  prompt  →  mem0.add(messages, user_id)</text>
  </g>

  <g stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6 6" fill="none">
    <path d="M 1140 240 L 1140 380"/>
    <path d="M 60 240 L 60 380"/>
  </g>

  <g transform="translate(600,560)" font-family="ui-sans-serif,Inter,system-ui" text-anchor="middle">
    <rect x="-260" y="0" width="520" height="40" rx="20" fill="#0F172A"/>
    <text x="0" y="26" fill="#F1F5F9" font-size="14" font-weight="600">Consolidation runs outside the loop (cron, /sleeptime)</text>
  </g>
</svg>
