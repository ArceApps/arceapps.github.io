<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">THREE LAYERS OF CONTEXT</title><desc id="desc">L0 discovers, L1 navigates and L2 verifies original evidence.</desc><rect width="1200" height="720" fill="#0F172A"/><text x="62" y="92" fill="#FF9800" font-family="Arial,sans-serif" font-size="23" letter-spacing="4">OPENVIKING · ARCEAPPS</text><text x="62" y="164" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="47" font-weight="800">THREE LAYERS OF CONTEXT</text><rect x="60" y="237" width="350" height="264" rx="19" fill="#183B46" stroke="#018786" stroke-width="3"/><text x="83" y="296" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="30" font-weight="800">DISCOVER</text><text x="83" y="361" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="25" font-weight="700">L0 · 256 characters</text><text x="83" y="408" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="19">Short directory abstract</text><text x="83" y="463" fill="#F8FAFC" opacity=".74" font-family="monospace" font-size="22">.abstract.md</text><rect x="444" y="237" width="350" height="264" rx="19" fill="#183B46" stroke="#018786" stroke-width="3"/><text x="467" y="296" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="30" font-weight="800">EXPLORE</text><text x="467" y="361" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="25" font-weight="700">L1 · 4,000 characters</text><text x="467" y="408" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="19">Content map and navigation</text><text x="467" y="463" fill="#F8FAFC" opacity=".74" font-family="monospace" font-size="22">.overview.md</text><rect x="828" y="237" width="350" height="264" rx="19" fill="#FF9800" stroke="#018786" stroke-width="3"/><text x="851" y="296" fill="#0F172A" font-family="Arial,sans-serif" font-size="30" font-weight="800">VERIFY</text><text x="851" y="361" fill="#0F172A" font-family="Arial,sans-serif" font-size="25" font-weight="700">L2 · original sources</text><text x="851" y="408" fill="#0F172A" font-family="Arial,sans-serif" font-size="19">Read primary evidence</text><text x="851" y="463" fill="#0F172A" opacity=".74" font-family="monospace" font-size="22">file.md</text><path d="M410 367H439 M793 367H824" stroke="#FF9800" stroke-width="7" stroke-linecap="round"/><rect x="60" y="554" width="1082" height="85" rx="15" fill="#018786" opacity=".92"/><text x="83" y="610" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="23">Rule: do not mistake a summary for primary evidence.</text><text x="62" y="683" fill="#CBD5E1" font-size="18" font-family="Arial,sans-serif">SOURCE: docs.openviking.ai/en/concepts/03-context-layers</text></svg>