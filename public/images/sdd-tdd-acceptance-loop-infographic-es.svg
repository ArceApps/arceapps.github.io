<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Infografía SDD y TDD de principio a fin"><rect width="1200" height="630" fill="#eff7f3"/><text x="40" y="72" font-size="42" fill="#123c44" font-family="Arial,sans-serif">SDD + TDD: una feature de principio a fin</text><text x="42" y="125" font-size="22" fill="#018786" font-family="Arial,sans-serif">Intención → prueba → implementación → evidencia</text><path d="M40 163H1155" stroke="#FF9800" stroke-width="5"/><rect x="35" y="201" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="70" cy="238" r="25" fill="#d7f5e8"/><text x="57" y="247" font-size="23" fill="#018786" font-family="Arial,sans-serif">01</text><text x="48" y="291" font-size="17" fill="#173941" font-family="Arial,sans-serif">ESPECIFICAR</text><text x="51" y="346" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Intención</text><text x="51" y="400" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Límites y riesgos</text><text x="51" y="454" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Criterios observables</text><rect x="268" y="201" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="303" cy="238" r="25" fill="#fee2e2"/><text x="290" y="247" font-size="23" fill="#c2413b" font-family="Arial,sans-serif">02</text><text x="281" y="291" font-size="17" fill="#173941" font-family="Arial,sans-serif">TEST ROJO</text><text x="284" y="346" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Fallo reproducible</text><text x="284" y="400" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Primero el caso límite</text><text x="284" y="454" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Sin código previo</text><rect x="501" y="201" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="536" cy="238" r="25" fill="#d7f5e8"/><text x="523" y="247" font-size="23" fill="#018786" font-family="Arial,sans-serif">03</text><text x="514" y="291" font-size="17" fill="#173941" font-family="Arial,sans-serif">IMPLEMENTAR</text><text x="517" y="346" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Cambio mínimo</text><text x="517" y="400" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Fuera de alcance: no</text><text x="517" y="454" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Revisar el diff</text><rect x="734" y="201" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="769" cy="238" r="25" fill="#d7f5e8"/><text x="756" y="247" font-size="23" fill="#018786" font-family="Arial,sans-serif">04</text><text x="747" y="291" font-size="17" fill="#173941" font-family="Arial,sans-serif">REFACTORIZAR</text><text x="750" y="346" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Pruebas verdes</text><text x="750" y="400" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Eliminar duplicación</text><text x="750" y="454" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Mantener contrato</text><rect x="967" y="201" width="215" height="306" rx="17" fill="#fff" stroke="#a9d8c8" stroke-width="2"/><circle cx="1002" cy="238" r="25" fill="#d7f5e8"/><text x="989" y="247" font-size="23" fill="#018786" font-family="Arial,sans-serif">05</text><text x="980" y="291" font-size="17" fill="#173941" font-family="Arial,sans-serif">VERIFICAR</text><text x="983" y="346" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• CI automatizada</text><text x="983" y="400" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• UX y seguridad</text><text x="983" y="454" font-size="16" fill="#43625f" font-family="Arial,sans-serif">• Definition of Done</text><text x="45" y="551" font-size="20" fill="#365d58" font-family="Arial,sans-serif">El rigor se escala al riesgo: una feature pequeña no necesita diez documentos.</text><path d="M40 579H1156" stroke="#018786" stroke-width="2"/><text x="43" y="608" font-size="16" fill="#47665d" font-family="Arial,sans-serif">ARCEAPPS · GUÍA PRÁCTICA · OCTUBRE 2026</text></svg>