<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-or" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="60" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#F8FAFC">How model routing works</text>
  <text x="60" y="88" font-family="ui-monospace, monospace" font-size="14" fill="#94A3B8">Each prompt → classification → complexity estimate → cheapest model that handles it</text>

  <!-- STEP 1 -->
  <rect x="60" y="130" width="200" height="100" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="160" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#018786">STEP 1</text>
  <text x="160" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#F8FAFC">PROMPT</text>
  <text x="160" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">"Find where X is</text>
  <text x="160" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">defined in the code"</text>

  <line x1="270" y1="180" x2="320" y2="180" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow-or)"/>

  <!-- STEP 2 -->
  <rect x="330" y="130" width="220" height="100" rx="8" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="440" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">STEP 2</text>
  <text x="440" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#F8FAFC">CLASSIFIER</text>
  <text x="440" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">6 dimensions</text>
  <text x="440" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">code, reasoning, search…</text>

  <line x1="560" y1="180" x2="610" y2="180" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow-or)"/>

  <!-- STEP 3 -->
  <rect x="620" y="130" width="220" height="100" rx="8" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="730" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">STEP 3</text>
  <text x="730" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#F8FAFC">ROUTER</text>
  <text x="730" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">cheap · mid · expensive</text>
  <text x="730" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">based on complexity</text>

  <line x1="850" y1="180" x2="900" y2="180" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow-or)"/>

  <!-- STEP 4 -->
  <rect x="910" y="130" width="220" height="100" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="1020" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#018786">STEP 4</text>
  <text x="1020" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#F8FAFC">MODEL</text>
  <text x="1020" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">qwen3.5-9b</text>
  <text x="1020" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">$0.10 / $0.40</text>

  <!-- 6 dimensions -->
  <rect x="60" y="280" width="540" height="320" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="80" y="310" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#F8FAFC">6 classification dimensions</text>
  <text x="80" y="330" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">The classifier scores each prompt along these axes</text>

  <g font-family="ui-monospace, monospace" font-size="12" fill="#F8FAFC">
    <rect x="80" y="350" width="240" height="36" rx="4" fill="#0F172A" stroke="#018786" stroke-width="1"/>
    <text x="92" y="372" font-weight="700" fill="#018786">1.</text>
    <text x="115" y="372">coding</text>
    <text x="240" y="372" font-size="10" fill="#94A3B8">code generation</text>

    <rect x="340" y="350" width="240" height="36" rx="4" fill="#0F172A" stroke="#018786" stroke-width="1"/>
    <text x="352" y="372" font-weight="700" fill="#018786">2.</text>
    <text x="375" y="372">creative synthesis</text>

    <rect x="80" y="395" width="240" height="36" rx="4" fill="#0F172A" stroke="#018786" stroke-width="1"/>
    <text x="92" y="417" font-weight="700" fill="#018786">3.</text>
    <text x="115" y="417">instruction following</text>

    <rect x="340" y="395" width="240" height="36" rx="4" fill="#0F172A" stroke="#018786" stroke-width="1"/>
    <text x="352" y="417" font-weight="700" fill="#018786">4.</text>
    <text x="375" y="417">math reasoning</text>

    <rect x="80" y="440" width="240" height="36" rx="4" fill="#0F172A" stroke="#FF9800" stroke-width="1.5"/>
    <text x="92" y="462" font-weight="700" fill="#FF9800">5.</text>
    <text x="115" y="462">planning / agentic</text>
    <text x="240" y="462" font-size="10" fill="#94A3B8">deep reasoning</text>

    <rect x="340" y="440" width="240" height="36" rx="4" fill="#0F172A" stroke="#018786" stroke-width="1"/>
    <text x="352" y="462" font-weight="700" fill="#018786">6.</text>
    <text x="375" y="462">world knowledge</text>
  </g>

  <text x="80" y="510" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">Complexity estimate:</text>
  <text x="240" y="510" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">easy · medium · hard</text>

  <text x="80" y="540" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">Fallback on ambiguity:</text>
  <text x="280" y="540" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94A3B8">&lt; 2% of cases</text>

  <text x="80" y="570" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">Classification cost:</text>
  <text x="240" y="570" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">~150ms latency</text>

  <!-- Output tiers -->
  <rect x="620" y="280" width="510" height="320" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="640" y="310" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#F8FAFC">Output by tier</text>
  <text x="640" y="330" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">The router sends each prompt to the cheapest backend that handles it</text>

  <rect x="640" y="350" width="470" height="65" rx="6" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <text x="660" y="375" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#018786">CHEAP TIER</text>
  <text x="660" y="395" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">search, formatting, summaries</text>
  <text x="660" y="410" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">qwen3.5-9b · $0.10/$0.40 · 60% of traffic</text>

  <rect x="640" y="425" width="470" height="65" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
  <text x="660" y="450" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#94A3B8">MID TIER</text>
  <text x="660" y="470" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">mid-size code, review, explanations</text>
  <text x="660" y="485" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">qwen3-coder-next · $0.50/$2.00 · 30% of traffic</text>

  <rect x="640" y="500" width="470" height="65" rx="6" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <text x="660" y="525" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FF9800">EXPENSIVE TIER</text>
  <text x="660" y="545" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">architecture, planning, deep reasoning</text>
  <text x="660" y="560" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">qwen3.5-122b · $1.00/$4.20 · 10% of traffic</text>

  <text x="60" y="615" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">ARCEAPPS · 2026 · Model Routing for Subagents</text>
</svg>
