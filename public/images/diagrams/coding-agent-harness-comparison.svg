<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Comparison of four coding agent extension philosophies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018786"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#grid)" opacity="0.4"/>

  <!-- Title -->
  <g transform="translate(60, 50)">
    <rect width="14" height="56" fill="#FF9800"/>
    <text x="30" y="28" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#FFFFFF">Four extension philosophies</text>
    <text x="30" y="50" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9CA3AF">how each agent lets you extend what the model can see and do</text>
  </g>

  <!-- Central model node -->
  <g transform="translate(600, 380)">
    <circle r="70" fill="#0B1220" stroke="#018786" stroke-width="3"/>
    <text text-anchor="middle" y="-2" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">MODEL</text>
    <text text-anchor="middle" y="18" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">the soul of agent</text>
  </g>

  <!-- TL: DeepSeek Harness -->
  <g transform="translate(180, 180)">
    <rect x="-150" y="-65" width="300" height="130" rx="14" fill="#0B1220" stroke="#018786" stroke-width="3"/>
    <text x="0" y="-36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#018786">DeepSeek Harness</text>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">MIT · v0.1.0-rc.5</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E5E7EB">
      <text x="-130" y="6">▸ apply(ctx: Context)</text>
      <text x="-130" y="24">▸ ctx.llm · tools · sandbox</text>
      <text x="-130" y="42">▸ session · subagents · ui · loop</text>
    </g>
    <text x="0" y="56" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">imperative · in-process · with state</text>
  </g>

  <!-- TR: Claude Code -->
  <g transform="translate(1020, 180)">
    <rect x="-150" y="-65" width="300" height="130" rx="14" fill="#0B1220" stroke="#FF9800" stroke-width="3"/>
    <text x="0" y="-36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#FF9800">Claude Code</text>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">source-available</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E5E7EB">
      <text x="-130" y="6">▸ CLAUDE.md + Skills</text>
      <text x="-130" y="24">▸ Subagents + Agent Teams</text>
      <text x="-130" y="42">▸ Hooks + MCP + Plugins</text>
    </g>
    <text x="0" y="56" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">7 surfaces · proprietary core</text>
  </g>

  <!-- BL: OpenCode -->
  <g transform="translate(180, 580)">
    <rect x="-150" y="-65" width="300" height="130" rx="14" fill="#0B1220" stroke="#018786" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="-36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#018786">OpenCode</text>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">MIT · Go · 197k stars</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E5E7EB">
      <text x="-130" y="6">▸ providers via config</text>
      <text x="-130" y="24">▸ anthropic · openai · ollama</text>
      <text x="-130" y="42">▸ NO plugin system</text>
    </g>
    <text x="0" y="56" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">model-agnostic by default</text>
  </g>

  <!-- BR: Codex CLI -->
  <g transform="translate(1020, 580)">
    <rect x="-150" y="-65" width="300" height="130" rx="14" fill="#0B1220" stroke="#9CA3AF" stroke-width="2"/>
    <text x="0" y="-36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">Codex CLI</text>
    <text x="0" y="-16" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">Apache 2.0 · Rust</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E5E7EB">
      <text x="-130" y="6">▸ folder = plugin</text>
      <text x="-130" y="24">▸ skill md · MCP · shell</text>
      <text x="-130" y="42">▸ never enters harness</text>
    </g>
    <text x="0" y="56" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#9CA3AF">declarative · kernel sandbox</text>
  </g>

  <!-- Connectors: all 4 wrap the model -->
  <g fill="none" stroke-width="2">
    <path d="M 330 195 L 540 320" stroke="#018786" stroke-width="3" marker-end="url(#arrowTeal)"/>
    <path d="M 870 195 L 660 320" stroke="#FF9800" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <path d="M 330 565 L 540 440" stroke="#018786" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowTeal)"/>
    <path d="M 870 565 L 660 440" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowGray)"/>
  </g>

  <!-- Side annotations -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">
    <text x="450" y="250" text-anchor="end">all extensions</text>
    <text x="450" y="266" text-anchor="end">live inside</text>
    <text x="450" y="282" text-anchor="end">harness process</text>

    <text x="750" y="250">extensions above</text>
    <text x="750" y="266">a closed core</text>

    <text x="450" y="490" text-anchor="end">model is the</text>
    <text x="450" y="506" text-anchor="end">extension point</text>

    <text x="750" y="490">extensions are</text>
    <text x="750" y="506">outside the</text>
    <text x="750" y="522">harness process</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 680)" font-family="ui-monospace, Menlo, monospace" font-size="11">
    <line x1="0" y1="7" x2="40" y2="7" stroke="#018786" stroke-width="3"/>
    <text x="50" y="11" fill="#FFFFFF">MIT + open</text>
    <line x1="160" y1="7" x2="200" y2="7" stroke="#FF9800" stroke-width="3"/>
    <text x="210" y="11" fill="#FFFFFF">commercial + open surface</text>
    <line x1="400" y1="7" x2="440" y2="7" stroke="#9CA3AF" stroke-width="2"/>
    <text x="450" y="11" fill="#FFFFFF">Apache 2.0</text>
    <line x1="560" y1="7" x2="600" y2="7" stroke="#018786" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="610" y="11" fill="#FFFFFF">no plugin system (config only)</text>
  </g>

  <!-- footer -->
  <g transform="translate(60, 706)" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6B7280">
    <text>ARCEAPPS · 2026 · four philosophies, four answers to "how do I extend this"</text>
  </g>
</svg>
