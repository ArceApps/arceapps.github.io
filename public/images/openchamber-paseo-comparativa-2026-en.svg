<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="OpenChamber, Paseo, CodeNomad, opencode-mobile comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top brand mark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94A3B8">
    <text x="60" y="55" letter-spacing="0.15em">ARCEAPPS · COMPARISON</text>
    <text x="60" y="75" fill="#018786" font-size="12">2026-08</text>
  </g>

  <!-- Central composition: 4 nodes representing the products -->
  <g transform="translate(600 280)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FF9800" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#018786" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

    <!-- Core: AI AGENT -->
    <circle cx="0" cy="0" r="68" fill="#0F172A" stroke="#018786" stroke-width="2"/>
    <text x="0" y="-6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#018786" font-weight="bold">AI AGENT</text>
    <text x="0" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">core</text>

    <!-- 4 product nodes -->
    <!-- Top: OpenChamber -->
    <g transform="translate(0 -180)">
      <circle cx="0" cy="0" r="52" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0F172A" font-weight="bold">OpenChamber</text>
      <text x="0" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#0F172A">8.7k ★</text>
    </g>
    <!-- Right: Paseo -->
    <g transform="translate(180 0)">
      <circle cx="0" cy="0" r="52" fill="#FF9800" filter="url(#glow)"/>
      <text x="0" y="-2" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#0F172A" font-weight="bold">Paseo</text>
      <text x="0" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#0F172A">13.7k ★</text>
      <text x="0" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#0F172A">multi-provider</text>
    </g>
    <!-- Bottom: CodeNomad -->
    <g transform="translate(0 180)">
      <circle cx="0" cy="0" r="52" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#0F172A" font-weight="bold">CodeNomad</text>
      <text x="0" y="22" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#0F172A">2.5k ★</text>
    </g>
    <!-- Left: opencode-mobile -->
    <g transform="translate(-180 0)">
      <circle cx="0" cy="0" r="52" fill="#FF9800" filter="url(#glow)"/>
      <text x="0" y="-2" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0F172A" font-weight="bold">opencode</text>
      <text x="0" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0F172A" font-weight="bold">mobile</text>
      <text x="0" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#0F172A">104 ★</text>
    </g>

    <!-- Connecting lines (agent <-> each product) -->
    <line x1="0" y1="-180" x2="0" y2="0" stroke="#018786" stroke-width="1" opacity="0.6"/>
    <line x1="180" y1="0" x2="0" y2="0" stroke="#FF9800" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="180" x2="0" y2="0" stroke="#018786" stroke-width="1" opacity="0.6"/>
    <line x1="-180" y1="0" x2="0" y2="0" stroke="#FF9800" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Heading -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="600" y="100" font-size="34" fill="#F8FAFC" font-weight="bold">OpenChamber · Paseo · CodeNomad · opencode-mobile</text>
    <text x="600" y="138" font-size="20" fill="#FF9800">operational comparison of coding agent frontends</text>
    <text x="600" y="166" font-size="14" fill="#94A3B8">which one do I install today? primary data + HN thread</text>
  </g>

  <!-- Bottom legend -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">
    <rect x="60" y="555" width="14" height="14" fill="#018786"/>
    <text x="82" y="567">OpenCode frontend</text>
    <rect x="290" y="555" width="14" height="14" fill="#FF9800"/>
    <text x="312" y="567">multi-provider orchestrator</text>

    <text x="60" y="595" fill="#64748B">EN · 6,228 words · 4 products · 4 scenarios · 1 verdict</text>
    <text x="1140" y="595" text-anchor="end" fill="#64748B">arceapps.com</text>
  </g>
</svg>
