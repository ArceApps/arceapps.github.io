  <text x="990" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">codex</text>

  <circle cx="1000" cy="320" r="22" fill="#FF9800"/>
  <text x="1000" y="326" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="1000" y="358" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">claude code</text>

  <circle cx="780" cy="350" r="22" fill="#FF9800"/>
  <text x="780" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">🤖</text>
  <text x="780" y="388" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#cbd5e1">review móvil</text>

  <line x1="730" y1="222" x2="828" y2="265" stroke="#018786" stroke-width="2" marker-end="url(#arrowTeal-es)"/>
  <line x1="838" y1="190" x2="858" y2="220" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-es)"/>
  <line x1="975" y1="215" x2="922" y2="248" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-es)"/>
  <line x1="985" y1="310" x2="935" y2="305" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-es)"/>
  <line x1="800" y1="345" x2="850" y2="305" stroke="#FF9800" stroke-width="2" marker-end="url(#arrowOrange-es)"/>

  <text x="664" y="420" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ identidad criptográfica compartida</text>
  <text x="664" y="445" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ móvil = par completo, no control remoto</text>
  <text x="664" y="470" font-family="ui-monospace, monospace" font-size="13" fill="#34d399">✓ un log: chat, código, CI, merge firmado</text>

  <text x="60" y="548" font-family="ui-monospace, monospace" font-size="38" font-weight="900" fill="#f8fafc" filter="url(#glow-es)">Buzz · Mobile Coding Agent</text>
  <text x="60" y="586" font-family="ui-monospace, monospace" font-size="18" fill="#cbd5e1">El workspace de Block sobre Nostr donde humanos, agentes, repos y decisiones comparten un mismo cuarto firmado.</text>
  <text x="60" y="610" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">buzz.xyz · github.com/block/buzz · engineering.block.xyz/blog/buzz · Apache 2.0</text>

