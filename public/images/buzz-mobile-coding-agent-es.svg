  <line x1="420" y1="270" x2="380" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-es)"/>
  <line x1="260" y1="270" x2="220" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrowTeal-es)"/>

  <text x="100" y="320" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ copiar y pegar como middleware</text>
  <text x="100" y="345" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ el bot toma tus credenciales</text>
  <text x="100" y="370" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ sin auditoría, sin identidad portable</text>
  <text x="100" y="395" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ el contexto muere entre handoffs</text>
  <text x="100" y="420" font-family="ui-monospace, monospace" font-size="13" fill="#ef4444">✗ móvil = control remoto frágil</text>

  <text x="84" y="475" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">los individuos fueron más rápidos · los equipos más lentos</text>

  <text x="600" y="310" font-family="ui-monospace, monospace" font-size="48" font-weight="900" fill="#FF9800" text-anchor="middle" filter="url(#glow-es)">vs</text>

