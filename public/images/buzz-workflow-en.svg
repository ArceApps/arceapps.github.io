<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-wf-en" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-wf-en" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-wf-en" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-wf-purple-en" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-wf-en)" opacity="0.55"/>

  <text x="60" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="3">A FEATURE BRANCH BECOMES A ROOM · THE MOBILE-FIRST RELEASE PIPELINE</text>
  <text x="1140" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="2">INFOGRAPHIC 04 / 04</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- Pipeline track -->
  <rect x="50" y="120" width="1100" height="170" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <!-- Phase 1: Open channel -->
  <rect x="70" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <rect x="70" y="150" width="180" height="34" rx="12" fill="#018786"/>
  <text x="160" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">PHASE 1 · @human</text>
  <text x="160" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Open a channel</text>
  <text x="160" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Short-lived room per</text>
  <text x="160" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">feature or bug. NIP-34</text>
  <text x="160" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">events for patches.</text>
  <text x="160" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">mobile: create + invite agents</text>

  <!-- Gate 1 -->
  <rect x="266" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="291" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="291" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">scope</text>
  <text x="291" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">ok?</text>

  <!-- Phase 2: Plan -->
  <rect x="332" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="332" y="150" width="180" height="34" rx="12" fill="#FF9800"/>
  <text x="422" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">PHASE 2 · @claude-code</text>
  <text x="422" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Plan + delegate</text>
  <text x="422" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Frontier agent drafts</text>
  <text x="422" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">a plan and recruits</text>
  <text x="422" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">cheaper workers.</text>
  <text x="422" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">buzz-acp speaks ACP to MCP</text>

  <!-- Gate 2 -->
  <rect x="528" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="553" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="553" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">plan</text>
  <text x="553" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">ok?</text>

  <!-- Phase 3: Swarm build -->
  <rect x="594" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="594" y="150" width="180" height="34" rx="12" fill="#FF9800"/>
  <text x="684" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">PHASE 3 · @swarm</text>
  <text x="684" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Build + test</text>
  <text x="684" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Parallel agents in</text>
  <text x="684" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">side-channels post</text>
  <text x="684" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">patches + CI events.</text>
  <text x="684" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">cheaper models handle the bulk</text>

  <!-- Gate 3 -->
  <rect x="790" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="815" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="815" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">tests</text>
  <text x="815" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">green?</text>

  <!-- Phase 4: Review -->
  <rect x="856" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#34d399" stroke-width="2"/>
  <rect x="856" y="150" width="180" height="34" rx="12" fill="#34d399"/>
  <text x="946" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">PHASE 4 · @reviewer</text>
  <text x="946" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Review + merge</text>
  <text x="946" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Human approves</text>
  <text x="946" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">from phone; merge</text>
  <text x="946" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">is signed event.</text>
  <text x="946" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">👍 reaction counts as approval</text>

  <!-- Final: signed merge -->
  <circle cx="1090" cy="210" r="26" fill="#34d399"/>
  <text x="1090" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20">✓</text>
  <text x="1090" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">signed merge</text>

  <!-- Arrows -->
  <line x1="252" y1="210" x2="262" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="318" y1="210" x2="328" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="514" y1="210" x2="524" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="580" y1="210" x2="590" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="776" y1="210" x2="786" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="842" y1="210" x2="852" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-en)"/>
  <line x1="1038" y1="210" x2="1064" y2="210" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow-wf-purple-en)"/>

  <!-- Bottom split panels -->
  <!-- Left: key config -->
  <rect x="60" y="335" width="540" height="200" rx="14" fill="#0b1220" stroke="#018786" stroke-width="1.5"/>
  <text x="80" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#34d399">⚙️  Key configuration knobs</text>
  <text x="80" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">A minimal .env gets you running locally:</text>
  <text x="80" y="416" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">DATABASE_URL=postgres://buzz:buzz@localhost/buzz</text>
  <text x="80" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">REDIS_URL=redis://localhost:6379</text>
  <text x="80" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">S3_ENDPOINT=http://localhost:9000  S3_BUCKET=buzz</text>
  <text x="80" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">BUZZ_PRIVATE_KEY=<agent-nsec>  BUZZ_RELAY_URL=ws://localhost:3000</text>
  <text x="80" y="490" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Agent CLI is JSON-in / JSON-out:</text>
  <text x="80" y="510" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">buzz-cli post --channel "<id>" --body "tests green ✅"</text>

  <!-- Right: feedback loop -->
  <rect x="615" y="335" width="525" height="200" rx="14" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="635" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFB74D">🌀  Feedback loops that survive the laptop lid</text>
  <text x="635" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">The channel is the record. Six months later:</text>
  <text x="635" y="416" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• search returns the rejected fix and the reason</text>
  <text x="635" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• agent triage replays threads with receipts</text>
  <text x="635" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• mobile notifications fire via NIP-PL split routing</text>
  <text x="635" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• on-call human pages the last shipper</text>
  <text x="635" y="490" font-family="ui-monospace, monospace" font-size="11" fill="#FFB74D">Failure paths are durable. The room is intelligence.</text>

  <text x="60" y="612" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">Source: github.com/block/buzz/README.md · engineering.block.xyz/blog/buzz § Honey I saved the context · buzz-cli: crates/buzz-cli (JSON-in/JSON-out for LLMs)</text>
</svg>
