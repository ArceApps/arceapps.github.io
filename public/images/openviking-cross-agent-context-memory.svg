<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">OpenViking context database</title><desc id="desc">One navigable context filesystem linking resources, memories and skills with L0/L1/L2 layers.</desc><rect width="1200" height="630" fill="#0F172A"/><circle cx="1020" cy="125" r="232" fill="#018786" opacity=".12"/><path d="M0 510H1200 M0 560H1200 M140 0V630 M280 0V630 M420 0V630 M560 0V630" stroke="#018786" opacity=".12"/><text x="75" y="104" font-size="24" letter-spacing="5" fill="#FF9800" font-family="Arial,sans-serif" font-weight="700">AGENT CONTEXT / 2026</text><text x="75" y="202" font-size="86" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="800">OPENVIKING</text><text x="77" y="253" font-size="28" fill="#CBD5E1" font-family="Arial,sans-serif">One filesystem for agents to remember</text><rect x="77" y="320" width="555" height="215" rx="19" fill="#193344" stroke="#018786" stroke-width="3"/><text x="108" y="363" font-size="31" fill="#FF9800" font-family="monospace">viking://</text><g fill="#F8FAFC" font-family="monospace" font-size="29"><text x="147" y="413">├── resources/</text><text x="147" y="457">├── memories/</text><text x="147" y="501">└── skills/</text></g><g stroke="#018786" stroke-width="7" fill="none"><path d="M702 421H794 M824 336V509 M824 336H882 M824 421H882 M824 509H882"/></g><g font-family="Arial,sans-serif" font-weight="700"><rect x="890" y="306" width="241" height="66" rx="16" fill="#018786"/><text x="922" y="348" font-size="29" fill="#F8FAFC">L0 · ABSTRACT</text><rect x="890" y="392" width="241" height="66" rx="16" fill="#187C84"/><text x="920" y="434" font-size="29" fill="#F8FAFC">L1 · OVERVIEW</text><rect x="890" y="478" width="241" height="66" rx="16" fill="#FF9800"/><text x="923" y="520" font-size="29" fill="#0F172A">L2 · SOURCE</text></g><text x="78" y="592" font-size="20" fill="#CBD5E1" font-family="Arial,sans-serif">ARCEAPPS · MEMORY / RESOURCES / SKILLS</text></svg>