  <text x="60" y="74" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">Stack · Storage · Traction (stars as of 2026-07-27)</text>

  <!-- Column header bar -->
  <g transform="translate(60, 100)">
    <rect width="1080" height="32" rx="4" fill="#018786" opacity="0.15"/>
