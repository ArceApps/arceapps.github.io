    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Stack:</text>
    <rect x="50" y="-9" width="14" height="14" rx="2" fill="#FF9800" opacity="0.6"/>
    <text x="70" y="0" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">language other than JS (Rust, Python)</text>
    <text x="0" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">SIGNAL:</text>
    <text x="60" y="20" font-family="ui-monospace, monospace" font-size="11" fill="#018786">what makes the plugin unique vs the 3 already covered in this blog</text>
