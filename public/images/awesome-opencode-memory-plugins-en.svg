    <text x="420" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#018786" font-weight="bold" letter-spacing="1">STACK</text>
    <text x="600" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#018786" font-weight="bold" letter-spacing="1">STORAGE</text>
    <text x="780" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#018786" font-weight="bold" letter-spacing="1">SCOPE</text>
    <text x="970" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#018786" font-weight="bold" letter-spacing="1" text-anchor="end">★</text>
    <text x="1000" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#018786" font-weight="bold" letter-spacing="1">SIGNAL</text>
