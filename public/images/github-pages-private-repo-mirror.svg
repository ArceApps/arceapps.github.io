<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages: private source to public mirror</title>
  <desc id="desc">A geometric diagram showing a private source repository flowing through a clean mirror into GitHub Pages.</desc>
  <rect width="1200" height="630" rx="36" fill="#0F172A"/>
  <g opacity="0.18" stroke="#018786" fill="none">
    <path d="M70 95H1130M70 535H1130" stroke-width="2"/>
    <circle cx="1080" cy="110" r="58" stroke-width="3"/>
    <circle cx="120" cy="520" r="84" stroke-width="3"/>
  </g>

  <text x="72" y="86" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="42" font-weight="700">
    PRIVATE SOURCE → PUBLIC MIRROR → GITHUB PAGES
  </text>
  <text x="74" y="126" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">
    A release boundary for a public portfolio
  </text>

  <g transform="translate(70 205)">
    <rect width="300" height="205" rx="24" fill="#111C31" stroke="#018786" stroke-width="4"/>
    <rect x="28" y="28" width="58" height="58" rx="12" fill="#018786"/>
    <path d="M44 48h26M44 59h26M44 70h18" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    <text x="28" y="125" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">PRIVATE SOURCE</text>
    <text x="28" y="160" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">web-portfolio</text>
    <text x="28" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">agents · docs · code · context</text>
  </g>

  <g transform="translate(450 205)">
    <rect width="300" height="205" rx="24" fill="#111C31" stroke="#FF9800" stroke-width="4"/>
    <circle cx="58" cy="57" r="30" fill="#FF9800"/>
    <path d="M44 57l10 10 20-24" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="125" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">CLEAN MIRROR</text>
    <text x="28" y="160" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">rsync --delete</text>
    <text x="28" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">explicit publication policy</text>
  </g>

  <g transform="translate(830 205)">
    <rect width="300" height="205" rx="24" fill="#111C31" stroke="#018786" stroke-width="4"/>
    <path d="M29 78h58v-50H29z" fill="#018786"/>
    <path d="M42 65l12-14 10 10 12-18" fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="125" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="700">GITHUB PAGES</text>
    <text x="28" y="160" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">arceapps.github.io</text>
    <text x="28" y="188" fill="#94A3B8" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">GitHub-hosted build</text>
  </g>

  <g fill="none" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M385 307h45"/>
    <path d="M418 294l13 13-13 13"/>
    <path d="M765 307h45"/>
    <path d="M798 294l13 13-13 13"/>
  </g>

  <g transform="translate(72 482)">
    <rect width="1056" height="72" rx="18" fill="#0B1220" stroke="#22304A"/>
    <text x="26" y="44" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600">
      Maximum context for building
    </text>
    <circle cx="356" cy="36" r="5" fill="#FF9800"/>
    <text x="383" y="44" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600">
      Minimum public surface
    </text>
    <circle cx="704" cy="36" r="5" fill="#018786"/>
    <text x="731" y="44" fill="#F8FAFC" font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="600">
      Auditable releases
    </text>
  </g>
</svg>