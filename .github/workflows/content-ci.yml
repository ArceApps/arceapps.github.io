name: Content CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        # Vitest writes temporary worker files; avoid quota-limited system /tmp on the self-hosted runner.
        env:
          TMPDIR: ${{ runner.temp }}
        run: pnpm test

      - name: Astro build
        run: pnpm build

      - name: Install Chromium for visual QA
        # Playwright 1.57 has no official Ubuntu 26.04 browser target yet.
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: pnpm exec playwright install chromium

      - name: Visual QA screenshots (ES/EN, mobile/desktop, light/dark)
        env:
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
        run: node scripts/portfolio-visual-qa.mjs

      - name: Generate visual contact sheets for review
        # The repository's Actions artifact storage quota is exhausted. Emit
        # compact JPEG contact sheets into the private workflow log instead.
        run: node scripts/portfolio-visual-review.mjs
