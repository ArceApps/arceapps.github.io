<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="DeepSeek Harness vs OpenCode Codex Claude Code comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Four columns side by side -->
  <g transform="translate(120, 130)">
    <rect x="0" y="0" width="220" height="400" rx="14" fill="#0B1220" stroke="#018786" stroke-width="2"/>
    <rect x="245" y="0" width="220" height="400" rx="14" fill="#0B1220" stroke="#FF9800" stroke-width="2"/>
    <rect x="490" y="0" width="220" height="400" rx="14" fill="#0B1220" stroke="#9CA3AF" stroke-width="2"/>
    <rect x="735" y="0" width="220" height="400" rx="14" fill="#0B1220" stroke="#018786" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Column 1: DeepSeek Harness -->
    <text x="110" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#018786" font-weight="700">DeepSeek</text>
    <text x="110" y="60" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#018786" font-weight="700">Harness</text>
    <text x="110" y="86" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9CA3AF">MIT · v0.1.0-rc.5</text>
    <line x1="20" y1="100" x2="200" y2="100" stroke="#1F2937" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E5E7EB">
      <text x="20" y="130">todo es un plugin</text>
      <text x="20" y="156">Cordis kernel</text>
      <text x="20" y="182">session log</text>
      <text x="20" y="208">append-only</text>
      <text x="20" y="234">bwrap + Landlock</text>
      <text x="20" y="260">self-evolving</text>
    </g>
    <text x="110" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">runtime framework</text>

    <!-- Column 2: Claude Code -->
    <text x="355" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#FF9800" font-weight="700">Claude</text>
    <text x="355" y="60" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#FF9800" font-weight="700">Code</text>
    <text x="355" y="86" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9CA3AF">source-available</text>
    <line x1="265" y1="100" x2="445" y2="100" stroke="#1F2937" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E5E7EB">
      <text x="265" y="130">Skills + Subagents</text>
      <text x="265" y="156">Hooks + MCP</text>
      <text x="265" y="182">Agent Teams</text>
      <text x="265" y="208">Plugins marketplace</text>
      <text x="265" y="234">sandbox maduro</text>
      <text x="265" y="260">producto pulido</text>
    </g>
    <text x="355" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">product experience</text>

    <!-- Column 3: Codex CLI -->
    <text x="600" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#FFFFFF" font-weight="700">Codex</text>
    <text x="600" y="60" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#FFFFFF" font-weight="700">CLI</text>
    <text x="600" y="86" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9CA3AF">Apache 2.0 · Rust</text>
    <line x1="510" y1="100" x2="690" y2="100" stroke="#1F2937" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E5E7EB">
      <text x="510" y="130">folder = plugin</text>
      <text x="510" y="156">sandbox kernel</text>
      <text x="510" y="182">declarativo</text>
      <text x="510" y="208">code mode</text>
      <text x="510" y="234">safety leader</text>
      <text x="510" y="260">opinionated</text>
    </g>
    <text x="600" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">safety-first</text>

    <!-- Column 4: OpenCode -->
    <text x="845" y="40" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#018786" font-weight="700">OpenCode</text>
    <text x="845" y="86" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9CA3AF">MIT · Go · 197k</text>
    <line x1="755" y1="100" x2="935" y2="100" stroke="#1F2937" stroke-width="1"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E5E7EB">
      <text x="755" y="130">model-agnostic</text>
      <text x="755" y="156">cualquier provider</text>
      <text x="755" y="182">config > código</text>
      <text x="755" y="208">terminal o web</text>
      <text x="755" y="234">unix mental model</text>
      <text x="755" y="260">zero vendor lock-in</text>
    </g>
    <text x="845" y="380" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">open minimalist</text>
  </g>

  <!-- Title -->
  <g transform="translate(60, 56)">
    <rect width="14" height="56" fill="#FF9800"/>
    <text x="30" y="32" font-family="ui-monospace, Menlo, monospace" font-size="30" font-weight="700" fill="#FFFFFF">cara a cara · 2026</text>
    <text x="30" y="60" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9CA3AF">DeepSeek Harness vs OpenCode, Codex y Claude Code</text>
  </g>

  <g transform="translate(60, 580)" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6B7280">
    <text x="0" y="0">ARCEAPPS · 2026</text>
    <text x="1140" y="0" text-anchor="end">stars · 15-ago-2026</text>
  </g>
</svg>
