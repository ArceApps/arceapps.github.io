<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-wf-es" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-wf-es" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-wf-es" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-wf-purple-es" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-wf-es)" opacity="0.55"/>

  <text x="60" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="3">UNA BRANCH SE CONVIERTE EN SALA · EL PIPELINE DE RELEASE MOBILE-FIRST</text>
  <text x="1140" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="2">INFOGRAFÍA 04 / 04</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="50" y="120" width="1100" height="170" rx="18" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <rect x="70" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <rect x="70" y="150" width="180" height="34" rx="12" fill="#018786"/>
  <text x="160" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">FASE 1 · @humano</text>
  <text x="160" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Abrir un canal</text>
  <text x="160" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Sala efímera por</text>
  <text x="160" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">feature o bug. Eventos</text>
  <text x="160" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">NIP-34 para patches.</text>
  <text x="160" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">móvil: crear + invitar agentes</text>

  <rect x="266" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="291" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="291" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">alcance</text>
  <text x="291" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">ok?</text>

  <rect x="332" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="332" y="150" width="180" height="34" rx="12" fill="#FF9800"/>
  <text x="422" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">FASE 2 · @claude-code</text>
  <text x="422" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Plan + delega</text>
  <text x="422" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">El agente frontier</text>
  <text x="422" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">dibuja un plan y</text>
  <text x="422" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">recluta workers.</text>
  <text x="422" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">buzz-acp habla ACP ↔ MCP</text>

  <rect x="528" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="553" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="553" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">plan</text>
  <text x="553" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#fbbf24">ok?</text>

  <rect x="594" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="594" y="150" width="180" height="34" rx="12" fill="#FF9800"/>
  <text x="684" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">FASE 3 · @swarm</text>
  <text x="684" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Build + test</text>
  <text x="684" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Agentes paralelos</text>
  <text x="684" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">postean patches +</text>
  <text x="684" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">CI en side-channels.</text>
  <text x="684" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">modelos baratos para el grueso</text>

  <rect x="790" y="190" width="50" height="60" rx="6" fill="#fbbf24" opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="815" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" fill="#fbbf24">🔒</text>
  <text x="815" y="238" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">tests</text>
  <text x="815" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#fbbf24">verdes?</text>

  <rect x="856" y="150" width="180" height="120" rx="12" fill="#0F172A" stroke="#34d399" stroke-width="2"/>
  <rect x="856" y="150" width="180" height="34" rx="12" fill="#34d399"/>
  <text x="946" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0F172A">FASE 4 · @reviewer</text>
  <text x="946" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#cbd5e1">Review + merge</text>
  <text x="946" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Humano aprueba</text>
  <text x="946" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">desde el móvil; el</text>
  <text x="946" y="250" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">merge es evento.</text>
  <text x="946" y="263" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">👍 cuenta como aprobación</text>

  <circle cx="1090" cy="210" r="26" fill="#34d399"/>
  <text x="1090" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20">✓</text>
  <text x="1090" y="252" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">merge firmado</text>

  <line x1="252" y1="210" x2="262" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="318" y1="210" x2="328" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="514" y1="210" x2="524" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="580" y1="210" x2="590" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="776" y1="210" x2="786" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="842" y1="210" x2="852" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-wf-es)"/>
  <line x1="1038" y1="210" x2="1064" y2="210" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow-wf-purple-es)"/>

  <rect x="60" y="335" width="540" height="200" rx="14" fill="#0b1220" stroke="#018786" stroke-width="1.5"/>
  <text x="80" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#34d399">⚙️  Variables clave de configuración</text>
  <text x="80" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Un .env mínimo te levanta todo en local:</text>
  <text x="80" y="416" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">DATABASE_URL=postgres://buzz:buzz@localhost/buzz</text>
  <text x="80" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">REDIS_URL=redis://localhost:6379</text>
  <text x="80" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">S3_ENDPOINT=http://localhost:9000  S3_BUCKET=buzz</text>
  <text x="80" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">BUZZ_PRIVATE_KEY=<nsec-del-agente>  BUZZ_RELAY_URL=ws://localhost:3000</text>
  <text x="80" y="490" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">El CLI del agente es JSON-in / JSON-out:</text>
  <text x="80" y="510" font-family="ui-monospace, monospace" font-size="11" fill="#34d399">buzz-cli post --channel "<id>" --body "tests green ✅"</text>

  <rect x="615" y="335" width="525" height="200" rx="14" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="635" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFB74D">🌀  Feedback loops que sobreviven a la tapa del portátil</text>
  <text x="635" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">El canal es el registro. Seis meses después:</text>
  <text x="635" y="416" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• búsqueda devuelve el fix rechazado y el porqué</text>
  <text x="635" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• el agente triaje reproduce hilos con pruebas</text>
  <text x="635" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• notificaciones móviles vía NIP-PL split-routed</text>
  <text x="635" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• on-call pagina al último que shippeó</text>
  <text x="635" y="490" font-family="ui-monospace, monospace" font-size="11" fill="#FFB74D">Los caminos fallidos son durables. La sala es la inteligencia.</text>

  <text x="60" y="612" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">Fuente: github.com/block/buzz/README.md · engineering.block.xyz/blog/buzz § Honey I saved the context · buzz-cli: crates/buzz-cli (JSON-in/JSON-out para LLMs)</text>
</svg>
