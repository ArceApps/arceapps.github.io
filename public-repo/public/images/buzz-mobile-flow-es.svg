<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-mob-es" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-mob-es" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-mob-es" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-mob-es)" opacity="0.55"/>

  <text x="60" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="3">DEL PORTÁTIL AL BOLSILLO · PAIRING MÓVIL EN BUZZ</text>
  <text x="1140" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="2">INFOGRAFÍA 02 / 04</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1e293b" stroke-width="1"/>

  <rect x="60" y="120" width="1080" height="180" rx="20" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <rect x="90" y="150" width="220" height="120" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <rect x="90" y="150" width="220" height="30" rx="12" fill="#018786"/>
  <text x="200" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">FASE 1 · ESCRITORIO</text>
  <text x="200" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1">Genera nsec + QR</text>
  <text x="200" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">El escritorio crea tu par</text>
  <text x="200" y="237" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">de claves y un QR secreto.</text>
  <text x="200" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">🔐 keypair nace en el dispositivo</text>

  <rect x="380" y="150" width="220" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="380" y="150" width="220" height="30" rx="12" fill="#FF9800"/>
  <text x="490" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">FASE 2 · MÓVIL</text>
  <text x="490" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1">Escanea + 6 dígitos</text>
  <text x="490" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Intercambio cifrado por</text>
  <text x="490" y="237" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Buzz, confirmación 6 dígitos.</text>
  <text x="490" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">🤳 misma identidad, nuevo device</text>

  <rect x="670" y="150" width="220" height="120" rx="12" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <rect x="670" y="150" width="220" height="30" rx="12" fill="#018786"/>
  <text x="780" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">FASE 3 · MÓVIL = PAR</text>
  <text x="780" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1">WebSocket directo al relay</text>
  <text x="780" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">El móvil firma eventos en local;</text>
  <text x="780" y="237" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">el relay solo ve metadatos.</text>
  <text x="780" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">📡 misma superficie, bolsillo</text>

  <rect x="960" y="150" width="160" height="120" rx="12" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <rect x="960" y="150" width="160" height="30" rx="12" fill="#FF9800"/>
  <text x="1040" y="172" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#0F172A">FASE 4</text>
  <text x="1040" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#cbd5e1">Revisar en marcha</text>
  <text x="1040" y="222" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">Aprobar, mergear,</text>
  <text x="1040" y="237" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">o redirigir al vuelo.</text>
  <text x="1040" y="258" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">🚶 nunca un control remoto</text>

  <line x1="316" y1="210" x2="372" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-mob-es)"/>
  <line x1="606" y1="210" x2="662" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-mob-es)"/>
  <line x1="896" y1="210" x2="952" y2="210" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-mob-es)"/>

  <rect x="60" y="335" width="350" height="200" rx="14" fill="#0b1220" stroke="#018786" stroke-width="1.5"/>
  <text x="80" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#34d399">📬 Push (NIP-PL)</text>
  <text x="80" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">La app se registra con relays</text>
  <text x="80" y="407" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">y con un push gateway aparte.</text>
  <text x="80" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• los relays no ven el device token</text>
  <text x="80" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• el gateway no ve la pubkey</text>
  <text x="80" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• Apple/Google no ven metadatos</text>
  <text x="80" y="510" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">→ ningún tercero puede correlacionarte</text>

  <rect x="425" y="335" width="350" height="200" rx="14" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="445" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#FFB74D">🛡️ Privacidad por defecto</text>
  <text x="445" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Sin SDKs de analytics al escribir</text>
  <text x="445" y="407" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">esto — verificable en el código.</text>
  <text x="445" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• EXIF / GPS se eliminan al subir</text>
  <text x="445" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• claves privadas nunca salen</text>
  <text x="445" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• relay solo ve routing metadata</text>
  <text x="445" y="510" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">→ privacidad es pared de carga</text>

  <rect x="790" y="335" width="350" height="200" rx="14" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="810" y="365" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#34d399">🤖 Plano de control de agentes</text>
  <text x="810" y="392" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">El móvil no aloja agentes,</text>
  <text x="810" y="407" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">pero los controla donde sea.</text>
  <text x="810" y="432" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• deja mensajes mientras el laptop duerme</text>
  <text x="810" y="448" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• cancelación viaja como efímero cifrado</text>
  <text x="810" y="464" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">• telemetría en vivo dentro de DMs</text>
  <text x="810" y="510" font-family="ui-monospace, monospace" font-size="10" fill="#FFB74D">→ tu colmena es multi-device por defecto</text>

  <text x="60" y="612" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">Fuente: engineering.block.xyz/blog/a-buzz-on-your-phone · Buzz móvil corre en Flutter, distribuido por apple.com/us/app/buzz-chat-with-your-hive y play.google.com/store/apps/details?id=xyz.block.buzz.mobile</text>
</svg>
