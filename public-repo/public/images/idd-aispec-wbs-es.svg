<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="60" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="26" font-weight="bold">WBS: reducir el espacio de soluciones</text>
  <text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="15">Cada restricción bien formulada elimina implementaciones inválidas — la reducción es multiplicativa</text>

  <!-- left: vague prompt -->
  <rect x="70" y="120" width="310" height="70" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="225" y="150" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="16" font-weight="bold">Prompt vago</text>
  <text x="225" y="173" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">"escribe código de auth"</text>

  <!-- left solution space cloud -->
  <g fill="#FF9800" opacity="0.5">
    <circle cx="130" cy="300" r="18"/>
    <circle cx="170" cy="275" r="14"/>
    <circle cx="215" cy="310" r="20"/>
    <circle cx="260" cy="270" r="13"/>
    <circle cx="300" cy="300" r="16"/>
    <circle cx="155" cy="345" r="15"/>
    <circle cx="240" cy="350" r="17"/>
    <circle cx="285" cy="335" r="12"/>
    <circle cx="195" cy="240" r="12"/>
    <circle cx="115" cy="250" r="10"/>
    <circle cx="325" cy="275" r="11"/>
  </g>
  <text x="225" y="415" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="15" font-weight="bold">Miles de implementaciones</text>
  <text x="225" y="438" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">muestreo hacia la solución genérica</text>

  <!-- funnel arrows -->
  <path d="M 410 300 L 490 300" stroke="#018786" stroke-width="4" fill="none"/>
  <polygon points="485,290 505,300 485,310" fill="#018786"/>
  <path d="M 690 300 L 770 300" stroke="#018786" stroke-width="4" fill="none"/>
  <polygon points="765,290 785,300 765,310" fill="#018786"/>

  <!-- middle: WBS spec -->
  <rect x="500" y="120" width="200" height="70" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" fill="#018786" font-family="monospace" font-size="16" font-weight="bold">Especificación WBS</text>
  <text x="600" y="173" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">What · Boundaries · Success</text>

  <!-- WBS mini boxes -->
  <g font-family="monospace">
    <rect x="470" y="210" width="260" height="60" rx="8" fill="#0B1120" stroke="#018786" stroke-width="2"/>
    <text x="600" y="235" text-anchor="middle" fill="#7DD3C8" font-size="14" font-weight="bold">WHAT · qué</text>
    <text x="600" y="256" text-anchor="middle" fill="#CBD5E1" font-size="12">acciones claras y ejecutables</text>

    <rect x="470" y="282" width="260" height="60" rx="8" fill="#0B1120" stroke="#FF9800" stroke-width="2"/>
    <text x="600" y="307" text-anchor="middle" fill="#FFC97A" font-size="14" font-weight="bold">BOUNDARIES · límites</text>
    <text x="600" y="328" text-anchor="middle" fill="#CBD5E1" font-size="12">valles de probabilidad: soluciones inválidas</text>

    <rect x="470" y="354" width="260" height="60" rx="8" fill="#0B1120" stroke="#018786" stroke-width="2"/>
    <text x="600" y="379" text-anchor="middle" fill="#7DD3C8" font-size="14" font-weight="bold">SUCCESS · éxito</text>
    <text x="600" y="400" text-anchor="middle" fill="#CBD5E1" font-size="12">picos hacia los que muestrea el modelo</text>
  </g>

  <!-- right: reduced space -->
  <g fill="#018786" opacity="0.75">
    <circle cx="880" cy="300" r="14"/>
    <circle cx="920" cy="285" r="10"/>
    <circle cx="960" cy="305" r="12"/>
    <circle cx="900" cy="330" r="11"/>
    <circle cx="945" cy="335" r="9"/>
  </g>
  <text x="920" y="415" text-anchor="middle" fill="#018786" font-family="monospace" font-size="15" font-weight="bold">Pocas implementaciones viables</text>
  <text x="920" y="438" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">el resultado coincide con la intención</text>

  <!-- example block at bottom -->
  <rect x="140" y="470" width="920" height="110" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
  <text x="175" y="500" fill="#F8FAFC" font-family="monospace" font-size="14" font-weight="bold">Ejemplo UserAuth:</text>
  <text x="175" y="526" fill="#94A3B8" font-family="monospace" font-size="13">What: login + JWT + intentos · Boundaries: máx. 5/hora, token 24h, hash</text>
  <text x="175" y="550" fill="#94A3B8" font-family="monospace" font-size="13">Success: válidos entran, inválidos bloqueados, respuesta &lt; 200ms</text>
  <text x="175" y="572" fill="#018786" font-family="monospace" font-size="13">Tres restricciones que se componen: el espacio de soluciones colapsa · ARCEAPPS</text>
</svg>
