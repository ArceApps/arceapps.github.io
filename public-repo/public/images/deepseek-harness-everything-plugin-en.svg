<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="DeepSeek Harness everything is a plugin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <radialGradient id="ring1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#018786" stop-opacity="0.0"/>
      <stop offset="0.7" stop-color="#018786" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#018786" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ring2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF9800" stop-opacity="0.0"/>
      <stop offset="0.7" stop-color="#FF9800" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <g transform="translate(170, 320)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#E5E7EB">
    <rect x="-130" y="-180" width="260" height="360" rx="14" fill="#0B1220" stroke="#1F2937" stroke-width="2"/>
    <text x="-115" y="-150" font-size="16" fill="#018786" font-weight="700">PLUGIN TREE</text>
    <g fill="#E5E7EB">
      <text x="-115" y="-110">apply(ctx: Context) {</text>
      <text x="-100" y="-88">ctx.llm.register(...)</text>
      <text x="-100" y="-66">ctx.tools.register(...)</text>
      <text x="-100" y="-44">ctx.sandbox.register(...)</text>
      <text x="-100" y="-22">ctx.subagents.register(...)</text>
      <text x="-100" y="0">ctx.session.register(...)</text>
      <text x="-100" y="22">ctx.ui.register(...)</text>
      <text x="-115" y="44">}</text>
    </g>
    <line x1="-115" y1="68" x2="115" y2="68" stroke="#1F2937" stroke-width="1"/>
    <g fill="#9CA3AF">
      <text x="-115" y="92"># reversible</text>
      <text x="-115" y="112"># reactive</text>
      <text x="-115" y="132"># compositional</text>
    </g>
    <g transform="translate(0, 168)">
      <circle r="6" fill="#018786"/>
      <text x="14" y="5" fill="#018786" font-size="13">Cordis kernel</text>
    </g>
  </g>

  <g transform="translate(770, 320)">
    <circle r="270" fill="url(#ring1)"/>
    <circle r="220" fill="none" stroke="#018786" stroke-width="2" stroke-dasharray="6 8" opacity="0.85"/>
    <circle r="170" fill="url(#ring2)"/>
    <circle r="130" fill="none" stroke="#FF9800" stroke-width="2" stroke-dasharray="4 6" opacity="0.85"/>
    <circle r="90" fill="#0B1220" stroke="#018786" stroke-width="3"/>
    <text y="-2" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="22" fill="#FFFFFF" font-weight="700">MODEL</text>
    <text y="22" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#9CA3AF">V4-Pro · Claude · GPT · Ollama</text>

    <text y="-180" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#018786">+ tools + skills</text>
    <text y="-160" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#018786">+ session log</text>
    <text y="158" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#FF9800">+ sandbox + UI</text>
    <text y="178" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#FF9800">+ agent loop</text>

    <text x="0" y="232" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#FFFFFF" font-weight="700">HARNESS</text>
    <text x="0" y="252" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9CA3AF">everything is a plugin</text>
  </g>

  <g transform="translate(60, 64)">
    <rect width="14" height="56" fill="#FF9800"/>
    <text x="30" y="32" font-family="ui-monospace, Menlo, monospace" font-size="34" font-weight="700" fill="#FFFFFF">DeepSeek Harness</text>
    <text x="30" y="60" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9CA3AF">the runtime where everything is a plugin</text>
  </g>

  <g transform="translate(60, 580)" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6B7280">
    <text x="0" y="0">ARCEAPPS · 2026</text>
    <text x="1140" y="0" text-anchor="end">MIT · v0.1.0-rc.5</text>
  </g>
</svg>
