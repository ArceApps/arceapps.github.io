<text x="0" y="24" fill="#cbd5e1" font-size="11" text-anchor="middle">opencode serve</text>
<circle cx="0" cy="0" r="150" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="8,6"/>
<circle cx="0" cy="0" r="180" fill="#FF9800" opacity="0.06" stroke="#FF9800" stroke-width="2"/>
<text x="0" y="-188" fill="#FF9800" font-size="13" font-weight="700" text-anchor="middle">PHONE</text>
<text x="0" y="-172" fill="#cbd5e1" font-size="11" text-anchor="middle">Expo / Android</text>
<text x="-260" y="6" fill="#94a3b8" font-size="11">Tailscale tunnel →</text>
<text x="190" y="6" fill="#94a3b8" font-size="11">← Tailscale tunnel</text>
<text x="0" y="48" fill="#cbd5e1" font-size="11" text-anchor="middle">Android app (Expo)</text>
<text x="0" y="64" fill="#cbd5e1" font-size="11" text-anchor="middle">WireGuard / Tailscale</text>
