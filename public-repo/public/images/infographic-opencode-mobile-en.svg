<rect x="0" y="92" width="500" height="56" rx="10" fill="#0b1226" stroke="#34d399" stroke-width="1.2"/>
<rect x="0" y="92" width="40" height="56" rx="10" fill="#34d399" opacity="0.85"/>
<text x="20" y="126" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">2</text>
