<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7EC8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="80" fill="#8B7EC8" opacity="0.92"/>
  <text x="40" y="34" fill="#0F172A" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">APP UNDER REVIEW</text>
  <text x="40" y="64" fill="#0F172A" font-size="26" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">opencode-mobile</text>
  <text x="1160" y="50" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ANDROID + TAILSCALE</text>

<g transform="translate(220,310)">
<text x="0" y="-150" fill="#cbd5e1" font-size="14" font-weight="700">ARCHITECTURE · PHONE CONTROLS, HOME RUNS</text>
