<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="45%" stop-color="#FF9800" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#018786" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#018786"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="60" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="26" font-weight="bold">The autonomy spectrum: who decides the how?</text>
  <text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="15">From full human control to complete autonomy — IDD holds the defensible middle ground</text>

  <!-- spectrum bar -->
  <rect x="90" y="150" width="1020" height="18" rx="9" fill="url(#spectrum)" opacity="0.8"/>
  <text x="90" y="138" text-anchor="start" fill="#94A3B8" font-family="monospace" font-size="13">human decides everything</text>
  <text x="1050" y="138" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="13">AI decides everything</text>

  <!-- paradigm cards -->
  <g font-family="monospace">
    <!-- Vibe coding -->
    <rect x="60" y="200" width="240" height="150" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="180" cy="230" r="20" fill="#FF9800" opacity="0.25"/>
    <text x="180" y="235" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">1</text>
    <text x="180" y="270" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">Vibe coding</text>
    <text x="180" y="295" text-anchor="middle" fill="#CBD5E1" font-size="12">what: human (vague)</text>
    <text x="180" y="315" text-anchor="middle" fill="#CBD5E1" font-size="12">how: AI (free)</text>
    <text x="180" y="340" text-anchor="middle" fill="#94A3B8" font-size="12">full review</text>

    <!-- SDD -->
    <rect x="330" y="200" width="240" height="150" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
    <circle cx="450" cy="230" r="20" fill="#FF9800" opacity="0.25"/>
    <text x="450" y="235" text-anchor="middle" fill="#FF9800" font-size="13" font-weight="bold">2</text>
    <text x="450" y="270" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">SDD</text>
    <text x="450" y="295" text-anchor="middle" fill="#CBD5E1" font-size="12">what: human (spec)</text>
    <text x="450" y="315" text-anchor="middle" fill="#CBD5E1" font-size="12">how: AI (in the spec)</text>
    <text x="450" y="340" text-anchor="middle" fill="#94A3B8" font-size="12">test validation</text>

    <!-- IDD (highlighted) -->
    <rect x="600" y="195" width="240" height="160" rx="10" fill="#0B1120" stroke="#018786" stroke-width="3"/>
    <circle cx="720" cy="228" r="22" fill="#018786" opacity="0.35"/>
    <text x="720" y="233" text-anchor="middle" fill="#018786" font-size="14" font-weight="bold">3</text>
    <text x="720" y="268" text-anchor="middle" fill="#018786" font-size="18" font-weight="bold">IDD ★</text>
    <text x="720" y="293" text-anchor="middle" fill="#CBD5E1" font-size="12">what: intent + limits</text>
    <text x="720" y="313" text-anchor="middle" fill="#CBD5E1" font-size="12">how: structured AI</text>
    <text x="720" y="338" text-anchor="middle" fill="#7DD3C8" font-size="12">validated phases</text>

    <!-- Dark factory -->
    <rect x="870" y="200" width="240" height="150" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
    <circle cx="990" cy="230" r="20" fill="#018786" opacity="0.25"/>
    <text x="990" y="235" text-anchor="middle" fill="#018786" font-size="13" font-weight="bold">4</text>
    <text x="990" y="270" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="bold">Dark factory</text>
    <text x="990" y="295" text-anchor="middle" fill="#CBD5E1" font-size="12">what: objectives</text>
    <text x="990" y="315" text-anchor="middle" fill="#CBD5E1" font-size="12">how: AI (everything)</text>
    <text x="990" y="340" text-anchor="middle" fill="#94A3B8" font-size="12">full autonomy</text>
  </g>

  <!-- connecting ticks -->
  <g stroke="#F8FAFC" stroke-width="2">
    <line x1="180" y1="160" x2="180" y2="196"/>
    <line x1="450" y1="160" x2="450" y2="196"/>
    <line x1="720" y1="160" x2="720" y2="191"/>
    <line x1="990" y1="160" x2="990" y2="196"/>
  </g>

  <!-- bottom takeaway -->
  <rect x="0" y="420" width="1200" height="210" fill="#0B1120"/>
  <text x="600" y="470" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="20" font-weight="bold">The difference between SDD and IDD is the grain of the spec</text>
  <text x="600" y="505" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="15">SDD describes the path: files, functions, interfaces, tests</text>
  <text x="600" y="535" text-anchor="middle" fill="#CBD5E1" font-family="monospace" font-size="15">IDD describes the destination: outcome, limits, success criteria</text>
  <text x="600" y="575" text-anchor="middle" fill="#018786" font-family="monospace" font-size="14">Not enemies: layers · SDD for the contract, IDD for the intent · ARCEAPPS</text>
</svg>
