<text x="14" y="22" fill="#0F172A" font-size="13" font-weight="700">Install</text>
<text x="14" y="62" fill="#cbd5e1" font-size="13">• AppImage / DMG / MSI</text>
<text x="14" y="92" fill="#cbd5e1" font-size="13">• Desktop: bundles opencode binary</text>
<text x="14" y="122" fill="#cbd5e1" font-size="13">• Web: requires CLI in PATH</text>
<text x="14" y="152" fill="#cbd5e1" font-size="13">• No Termux, no Docker</text>
</g>
<g transform="translate(380,0)">
<rect width="350" height="220" rx="12" fill="#0b1226" stroke="#FFB74D" stroke-width="1.5"/>
<rect width="350" height="34" rx="12" fill="#FFB74D" opacity="0.85"/>
<text x="14" y="22" fill="#0F172A" font-size="13" font-weight="700">Day-to-day</text>
<text x="14" y="62" fill="#cbd5e1" font-size="13">• Branchable chat with /undo /redo</text>
<text x="14" y="92" fill="#cbd5e1" font-size="13">• Integrated voice input</text>
<text x="14" y="122" fill="#cbd5e1" font-size="13">• GitHub-native (issues/PRs)</text>
<text x="14" y="152" fill="#cbd5e1" font-size="13">• Official VS Code extension</text>
</g>
<g transform="translate(760,0)">
<rect width="350" height="220" rx="12" fill="#0b1226" stroke="#ef4444" stroke-width="1.5"/>
<rect width="350" height="34" rx="12" fill="#ef4444" opacity="0.85"/>
<text x="14" y="22" fill="#0F172A" font-size="13" font-weight="700">Limitations</text>
<text x="14" y="62" fill="#cbd5e1" font-size="13">• Cloudflare tunnel required remotely</text>
<text x="14" y="92" fill="#cbd5e1" font-size="13">• Multi-window is heavy</text>
<text x="14" y="122" fill="#cbd5e1" font-size="13">• Linux build outside AppImage unstable</text>
</g>
