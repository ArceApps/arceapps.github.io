<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="60" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="26" font-weight="bold">WBS: shrinking the solution space</text>
  <text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="15">Each well-formed constraint eliminates invalid implementations — the reduction is multiplicative</text>

  <!-- left: vague prompt -->
  <rect x="70" y="120" width="310" height="70" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="225" y="150" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="16" font-weight="bold">Vague prompt</text>
  <text x="225" y="173" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">"write authentication code"</text>

  <!-- left solution space cloud -->
  <g fill="#FF9800" opacity="0.5">
    <circle cx="130" cy="300" r="18"/>
    <circle cx="170" cy="275" r="14"/>
    <circle cx="215" cy="310" r="20"/>
    <circle cx="260" cy="270" r="13"/>
    <circle cx="300" cy="300" r="16"/>
    <circle cx="155" cy="345" r="15"/>
    <circle cx="240" cy="350" r="17"/>
    <circle cx="285" cy="335" r="12"/>
    <circle cx="195" cy="240" r="12"/>
    <circle cx="115" cy="250" r="10"/>
    <circle cx="325" cy="275" r="11"/>
  </g>
  <text x="225" y="415" text-anchor="middle" fill="#FF9800" font-family="monospace" font-size="15" font-weight="bold">Thousands of implementations</text>
  <text x="225" y="438" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">sampling toward the generic solution</text>

  <!-- funnel arrows -->
  <path d="M 410 300 L 490 300" stroke="#018786" stroke-width="4" fill="none"/>
  <polygon points="485,290 505,300 485,310" fill="#018786"/>
  <path d="M 690 300 L 770 300" stroke="#018786" stroke-width="4" fill="none"/>
  <polygon points="765,290 785,300 765,310" fill="#018786"/>

  <!-- middle: WBS spec -->
  <rect x="500" y="120" width="200" height="70" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" fill="#018786" font-family="monospace" font-size="16" font-weight="bold">WBS specification</text>
  <text x="600" y="173" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">What · Boundaries · Success</text>

  <!-- WBS mini boxes -->
  <g font-family="monospace">
    <rect x="470" y="210" width="260" height="60" rx="8" fill="#0B1120" stroke="#018786" stroke-width="2"/>
    <text x="600" y="235" text-anchor="middle" fill="#7DD3C8" font-size="14" font-weight="bold">WHAT</text>
    <text x="600" y="256" text-anchor="middle" fill="#CBD5E1" font-size="12">clear, executable actions</text>

    <rect x="470" y="282" width="260" height="60" rx="8" fill="#0B1120" stroke="#FF9800" stroke-width="2"/>
    <text x="600" y="307" text-anchor="middle" fill="#FFC97A" font-size="14" font-weight="bold">BOUNDARIES</text>
    <text x="600" y="328" text-anchor="middle" fill="#CBD5E1" font-size="12">probability valleys: invalid solutions</text>

    <rect x="470" y="354" width="260" height="60" rx="8" fill="#0B1120" stroke="#018786" stroke-width="2"/>
    <text x="600" y="379" text-anchor="middle" fill="#7DD3C8" font-size="14" font-weight="bold">SUCCESS</text>
    <text x="600" y="400" text-anchor="middle" fill="#CBD5E1" font-size="12">peaks the model samples toward</text>
  </g>

  <!-- right: reduced space -->
  <g fill="#018786" opacity="0.75">
    <circle cx="880" cy="300" r="14"/>
    <circle cx="920" cy="285" r="10"/>
    <circle cx="960" cy="305" r="12"/>
    <circle cx="900" cy="330" r="11"/>
    <circle cx="945" cy="335" r="9"/>
  </g>
  <text x="920" y="415" text-anchor="middle" fill="#018786" font-family="monospace" font-size="15" font-weight="bold">Few viable implementations</text>
  <text x="920" y="438" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">the result matches the intent</text>

  <!-- example block at bottom -->
  <rect x="140" y="470" width="920" height="110" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
  <text x="175" y="500" fill="#F8FAFC" font-family="monospace" font-size="14" font-weight="bold">UserAuth example:</text>
  <text x="175" y="526" fill="#94A3B8" font-family="monospace" font-size="13">What: login + JWT + attempts · Boundaries: max 5/hour, token 24h, hash</text>
  <text x="175" y="550" fill="#94A3B8" font-family="monospace" font-size="13">Success: valid users in, invalid blocked, response &lt; 200ms</text>
  <text x="175" y="572" fill="#018786" font-family="monospace" font-size="13">Three compounding constraints: the solution space collapses · ARCEAPPS</text>
</svg>
