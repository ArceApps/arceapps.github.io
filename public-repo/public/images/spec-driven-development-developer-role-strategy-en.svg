<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid-en" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid-en)"/>

  <!-- Outer ring (orange = HARNESS / role redefinition) -->
  <circle cx="600" cy="315" r="240" fill="none" stroke="#FF9800" stroke-width="3" opacity="0.9"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#FF9800" stroke-width="1" opacity="0.4"/>

  <!-- Middle ring (teal = SPEC) -->
  <circle cx="600" cy="315" r="150" fill="#018786" opacity="0.85"/>
  <circle cx="600" cy="315" r="130" fill="none" stroke="#0F172A" stroke-width="2"/>

  <!-- Core (CODE / generated output) -->
  <circle cx="600" cy="315" r="65" fill="#0F172A" stroke="#018786" stroke-width="2"/>

  <!-- Center label: SPEC -->
  <text x="600" y="310" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700" letter-spacing="3">SPEC</text>
  <text x="600" y="340" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.85">source of truth</text>

  <!-- Outer labels: role pillars -->
  <!-- Top: Architect -->
  <text x="600" y="45" text-anchor="middle" fill="#FF9800" font-size="20" font-weight="700">ARCHITECT</text>
  <text x="600" y="68" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.7">of intent and contracts</text>

  <!-- Right: Validator -->
  <text x="935" y="310" text-anchor="middle" fill="#FF9800" font-size="20" font-weight="700">VALIDATOR</text>
  <text x="935" y="333" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.7">of generated code</text>

  <!-- Bottom: Curator -->
  <text x="600" y="595" text-anchor="middle" fill="#FF9800" font-size="20" font-weight="700">CURATOR</text>
  <text x="600" y="618" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.7">of specification drift</text>

  <!-- Left: Orchestrator -->
  <text x="265" y="310" text-anchor="middle" fill="#FF9800" font-size="20" font-weight="700">ORCHESTRATOR</text>
  <text x="265" y="333" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.7">of agentic flows</text>

  <!-- Diagonal arrows between roles (orange dots) -->
  <circle cx="450" cy="105" r="4" fill="#FF9800"/>
  <circle cx="750" cy="105" r="4" fill="#FF9800"/>
  <circle cx="810" cy="525" r="4" fill="#FF9800"/>
  <circle cx="390" cy="525" r="4" fill="#FF9800"/>

  <!-- Bottom band: title + tagline -->
  <rect x="0" y="0" width="1200" height="1200" fill="none"/>
  <text x="600" y="125" text-anchor="middle" fill="#FFFFFF" font-size="13" opacity="0.5" letter-spacing="4">— ARCEAPPS · STRATEGIC BRIEFING —</text>

  <!-- Brand mark -->
  <text x="1140" y="612" text-anchor="end" fill="#018786" font-size="14" font-weight="700" letter-spacing="2">ARCEAPPS · 2026</text>
  <text x="60" y="612" text-anchor="start" fill="#FFFFFF" font-size="14" opacity="0.5" letter-spacing="2">SPEC · ROLE · STRATEGY</text>

  <!-- Connecting dotted lines from each role to the SPEC core -->
  <line x1="600" y1="75" x2="600" y2="250" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="915" y1="310" x2="665" y2="315" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="600" y1="555" x2="600" y2="380" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
  <line x1="285" y1="310" x2="535" y2="315" stroke="#FF9800" stroke-width="1" stroke-dasharray="3,4" opacity="0.5"/>
</svg>
