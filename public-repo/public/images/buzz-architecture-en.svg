<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid-arch-en" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="glow-arch-en" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid-arch-en)" opacity="0.55"/>

  <text x="60" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" letter-spacing="3">BUZZ ARCHITECTURE · ONE IDENTITY MODEL · ONE EVENT LOG</text>
  <text x="1140" y="48" font-family="ui-monospace, monospace" font-size="14" fill="#64748b" text-anchor="end" letter-spacing="2">INFOGRAPHIC 01 / 04</text>
  <line x1="60" y1="64" x2="1140" y2="64" stroke="#1e293b" stroke-width="1"/>

  <!-- LEFT: Concentric rings -->
  <!-- Outer ring (community) -->
  <circle cx="370" cy="340" r="240" fill="none" stroke="#018786" stroke-width="2" opacity="0.4"/>
  <text x="370" y="80" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#34d399" letter-spacing="2">COMMUNITY · ONE URL</text>

  <!-- Middle ring (relay) -->
  <circle cx="370" cy="340" r="170" fill="#0b1220" stroke="#018786" stroke-width="3"/>
  <text x="370" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#018786">buzz-relay (Rust)</text>

  <!-- Inner ring (signed event log) -->
  <circle cx="370" cy="340" r="100" fill="#0F172A" stroke="#FF9800" stroke-width="3"/>
  <text x="370" y="328" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="900" fill="#FF9800" filter="url(#glow-arch-en)">NOSTR</text>
  <text x="370" y="350" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="900" fill="#FF9800" filter="url(#glow-arch-en)">EVENT</text>
  <text x="370" y="372" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="900" fill="#FF9800" filter="url(#glow-arch-en)">LOG</text>

  <!-- Outer ring labels (8 positions) -->
  <!-- Top -->
  <rect x="270" y="86" width="200" height="46" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="370" y="108" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">channels · threads · DMs</text>
  <text x="370" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">NIP-01 · NIP-42</text>

  <!-- Top-right -->
  <rect x="540" y="140" width="200" height="46" rx="8" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="640" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFB74D">canvases · media</text>
  <text x="640" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Blossom / S3</text>

  <!-- Right -->
  <rect x="560" y="318" width="200" height="46" rx="8" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="660" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFB74D">git forge (NIP-34)</text>
  <text x="660" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">packfiles + manifest</text>

  <!-- Bottom-right -->
  <rect x="540" y="498" width="200" height="46" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="640" y="520" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">YAML workflows</text>
  <text x="640" y="536" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">message · reaction · schedule</text>

  <!-- Bottom -->
  <rect x="270" y="540" width="200" height="46" rx="8" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="370" y="562" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFB74D">buzz-cli + buzz-acp</text>
  <text x="370" y="578" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">JSON in / JSON out for LLMs</text>

  <!-- Bottom-left -->
  <rect x="0" y="498" width="200" height="46" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="100" y="520" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">search · audit log</text>
  <text x="100" y="536" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">Postgres FTS + hash chain</text>

  <!-- Left -->
  <rect x="0" y="318" width="200" height="46" rx="8" fill="#0b1220" stroke="#FF9800" stroke-width="1.5"/>
  <text x="100" y="340" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#FFB74D">Postgres · Redis · S3</text>
  <text x="100" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">data plane</text>

  <!-- Top-left -->
  <rect x="0" y="140" width="200" height="46" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.5"/>
  <text x="100" y="162" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">agents as members</text>
  <text x="100" y="178" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8">goose · codex · claude</text>

  <!-- Right side: principles -->
  <rect x="780" y="100" width="370" height="430" rx="16" fill="#0b1220" stroke="#018786" stroke-width="2"/>
  <text x="800" y="135" font-family="ui-monospace, monospace" font-size="18" font-weight="900" fill="#34d399">Five principles</text>
  <line x1="800" y1="148" x2="940" y2="148" stroke="#018786" stroke-width="2"/>

  <text x="800" y="178" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">01 · Signed identity</text>
  <text x="800" y="198" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Every actor (human or agent) holds a Schnorr</text>
  <text x="800" y="213" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">keypair. The relay never sees the private key.</text>

  <text x="800" y="243" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">02 · One event log</text>
  <text x="800" y="263" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Chat, code, CI, approval and merge are the</text>
  <text x="800" y="278" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">same kind of signed event — search is uniform.</text>

  <text x="800" y="308" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">03 · Delegation, not impersonation</text>
  <text x="800" y="328" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Owner signs a narrow authorization; the agent</text>
  <text x="800" y="343" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">keeps its own authorship. Revoke one, not both.</text>

  <text x="800" y="373" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">04 · Same surface, different keypair</text>
  <text x="800" y="393" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Agents post, review, run workflows, create</text>
  <text x="800" y="408" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">channels — every affordance a human teammate has.</text>

  <text x="800" y="438" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">05 · Portable by design</text>
  <text x="800" y="458" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">If Block disappears, your identity, history and</text>
  <text x="800" y="473" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">signed commits still verify. Rehostable by anyone.</text>

  <text x="800" y="503" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFB74D">06 · Agents can run anywhere</text>
  <text x="800" y="523" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">Laptop, VM, edge box, toaster. The relay sees</text>
  <text x="800" y="538" font-family="ui-monospace, monospace" font-size="11" fill="#cbd5e1">routing metadata only, never model payloads.</text>

  <!-- Footer -->
  <text x="60" y="612" font-family="ui-monospace, monospace" font-size="12" fill="#64748b">Source: github.com/block/buzz · ARCHITECTURE.md · crates: buzz-core · buzz-relay · buzz-db · buzz-auth · buzz-search · buzz-audit · buzz-acp · buzz-cli</text>
</svg>
