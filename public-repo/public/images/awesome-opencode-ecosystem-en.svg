<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#018786" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#018786" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark top-left -->
  <g transform="translate(40, 40)">
    <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#018786" letter-spacing="2">ARCEAPPS · 2026</text>
  </g>

  <!-- Central concentric rings: the OpenCode ecosystem -->
  <g transform="translate(600, 290)">
    <!-- Outer ring (community) -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
    <!-- Middle ring (awesome list) -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FF9800" stroke-width="2" opacity="0.85"/>
    <!-- Inner ring (core) -->
    <circle cx="0" cy="0" r="95" fill="#018786" opacity="0.15" stroke="#018786" stroke-width="2"/>
    <!-- Core label -->
    <text x="0" y="-5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="bold" fill="#018786" text-anchor="middle" letter-spacing="3">CORE</text>
    <text x="0" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#94a3b8" text-anchor="middle">OpenCode</text>
    <text x="0" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b" text-anchor="middle">MIT · 190k ★</text>

    <!-- Middle ring label: 136 plugins -->
    <text x="0" y="-180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FF9800" text-anchor="middle" font-weight="bold">136 PLUGINS</text>
    <text x="0" y="-163" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">memory · auth · multi-agent</text>

    <!-- Outer ring labels: 64 projects + 9 agents + 7 themes -->
    <text x="-260" y="-50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FF9800" font-weight="bold">64</text>
    <text x="-260" y="-35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8">PROJECTS</text>
    <text x="260" y="-50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FF9800" font-weight="bold" text-anchor="end">9</text>
    <text x="260" y="-35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" text-anchor="end">AGENTS</text>
    <text x="-260" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FF9800" font-weight="bold">7</text>
    <text x="-260" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8">THEMES</text>
    <text x="260" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#FF9800" font-weight="bold" text-anchor="end">7</text>
    <text x="260" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94a3b8" text-anchor="end">RESOURCES</text>
  </g>

  <!-- Title block -->
  <g transform="translate(60, 530)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="48" font-weight="bold" fill="#F8FAFC">Awesome OpenCode</text>
    <text x="0" y="42" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#FF9800">The Ecosystem Zoo</text>
    <text x="0" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94a3b8">10 memory plugins · 4 HN critiques · the community's response</text>
  </g>

  <!-- Side accent dots -->
  <g fill="#018786">
    <circle cx="1100" cy="100" r="3"/>
    <circle cx="1130" cy="130" r="2"/>
    <circle cx="1080" cy="150" r="2"/>
    <circle cx="1140" cy="170" r="3"/>
  </g>
  <g fill="#FF9800" opacity="0.6">
    <circle cx="80" cy="500" r="2"/>
    <circle cx="105" cy="510" r="2"/>
    <circle cx="60" cy="515" r="3"/>
  </g>
</svg>
