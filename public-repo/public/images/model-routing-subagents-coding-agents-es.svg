<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with subtle grid -->
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#018786"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="36" font-weight="700" fill="#F8FAFC">Model Routing for Subagents</text>
  <text x="60" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="400" fill="#94A3B8">Cada subagente → el modelo correcto. Ahorro 30–80%.</text>

  <!-- User prompt box -->
  <rect x="60" y="170" width="240" height="80" rx="8" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="600" fill="#F8FAFC">PROMPT DEL USUARIO</text>
  <text x="180" y="225" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">"Refactoriza este módulo"</text>

  <!-- Arrow to Orchestrator -->
  <line x1="300" y1="210" x2="400" y2="210" stroke="#018786" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#018786"/>
    </marker>
  </defs>

  <!-- Orchestrator (Brick) -->
  <rect x="410" y="150" width="220" height="120" rx="10" fill="url(#orchGrad)" stroke="#FF9800" stroke-width="2"/>
  <text x="520" y="185" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#F8FAFC">BRICK ROUTER</text>
  <text x="520" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0F172A">Clasifica 6 dimensiones</text>
  <text x="520" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0F172A">Estima complejidad</text>
  <text x="520" y="246" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#0F172A">Enruta al mejor backend</text>
  <text x="520" y="262" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#0F172A" font-weight="700">Apache-2.0 · Go</text>

  <!-- 6 subagent boxes -->
  <!-- Top row -->
  <rect x="700" y="100" width="160" height="60" rx="6" fill="#1E293B" stroke="#018786" stroke-width="1.5"/>
  <text x="780" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">planner</text>
  <text x="780" y="143" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">qwen3.5-122b</text>
  <text x="780" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$1.00 / $4.20</text>

  <rect x="880" y="100" width="160" height="60" rx="6" fill="#1E293B" stroke="#018786" stroke-width="1.5"/>
  <text x="960" y="125" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">coder</text>
  <text x="960" y="143" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">qwen3-coder-next</text>
  <text x="960" y="155" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$0.50 / $2.00</text>

  <!-- Mid row -->
  <rect x="700" y="180" width="160" height="60" rx="6" fill="#1E293B" stroke="#018786" stroke-width="1.5"/>
  <text x="780" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">researcher</text>
  <text x="780" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">gemma4-31b</text>
  <text x="780" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$0.40 / $2.10</text>

  <rect x="880" y="180" width="160" height="60" rx="6" fill="#1E293B" stroke="#018786" stroke-width="1.5"/>
  <text x="960" y="205" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">reviewer</text>
  <text x="960" y="223" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">mistral-small-4</text>
  <text x="960" y="235" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$0.50 / $2.10</text>

  <!-- Bottom row -->
  <rect x="700" y="260" width="160" height="60" rx="6" fill="#1E293B" stroke="#018786" stroke-width="1.5"/>
  <text x="780" y="285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">devops</text>
  <text x="780" y="303" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">qwen3.6-27b</text>
  <text x="780" y="315" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$0.50 / $2.10</text>

  <rect x="880" y="260" width="160" height="60" rx="6" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="960" y="285" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#F8FAFC">explore</text>
  <text x="960" y="303" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#FF9800">qwen3.5-9b</text>
  <text x="960" y="315" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">$0.10 / $0.40</text>

  <!-- Connection lines from orchestrator to subagents -->
  <line x1="630" y1="190" x2="700" y2="130" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="200" x2="700" y2="130" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="210" x2="700" y2="210" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="215" x2="700" y2="210" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="225" x2="700" y2="290" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="230" x2="880" y2="130" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="235" x2="880" y2="210" stroke="#018786" stroke-width="1" opacity="0.5"/>
  <line x1="630" y1="245" x2="880" y2="290" stroke="#FF9800" stroke-width="2"/>

  <!-- Cost comparison -->
  <rect x="60" y="380" width="1080" height="180" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="600" y="415" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#F8FAFC">Ahorro realista en una sesión típica (50K input + 10K output)</text>

  <!-- Baseline -->
  <rect x="100" y="445" width="280" height="80" rx="6" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
  <text x="240" y="470" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#94A3B8">Single model (qwen3.6-27b)</text>
  <text x="240" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#F8FAFC">$0.046</text>
  <text x="240" y="518" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">línea base</text>

  <!-- Routing -->
  <rect x="460" y="445" width="280" height="80" rx="6" fill="#0F172A" stroke="#018786" stroke-width="2"/>
  <text x="600" y="470" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#018786">Brick routing (≈30%)</text>
  <text x="600" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#F8FAFC">$0.032</text>
  <text x="600" y="518" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">promedio real</text>

  <!-- Ceiling -->
  <rect x="820" y="445" width="280" height="80" rx="6" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
  <text x="960" y="470" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#FF9800">Tech Brick (80% ceiling)</text>
  <text x="960" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#F8FAFC">$0.009</text>
  <text x="960" y="518" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">techo teórico</text>

  <!-- Footer / brand -->
  <text x="60" y="600" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#94A3B8">ARCEAPPS · 2026</text>
  <text x="1140" y="600" text-anchor="end" font-family="ui-monospace, monospace" font-size="12" fill="#94A3B8">OpenCode + Brick + 6 subagentes</text>
</svg>
