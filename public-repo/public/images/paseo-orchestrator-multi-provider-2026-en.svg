<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Paseo: coding agent orchestrator - daemon, clients, relay architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top brand mark -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#94A3B8">
    <text x="60" y="55" letter-spacing="0.15em">ARCEAPPS · DEEP DIVE</text>
    <text x="60" y="75" fill="#FF9800" font-size="12">PASEO · 2026-08-15</text>
  </g>

  <!-- Heading -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <text x="600" y="125" font-size="38" fill="#F8FAFC" font-weight="bold">Paseo</text>
    <text x="600" y="155" font-size="18" fill="#FF9800">the multi-provider orchestrator that rewrote the category</text>
    <text x="600" y="180" font-size="13" fill="#94A3B8">daemon + clients + Elixir relay · 13.7k ★ · AGPL-3.0 · team of one</text>
  </g>

  <!-- Architecture diagram -->
  <g transform="translate(600 380)" font-family="ui-monospace, monospace">

    <!-- Center: Daemon -->
    <g transform="translate(0 0)">
      <circle cx="0" cy="0" r="80" fill="#FF9800" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="60" fill="#0F172A"/>
      <text x="0" y="-6" text-anchor="middle" font-size="13" fill="#FF9800" font-weight="bold">DAEMON</text>
      <text x="0" y="12" text-anchor="middle" font-size="9" fill="#94A3B8">127.0.0.1:6767</text>
      <text x="0" y="26" text-anchor="middle" font-size="9" fill="#64748B">@getpaseo/client</text>
    </g>

    <!-- 4 Clients (top arc) -->
    <g transform="translate(-280 -180)">
      <rect x="-44" y="-22" width="88" height="44" rx="6" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-size="11" fill="#018786" font-weight="bold">DESKTOP</text>
      <text x="0" y="16" text-anchor="middle" font-size="9" fill="#64748B">Electron</text>
    </g>
    <g transform="translate(-100 -200)">
      <rect x="-44" y="-22" width="88" height="44" rx="6" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-size="11" fill="#018786" font-weight="bold">WEB / PWA</text>
      <text x="0" y="16" text-anchor="middle" font-size="9" fill="#64748B">Expo</text>
    </g>
    <g transform="translate(100 -200)">
      <rect x="-44" y="-22" width="88" height="44" rx="6" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-size="11" fill="#018786" font-weight="bold">iOS</text>
      <text x="0" y="16" text-anchor="middle" font-size="9" fill="#64748B">App Store</text>
    </g>
    <g transform="translate(280 -180)">
      <rect x="-44" y="-22" width="88" height="44" rx="6" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <text x="0" y="3" text-anchor="middle" font-size="11" fill="#018786" font-weight="bold">ANDROID</text>
      <text x="0" y="16" text-anchor="middle" font-size="9" fill="#64748B">Play · F-Droid</text>
    </g>

    <!-- 5 Agents (bottom arc) -->
    <g transform="translate(-280 180)">
      <circle cx="0" cy="0" r="42" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Claude</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Code</text>
    </g>
    <g transform="translate(-140 200)">
      <circle cx="0" cy="0" r="42" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="3" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Codex</text>
    </g>
    <g transform="translate(0 210)">
      <circle cx="0" cy="0" r="42" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="3" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">OpenCode</text>
    </g>
    <g transform="translate(140 200)">
      <circle cx="0" cy="0" r="42" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="3" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">Copilot</text>
    </g>
    <g transform="translate(280 180)">
      <circle cx="0" cy="0" r="42" fill="#018786" filter="url(#glow)"/>
      <text x="0" y="-3" text-anchor="middle" font-size="10" fill="#0F172A" font-weight="bold">+31</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#0F172A">agents</text>
    </g>

    <!-- Connection lines: clients to daemon -->
    <line x1="-280" y1="-180" x2="-60" y2="-50" stroke="#FF9800" stroke-width="1" opacity="0.5"/>
    <line x1="-100" y1="-200" x2="-30" y2="-70" stroke="#FF9800" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="-200" x2="30" y2="-70" stroke="#FF9800" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="-180" x2="60" y2="-50" stroke="#FF9800" stroke-width="1" opacity="0.5"/>

    <!-- Connection lines: daemon to agents -->
    <line x1="-280" y1="180" x2="-60" y2="50" stroke="#018786" stroke-width="1" opacity="0.5"/>
    <line x1="-140" y1="200" x2="-30" y2="70" stroke="#018786" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="210" x2="0" y2="80" stroke="#018786" stroke-width="1" opacity="0.5"/>
    <line x1="140" y1="200" x2="30" y2="70" stroke="#018786" stroke-width="1" opacity="0.5"/>
    <line x1="280" y1="180" x2="60" y2="50" stroke="#018786" stroke-width="1" opacity="0.5"/>

    <!-- Relay (lateral, dashed) -->
    <g transform="translate(380 0)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0F172A" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="0" y="-8" text-anchor="middle" font-size="11" fill="#FF9800" font-weight="bold">RELAY</text>
      <text x="0" y="6" text-anchor="middle" font-size="9" fill="#94A3B8">Elixir · BEAM</text>
      <text x="0" y="20" text-anchor="middle" font-size="9" fill="#64748B">opt-in E2E</text>
    </g>
    <line x1="80" y1="0" x2="330" y2="0" stroke="#FF9800" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- Bottom legend -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">
    <rect x="60" y="555" width="14" height="14" fill="#FF9800"/>
    <text x="82" y="567">daemon · Elixir relay (opt-in)</text>
    <rect x="320" y="555" width="14" height="14" fill="#018786"/>
    <text x="342" y="567">clients · agents (35+ via ACP)</text>

    <text x="60" y="595" fill="#64748B">EN · 5,471 words · 14 sections · 30+ sources</text>
    <text x="1140" y="595" text-anchor="end" fill="#64748B">arceapps.com</text>
  </g>
</svg>
