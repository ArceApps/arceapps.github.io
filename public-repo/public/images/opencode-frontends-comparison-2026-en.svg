<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="60" y="120" fill="#f8fafc" font-size="44" font-weight="700" filter="url(#textGlow)">OpenCode in visual mode</text>
  <text x="60" y="170" fill="#FF9800" font-size="30" font-weight="600">4 frontends · 1 honest comparison</text>
  <text x="60" y="220" fill="#cbd5e1" font-size="18">OpenChamber · CodeNomad · nomacode · opencode-mobile</text>
  <text x="60" y="248" fill="#94a3b8" font-size="16">Desktop &amp; mobile, with primary data from each repo (2026-07-27)</text>

  <g transform="translate(60,300)">
    <g transform="translate(0,0)">
      <rect width="260" height="200" rx="14" fill="#0b1226" stroke="#018786" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="36" rx="14" fill="#018786" opacity="0.85"/>
      <text x="14" y="24" fill="#0F172A" font-size="14" font-weight="700">OPENCHAMBER</text>
      <text x="14" y="74" fill="#34d399" font-size="14">Desktop · Web · PWA</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="13">Multi-device continuity</text>
      <text x="14" y="124" fill="#cbd5e1" font-size="13">Cloudflare tunnel + QR pair</text>
      <text x="14" y="170" fill="#FF9800" font-size="22" font-weight="700">6,928 ⭐</text>
    </g>
    <g transform="translate(280,0)">
      <rect width="260" height="200" rx="14" fill="#0b1226" stroke="#FF9800" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="36" rx="14" fill="#FF9800" opacity="0.85"/>
      <text x="14" y="24" fill="#0F172A" font-size="14" font-weight="700">CODENOMAD</text>
      <text x="14" y="74" fill="#FFB74D" font-size="14">Desktop · Web · Server</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="13">Multi-instance + worktrees</text>
      <text x="14" y="124" fill="#cbd5e1" font-size="13">SideCars (VSCode / ttyd)</text>
      <text x="14" y="170" fill="#34d399" font-size="22" font-weight="700">2,408 ⭐</text>
    </g>
    <g transform="translate(560,0)">
      <rect width="260" height="200" rx="14" fill="#0b1226" stroke="#FBBF24" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="36" rx="14" fill="#FBBF24" opacity="0.85"/>
      <text x="14" y="24" fill="#0F172A" font-size="14" font-weight="700">NOMACODE</text>
      <text x="14" y="74" fill="#FBBF24" font-size="14">Android · Termux · PWA</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="13">Claude Code native</text>
      <text x="14" y="124" fill="#cbd5e1" font-size="13">OpenCode via proot (slow)</text>
      <text x="14" y="170" fill="#FF9800" font-size="22" font-weight="700">56 ⭐</text>
    </g>
    <g transform="translate(840,0)">
      <rect width="280" height="200" rx="14" fill="#0b1226" stroke="#8B7EC8" stroke-width="2"/>
      <rect x="0" y="0" width="280" height="36" rx="14" fill="#8B7EC8" opacity="0.85"/>
      <text x="14" y="24" fill="#0F172A" font-size="14" font-weight="700">OPENCODE-MOBILE</text>
      <text x="14" y="74" fill="#c4b5fd" font-size="14">Native Android · Expo</text>
      <text x="14" y="100" fill="#cbd5e1" font-size="13">Pure OpenCode over Tailscale</text>
      <text x="14" y="124" fill="#cbd5e1" font-size="13">WireGuard encryption</text>
      <text x="14" y="170" fill="#FF9800" font-size="22" font-weight="700">44 ⭐</text>
    </g>
  </g>

  <rect x="0" y="560" width="1200" height="70" fill="#0b1226"/>
  <text x="60" y="600" fill="#94a3b8" font-size="14">arceapps.com/blog/opencode-frontends-comparison-2026  ·  arceapps.com/es/blog/opencode-frontends-comparativa-2026</text>
  <text x="1140" y="600" fill="#FF9800" font-size="16" font-weight="700" text-anchor="end">ARCEAPPS · 2026</text>
</svg>
