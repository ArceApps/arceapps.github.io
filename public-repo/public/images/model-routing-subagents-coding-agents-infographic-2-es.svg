<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="60" y="60" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#F8FAFC">Tres stacks de routing, lado a lado</text>
  <text x="60" y="88" font-family="ui-monospace, monospace" font-size="14" fill="#94A3B8">Brick · opencode-subagent-router · DIY con hook nativo</text>

  <!-- Three columns -->
  <!-- Column 1: Brick -->
  <rect x="60" y="120" width="340" height="450" rx="10" fill="#1E293B" stroke="#FF9800" stroke-width="2"/>
  <text x="80" y="150" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">STACK 1</text>
  <text x="80" y="180" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#F8FAFC">BRICK</text>
  <text x="80" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">Mixture-of-Models gateway</text>
  <text x="80" y="216" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">Apache-2.0 · Go · externo</text>

  <line x1="80" y1="232" x2="380" y2="232" stroke="#334155" stroke-width="1"/>

  <text x="80" y="258" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">PROS</text>
  <text x="80" y="278" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Clasificación dinámica</text>
  <text x="80" y="295" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Funciona con 3 agentes</text>
  <text x="80" y="312" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Sticky mode + escalación</text>
  <text x="80" y="329" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• CLI de inspección</text>

  <text x="80" y="358" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">CONTRAS</text>
  <text x="80" y="378" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• +150ms latencia</text>
  <text x="80" y="395" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Servicio externo</text>
  <text x="80" y="412" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Beta (`brick-v1-beta`)</text>

  <rect x="80" y="440" width="300" height="60" rx="6" fill="#0F172A" stroke="#FF9800" stroke-width="1"/>
  <text x="230" y="463" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">IDEAL PARA</text>
  <text x="230" y="483" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">Equipos con pool diverso</text>
  <text x="230" y="498" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">que necesitan observación centralizada</text>

  <text x="230" y="525" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FF9800">Setup:</text>
  <text x="230" y="543" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">~2 horas</text>

  <!-- Column 2: opencode-subagent-router -->
  <rect x="430" y="120" width="340" height="450" rx="10" fill="#1E293B" stroke="#018786" stroke-width="2"/>
  <text x="450" y="150" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#018786">STACK 2</text>
  <text x="450" y="180" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#F8FAFC">SUBAGENT-ROUTER</text>
  <text x="450" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">Hook en OpenCode</text>
  <text x="450" y="216" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">in-process · provider-agnostic</text>

  <line x1="450" y1="232" x2="750" y2="232" stroke="#334155" stroke-width="1"/>

  <text x="450" y="258" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">PROS</text>
  <text x="450" y="278" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Sin servicio externo</text>
  <text x="450" y="295" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Soporta cualquier provider</text>
  <text x="450" y="312" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Smart escalation automática</text>
  <text x="450" y="329" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Quality guardrails</text>

  <text x="450" y="358" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">CONTRAS</text>
  <text x="450" y="378" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Released jul 2026</text>
  <text x="450" y="395" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Solo OpenCode</text>
  <text x="450" y="412" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• License a verificar</text>

  <rect x="450" y="440" width="300" height="60" rx="6" fill="#0F172A" stroke="#018786" stroke-width="1"/>
  <text x="600" y="463" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#018786">IDEAL PARA</text>
  <text x="600" y="483" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">Indies multi-provider</text>
  <text x="600" y="498" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">que no quieren infra externa</text>

  <text x="600" y="525" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#018786">Setup:</text>
  <text x="600" y="543" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">~30 min</text>

  <!-- Column 3: DIY -->
  <rect x="800" y="120" width="340" height="450" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <text x="820" y="150" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94A3B8">STACK 3</text>
  <text x="820" y="180" font-family="ui-monospace, monospace" font-size="18" font-weight="700" fill="#F8FAFC">DIY</text>
  <text x="820" y="200" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">agent.model por subagente</text>
  <text x="820" y="216" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">estático · sin servicios</text>

  <line x1="820" y1="232" x2="1120" y2="232" stroke="#334155" stroke-width="1"/>

  <text x="820" y="258" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">PROS</text>
  <text x="820" y="278" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Cero infraestructura</text>
  <text x="820" y="295" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• 10 min de setup</text>
  <text x="820" y="312" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Máxima reproducibilidad</text>
  <text x="820" y="329" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Funciona en cualquier agente</text>

  <text x="820" y="358" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F8FAFC">CONTRAS</text>
  <text x="820" y="378" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Routing estático</text>
  <text x="820" y="395" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• Sin escalación automática</text>
  <text x="820" y="412" font-family="ui-monospace, monospace" font-size="11" fill="#94A3B8">• No escala a muchos modelos</text>

  <rect x="820" y="440" width="300" height="60" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-width="1"/>
  <text x="970" y="463" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94A3B8">IDEAL PARA</text>
  <text x="970" y="483" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">Empezar hoy con 4 modelos</text>
  <text x="970" y="498" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#94A3B8">Haiku + Sonnet + Opus</text>

  <text x="970" y="525" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94A3B8">Setup:</text>
  <text x="970" y="543" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#F8FAFC">10 min</text>

  <!-- Footer -->
  <text x="60" y="615" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">ARCEAPPS · 2026 · Model Routing for Subagents · Los tres caminos funcionan</text>
</svg>
