<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="OpenChamber Session Goals: loop verificable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9800"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#018786"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="60" y="55" font-size="13" fill="#94A3B8" letter-spacing="0.15em">ARCEAPPS · INFOGRAFÍA · LOOP</text>
    <text x="60" y="100" font-size="32" fill="#F8FAFC" font-weight="bold">Session Goals: el loop verificable</text>
    <text x="60" y="130" font-size="16" fill="#018786">el agente termina cuando el objetivo se cumple, no cuando se acaban los tokens</text>
  </g>

  <!-- Flow: 4 steps in a loop -->
  <g transform="translate(60 200)" font-family="ui-monospace, monospace">

    <!-- Step 1: Set goal -->
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="240" height="180" rx="8" fill="#0F172A" stroke="#018786" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="36" rx="8" fill="#018786"/>
      <text x="120" y="24" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">1. SET GOAL</text>
      <text x="15" y="62" font-size="11" fill="#F8FAFC">"Refactoriza el módulo</text>
      <text x="15" y="80" font-size="11" fill="#F8FAFC">de auth, ejecuta los tests,</text>
      <text x="15" y="98" font-size="11" fill="#F8FAFC">no pares hasta que pasen."</text>
      <text x="15" y="130" font-size="10" fill="#94A3B8">verificable</text>
      <text x="15" y="148" font-size="10" fill="#94A3B8">límite de turnos</text>
      <text x="15" y="166" font-size="10" fill="#94A3B8">app cerrada o no</text>
    </g>

    <!-- Step 2: Agent works -->
    <g transform="translate(290 0)">
      <rect x="0" y="0" width="240" height="180" rx="8" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="36" rx="8" fill="#FF9800"/>
      <text x="120" y="24" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">2. AGENT WORKS</text>
      <text x="15" y="62" font-size="11" fill="#F8FAFC">Itera turno tras turno.</text>
      <text x="15" y="80" font-size="11" fill="#F8FAFC">Lee código, ejecuta tests,</text>
      <text x="15" y="98" font-size="11" fill="#F8FAFC">corrige errores, repite.</text>
      <text x="15" y="130" font-size="10" fill="#94A3B8">puede durar 23 minutos</text>
      <text x="15" y="148" font-size="10" fill="#94A3B8">sin intervención</text>
      <text x="15" y="166" font-size="10" fill="#94A3B8">sesión sigue viva</text>
    </g>

    <!-- Step 3: Check result -->
    <g transform="translate(580 0)">
      <rect x="0" y="0" width="240" height="180" rx="8" fill="#0F172A" stroke="#018786" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="36" rx="8" fill="#018786"/>
      <text x="120" y="24" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">3. CHECK RESULT</text>
      <text x="15" y="62" font-size="11" fill="#F8FAFC">OpenChamber chequea</text>
      <text x="15" y="80" font-size="11" fill="#F8FAFC">después de cada turno.</text>
      <text x="15" y="98" font-size="11" fill="#F8FAFC">Tests pasan?</text>
      <text x="15" y="130" font-size="10" fill="#94A3B8">configurable</text>
      <text x="15" y="148" font-size="10" fill="#94A3B8">endpoint, archivo,</text>
      <text x="15" y="166" font-size="10" fill="#94A3B8">condición arbitraria</text>
    </g>

    <!-- Step 4: Outcome -->
    <g transform="translate(870 0)">
      <rect x="0" y="0" width="240" height="180" rx="8" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="36" rx="8" fill="#FF9800"/>
      <text x="120" y="24" text-anchor="middle" font-size="13" fill="#0F172A" font-weight="bold">4. OUTCOME</text>
      <text x="15" y="62" font-size="11" fill="#F8FAFC">✓ Goal cumplido</text>
      <text x="15" y="80" font-size="11" fill="#F8FAFC">✓ Bloqueado: motivo</text>
      <text x="15" y="98" font-size="11" fill="#F8FAFC">✓ Límite alcanzado</text>
      <text x="15" y="130" font-size="10" fill="#94A3B8">no puede declarar</text>
      <text x="15" y="148" font-size="10" fill="#94A3B8">victoria sin verificar</text>
    </g>

    <!-- Arrows between steps -->
    <path d="M 245 90 L 286 90" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 535 90 L 576 90" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 825 90 L 866 90" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Loop back arrow -->
  <g transform="translate(60 420)" font-family="ui-monospace, monospace">
    <path d="M 0 30 Q 540 100 1080 30" stroke="#018786" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowTeal)"/>
    <text x="540" y="120" text-anchor="middle" font-size="12" fill="#018786">si no se cumple: vuelve a paso 2 (siguiente turno)</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#64748B">
    <text x="60" y="595">teal = user / verifier · orange = agent run · no hay "ya está" sin verificar</text>
    <text x="1140" y="595" text-anchor="end" fill="#94A3B8">arceapps.com</text>
  </g>
</svg>
