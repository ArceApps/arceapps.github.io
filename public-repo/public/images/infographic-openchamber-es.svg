<text x="14" y="92" fill="#cbd5e1" font-size="13">• Voice input integrado</text>
<text x="14" y="122" fill="#cbd5e1" font-size="13">• GitHub-native (issues/PRs)</text>
<text x="14" y="152" fill="#cbd5e1" font-size="13">• Extensión VS Code oficial</text>
