<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0F172A"/>
  <rect width="1200" height="630" fill="url(#grid2)"/>

  <!-- Title -->
  <text x="60" y="55" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="bold" fill="#F8FAFC">Anatomía del Zoo · 6 categorías · 223 entradas</text>
  <text x="60" y="80" font-family="ui-monospace, monospace" font-size="13" fill="#94a3b8">Lo que la comunidad construyó sobre OpenCode en 2026</text>

  <!-- 6 category cards in 2x3 grid -->
  <g transform="translate(60, 120)">
    <!-- Official Repositories (4) -->
    <g transform="translate(0, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#018786"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">01 · OFFICIAL</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Repositories</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">4</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">SDKs JS, Go, Python + core</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">baja densidad · solo el core</text>
    </g>

    <!-- Plugins (136) -->
    <g transform="translate(370, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#FF9800" stroke-width="2"/>
      <rect x="0" y="0" width="6" height="140" fill="#FF9800"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#FF9800" letter-spacing="2">02 · PLUGINS ★</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Plugins</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">136</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">memoria · auth · orquestación</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">donde vive el 80% del valor</text>
    </g>

    <!-- Agents (9) -->
    <g transform="translate(740, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#018786"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">03 · AGENTS</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Sub-agents</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">9</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">harnesses y expert teams</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">riqueza conceptual alta</text>
    </g>
  </g>

  <g transform="translate(60, 280)">
    <!-- Projects (64) -->
    <g transform="translate(0, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#018786"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">04 · PROJECTS</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Projects</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">64</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Neovim · Mobile · GUI · A2A</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">clientes y runtimes</text>
    </g>

    <!-- Themes (7) -->
    <g transform="translate(370, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#018786"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">05 · THEMES</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Themes</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">7</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">Ayu · Poimandres · VSCode</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">sección corta pero útil</text>
    </g>

    <!-- Resources (7) -->
    <g transform="translate(740, 0)">
      <rect width="350" height="140" rx="8" fill="#0F172A" stroke="#018786" stroke-width="1.5"/>
      <rect x="0" y="0" width="6" height="140" fill="#018786"/>
      <text x="20" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8" letter-spacing="2">06 · RESOURCES</text>
      <text x="20" y="60" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC">Resources</text>
      <text x="20" y="92" font-family="ui-monospace, monospace" font-size="28" font-weight="bold" fill="#FF9800">7</text>
      <text x="80" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#94a3b8">starters · guías · passports</text>
      <text x="20" y="120" font-family="ui-monospace, monospace" font-size="11" fill="#64748b">ideales para arrancar</text>
    </g>
  </g>

  <!-- Footer note -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="100" rx="8" fill="#018786" opacity="0.08" stroke="#018786" stroke-width="1"/>
    <text x="30" y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#018786">Insight</text>
    <text x="30" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#F8FAFC">El 61% del zoo son plugins. El subdominio más denso es memoria persistente</text>
    <text x="30" y="80" font-family="ui-monospace, monospace" font-size="12" fill="#94a3b8">(≥15 piezas activas — el siguiente diagrama las compara en detalle)</text>
  </g>

  <!-- Brand mark bottom-right -->
  <text x="1140" y="610" font-family="ui-monospace, monospace" font-size="10" fill="#64748b" text-anchor="end">ARCEAPPS · awesome-opencode-ecosystem</text>
</svg>
